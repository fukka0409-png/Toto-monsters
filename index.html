function advMsg(t){ const m=document.getElementById("advMsg"); if(!m) return; m.textContent=t; m.classList.add("on"); clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove("on"),2600); }
function advPop(x,y,txt,col){ A.pops.push({x,y,txt,col:col||"#fff",t:0}); }

/* ---------- 炎魔法：当たった魔物が燃える ----------
   2秒のあいだ、0.25秒ごとに「放ったときのダメージの1/10」。燃えている魔物にくっついている魔物にも燃え広がる（同じ炎で同じ魔物は1回だけ） */
function advIgnite(e,id,dmg){ if(e.dead) return; e.burn={t:ADV.BURN_SEC, tick:0, d:Math.max(1,Math.round(dmg/ADV.BURN_DIV)), id}; (e.burnIds=e.burnIds||{})[id]=1; }
function advBurns(dt){
  A.enemies.forEach(e=>{ if(!e.burn||e.dead) return; const b=e.burn; b.t-=dt; b.tick+=dt;
    while(b.tick>=ADV.BURN_TICK && b.t>-0.01){ b.tick-=ADV.BURN_TICK; advDamageEnemy(e,b.d,"#ff8a3d"); if(e.dead) break; }
    if(e.dead||b.t<=0){ e.burn=null; return; }
    A.enemies.forEach(o=>{ if(o===e||o.dead||(o.burnIds&&o.burnIds[b.id])) return;
      if(Math.abs(o.x-e.x)<(o.w+e.w)*0.5+0.01 && Math.abs((o.y||0)-(e.y||0))<0.08) advIgnite(o,b.id,b.d*ADV.BURN_DIV); }); });
  if(A.booms){ A.booms.forEach(x=>x.t+=dt); A.booms=A.booms.filter(x=>x.t<0.45); }
}
/* ---------- 風魔法：竜巻 ----------
   風の玉が少し飛んで地面で竜巻になり、だんだん大きくなりながら前へ進む。
   触れた敵は竜巻に吸いつき、ぐるぐる上昇しながら運ばれて、そのあいだダメージを受け続ける。画面の外に出たら竜巻は消える */
function advWinds(dt){
  const vw=A.W/A.P;
  A.winds.forEach(w=>{ w.t+=dt;
    if(w.gt<0){ w.x+=w.dir*1.6*dt; const hit=A.enemies.some(e=>!e.dead&&!e.caught&&(e.x-w.x)*w.dir<e.w*0.5&&(e.x-w.x)*w.dir>-0.05); if(w.t>=0.1||hit){ w.gt=0; w.y=0; } return; }   // 風の玉：敵に当たるか少し進んだら竜巻に   // 風の玉
    w.gt+=dt; const g=Math.min(1,w.gt/0.5); w.g=g;
    w.x+=w.dir*(0.1+0.22*g)*dt;
    const hw=0.035+0.09*g, top=0.1+0.45*g;
    A.enemies.forEach(e=>{ if(e.dead||e.caught||e.extraNoWind) return;
      if(Math.abs(e.x-w.x)<hw+e.w*0.4 && (e.y||0)<top){ e.caught=w; e.cph=Math.random()*6.28; e.st=null; e.warn=0; e.zone=null; e.frozen=0; advDamageEnemy(e,w.dmg); } });
    w.tick+=dt; if(w.tick>=0.25){ w.tick-=0.25; A.enemies.forEach(e=>{ if(e.caught===w && !e.dead) advDamageEnemy(e,w.dmg*0.2); }); }   // つかまっている間：1秒に攻撃力の80%
    A.enemies.forEach(e=>{ if(e.caught!==w || e.dead) return; e.cph+=dt*7; const r=hw*0.85;
      e.x=w.x+Math.sin(e.cph)*r; e.y=Math.min(top*0.85,(e.y||0)+dt*0.3); e.dir=Math.cos(e.cph)>0?1:-1; });
    if(w.t>=1.5 || w.x<A.cam-0.15 || w.x>A.cam+vw+0.15) w.done=true; });   // 竜巻は1.5秒で消える（画面の外に出たらその時点で）
  A.winds.forEach(w=>{ if(!w.done) return; A.enemies.forEach(e=>{ if(e.caught===w){ e.caught=null; e.vy=0; if(!(e.y>0)) e.y=0.01; } }); });
  A.winds=A.winds.filter(w=>!w.done);
}
/* ---------- 敵 ---------- */
// 魔物を誘惑する：コインなしで何回でも。押した時点のLvの魔物が、画面に追加で4体出てくる
function advLure(){ if(!A||A.dead||A.over||advPaused()) return; const lv=A.stageLv;
  for(let i=0;i<4;i++){ advSpawn(lv,"lure"); const e=A.enemies[A.enemies.length-1]; e.x+=i*(e.w*0.9); }
  try{ SFX.tap(); }catch(e){} advMsg(advT2("💕 Lv{n}の魔物が4体おびき寄せられた！").replace("{n}",lv)); }
function advSpawn(lv,kind){
  const viewW=A.W/A.P, side=1;   // 魔物は基本、右からやってくる
  const d=ADV.SL[lv], big=lv>=10, hw=(big?0.32:0.17)*0.5+0.02, x = side<0 ? A.cam-hw : A.cam+viewW+hw;   // 画面のすぐ外から
  A.enemies.push({ x, lv, hp:d.hp, max:d.hp, atk:d.atk, spd:d.spd, warn:0, zone:null,
    w:big?0.32:0.17, dir:-side, cd:0.8, y:0, vy:0, off:0, st:null, frozen:0, dead:false, deadT:0, boss:big, extra:kind==="idle", lure:kind==="lure", hurt:0 });
}
const advEH = e => e.boss?0.26:0.12;   // 敵の背の高さ
function advEnemy(e,dt){
  if(e.dead){ e.deadT+=dt; return; }
  if(e.caught){ e.hurt=Math.max(0,e.hurt-dt); return; }   // 竜巻につかまっている間は動けない
  e.hurt=Math.max(0,e.hurt-dt);
  // 空から降ってきている間は、着地するまで何もしない
  // 着地したときにトトが落下範囲（ふつうの攻撃より少し広い・地面に赤い帯）にいたら、1.5倍のダメージ
  if(e.y>0){ e.vy-=3.4*dt; e.y+=e.vy*dt; const r=e.w*0.5+0.16; e.zone={a:e.x-r,b:e.x+r};
    if(e.y<=0){ e.y=0; e.vy=0; e.cd=Math.max(e.cd,0.5); advPop(e.x,0.05,advT2("ドスン"),"#fff");
      const z=e.zone; e.zone=null; if(!A.dead && A.x+0.05>z.a && A.x-0.05<z.b && A.y<0.2) advHurt(e.atk*1.5); }
    return; }
  // 画面から見えなくなって2秒たつと、トトの進む方向の少し先の上空から急に降ってくる
  const vw=A.W/A.P, seen=e.x>A.cam-e.w*0.5 && e.x<A.cam+vw+e.w*0.5;
  if(seen) e.off=0; else if((e.off+=dt)>=2){ e.off=0; e.st=null; e.warn=0; e.zone=null; e.frozen=0;
    e.x=Math.max(A.cam+e.w, Math.min(A.cam+vw-e.w, A.x+A.dir*(0.45+Math.random()*0.25))); e.y=1.25; e.vy=-0.6; e.dir=A.x>e.x?1:-1; return; }
  if(e.frozen>0){ e.frozen-=dt; e.st=null; e.warn=0; e.zone=null; return; }   // 氷づけ：動けない（攻撃も取り消し）
  const dx=A.x-e.x, dist=Math.abs(dx); e.cd-=dt;
  // ❗：攻撃の0.1秒前に頭上に出る。そのあいだ敵は止まり、当たる範囲が地面に赤く出る
  if(e.warn>0){ e.warn-=dt; if(e.warn<=0){ e.warn=0; e.st={t:0,hit:false}; } return; }
  if(e.st){ e.st.t+=dt; const T=e.st.t;
    if(T>0.25 && T<0.5) e.x+=e.dir*0.35*dt*(e.boss?1.5:1);   // とびかかる
    if(!e.st.hit && T>=0.45){ e.st.hit=true; const z=e.zone; if(!A.dead && z && A.x+0.05>z.a && A.x-0.05<z.b && A.y<0.2) advHurt(e.atk); }
    if(T>=0.75){ e.st=null; e.zone=null; e.cd=1.0+Math.random()*0.5; }
    return; }
  e.dir=dx>0?1:-1;
  // 前にいる仲間とは重ならないように、少し間をあけて並ぶ
  const blocked=A.enemies.some(o=>o!==e&&!o.dead&&(o.x-e.x)*e.dir>0&&Math.abs(o.x-e.x)<(o.w+e.w)*0.42);
  // トトより左へ通りすぎた魔物は、はなれるほどスピードを上げて戻ってくる
  const back = e.x<A.x ? Math.min(5, 1+2.5*Math.max(0,dist-0.15)) : 1;
  if(dist>e.w*0.5+0.1){ if(!blocked||back>1) e.x+=e.dir*e.spd*back*dt; }
  else if(e.cd<=0){ e.warn=ADV.WARN; const reach=e.w*0.5+0.14+(e.boss?0.13:0.09);   // 当たる範囲＝体の前側〜とびかかる先
    e.zone = e.dir>0 ? {a:e.x-e.w*0.3, b:e.x+reach} : {a:e.x-reach, b:e.x+e.w*0.3}; }
}
function advHurt(d){ if(A.inv0>0||A.dead) return; A.hp=Math.max(0,A.hp-d); A.hurtT=0.3; A.inv0=0.6; advPop(A.x,0.25,"-"+advNum(d),"#ff6a5a"); try{ SFX.ng(); }catch(e){} }
const advNum = n => n>=100?Math.round(n).toLocaleString():(Math.round(n*10)/10).toString();
function advDamageEnemy(e,d,col){
  const real=Math.max(0,Math.min(d,e.hp)); e.hp-=d; e.hurt=0.15; advGainXp(real); advPop(e.x+(col?(Math.random()-.5)*0.06:0),0.22+(e.boss?0.15:0)+(col?0.05:0),advNum(d),col||"#ffe14a"); try{ SFX.tap(); }catch(x){}
  if(e.hp<=0 && !e.dead){ e.dead=true; e.zone=null; try{ SFX.coin(); }catch(x){}
    (A.graves=A.graves||[]).push({x:e.x, t:0, boss:!!e.boss});   // たおした場所にお墓
    // ドロップ（それぞれ別に判定）：波動魔法の欠片20%・回復するやつ5%・氷魔法の欠片10%
    [["g",0.2],["heal",0.05],["b",0.1]].filter(([,r])=>Math.random()<r).forEach(([k],i)=>{ const it={k,u:ADV.SHARD[k]?ADV.SHARD[k].uses:1};
      if(A.inv.length>=ADV.INV_MAX) return advMsg(advT2("リュックがいっぱいで入らなかった…"));
      A.inv.push(it); setTimeout(()=>A&&advPop(e.x,0.34+i*0.08,"+"+advT2(advItemName(it)),k==="heal"?"#7cf07c":"#ffe14a"),i*220); });
    advBagRefresh();
    A.kills=(A.kills||0)+1; A.killed++; }
}
// トトのLvは、敵に与えたダメージの合計で上がる
function advGainXp(d){ const before=advLv(); A.xp+=d; const up=advLv()-before;
  if(up>0){ A.hp=Math.min(advMaxHp(), A.hp+up*ADV.HEAL_PER_LV); advPop(A.x,0.42,"Lv UP!","#7cf07c"); try{ SFX.level(); }catch(e){} } }
// 装備なしの攻撃：向いている方向の、すぐ前にいる敵だけに当たる（空中からだと、真下や後ろの敵には当たらない）
function advMelee(){
  const reach=ADV.MELEE_REACH, dmg=advMeleeDmg(), front=A.x+A.dir*0.03;
  const inFront=(x,hw)=>{ const near=(x-front)*A.dir-hw; return (x-A.x)*A.dir>0 && near<=reach; };
  A.enemies.forEach(e=>{ if(!e.dead && inFront(e.x,e.w*0.4) && A.y<(e.y||0)+advEH(e)+0.03 && A.y+0.15>(e.y||0)) advDamageEnemy(e,dmg); });
  A.chests.forEach(c=>{ if(!c.open && inFront(c.x,0.06) && A.y<0.12) advHitChest(c); });
}
// 魔法：向いている方向でいちばん近い的（敵・宝箱）をねらう。装備なしより遠くまで届く。間に宝箱があれば宝箱に当たる
function advMagicTarget(){
  let best=null, bd=Infinity;
  A.enemies.forEach(e=>{ if(e.dead) return; const d=(e.x-A.x)*A.dir; if(d>-0.02 && d<=ADV.MAGIC_RANGE && d<bd){ bd=d; best=e; } });
  A.chests.forEach(c=>{ if(c.open) return; const d=(c.x-A.x)*A.dir; if(d>-0.02 && d<=ADV.MAGIC_RANGE && d<=bd){ bd=d; best=c; c.chest=true; } });
  return best;
}
// ドラゴンうさぎの魔法弾（装備なし＝トトの3倍・氷＝さらに5倍で凍る）
function advDrFire(a){ const ice=!!a.it, dmg=advMeleeDmg()*DR_MUL*(ice?DR_ICE_MUL:1);
  A.bolts.push({ x:A.x+A.dir*0.16, x0:A.x, y:A.y+0.08, dmg, img:ice?"dr_bolt_b":"dr_bolt_r", boom:ice?"dr_boom_b":"dr_boom_r", dr:1, freeze:ice?(ADV.SHARD.b.freeze||0):0, fire:0, dir:A.dir, tg:ice?null:advMagicTarget(), life:3, pierce:ice?1:0, hits:[] });   // 氷は貫通：まっすぐ飛んで、通り道の敵ぜんぶに当たる
  try{ voice&&ac()&&voice(ac(),{f:ice?880:520,f2:ice?1320:780,dur:.12,vol:.06}); }catch(e){}
  if(!ice) return;
  const it=a.it; it.u--; if(it.u<=0){ const i=A.inv.indexOf(it); if(i>=0){ A.inv.splice(i,1); A.fuse=[-1,-1]; }
    const nx=A.inv.findIndex(x=>x.k===it.k&&!(A.stock||[]).includes(x));
    if(nx>=0){ A.eq=nx; advMsg(advT2("{n}を補充した！（のこり{m}個）").replace("{n}",advT2(ADV.SHARD.b.name)).replace("{m}",A.inv.filter(x=>x.k===it.k).length)); }
    else { A.eq=-1; advMsg(advT2("魔法の欠片を使い切った")); } }
  else A.eq=A.inv.indexOf(it);
  advEquipView(); advBagRefresh();
}
function advFire(it){ const sh=ADV.SHARD[it.k];
  const y=A.y+0.07;
  if(sh.wind) A.winds.push({ x:A.x+A.dir*0.14, y, dir:A.dir, t:0, gt:-1, dmg:advShardDmg(it.k), tick:0 });   // 風：風の玉 → 地面で竜巻になって進む
  else A.bolts.push({ x:A.x+A.dir*(sh.fire?0.2:0.12), x0:A.x, y, dmg:advShardDmg(it.k), img:sh.bolt, freeze:sh.freeze||0, fire:sh.fire?(A.fireId=(A.fireId||0)+1):0, dir:A.dir, tg:advMagicTarget(), life:3 });
  it.u--; if(it.u<=0){ const i=A.inv.indexOf(it); if(i>=0){ A.inv.splice(i,1); A.fuse=[-1,-1]; }
    // 同じ種類の欠片をまだ持っていれば、自動で装備しなおす（補充）
    const nx=A.inv.findIndex(x=>x.k===it.k&&!(A.stock||[]).includes(x));
    if(nx>=0){ A.eq=nx; advMsg(advT2("{n}を補充した！（のこり{m}個）").replace("{n}",advT2(sh.name)).replace("{m}",A.inv.filter(x=>x.k===it.k).length)); }
    else { A.eq=-1; advMsg(advT2("魔法の欠片を使い切った")); } }
  else A.eq=A.inv.indexOf(it);
  advEquipView(); advBagRefresh();
}

/* ---------- 宝箱 ---------- */
function advMaybeChest(side){
  if(Math.random()>=ADV.CHEST_CHANCE) return;
  const r=Math.random()*100, type = r<0.01?3 : r<19.01?2 : 1;   // 虹0.01%／赤い宝石19%／ふつう80%
  const viewW=A.W/A.P; A.chests.push({ chest:true, x: side>0 ? A.cam+viewW+0.4+Math.random()*1.5 : A.cam-0.4-Math.random()*1.5, type, open:false, openT:0 });
}
function advHitChest(c){
  if(c.type===3){ advMsg(advT2("虹の宝箱は「伝説の鍵」を使わないと開かない…")); return; }
  advOpenChest(c);
}
function advOpenChest(c){
  c.open=true; c.openT=0; try{ SFX.sparkle(); }catch(e){}
  const got=[];
  // 回復するやつ：どの宝箱からも出る（魔法の欠片の半分より低い確率）。コインは冒険の報酬といっしょにもらえる（死亡すると消える）
  let coin=0;
  if(c.type===1){ if(Math.random()<0.5) got.push({k:"g"}); if(Math.random()<0.2) got.push({k:"heal"}); }
  else if(c.type===2){ if(Math.random()<0.2) got.push({k:"key"}); if(Math.random()<0.5) got.push({k:"g"}); if(Math.random()<0.2) got.push({k:"heal"}); if(Math.random()<0.2) coin=1000; }
  else { got.push({k:"b"},{k:"b"},{k:"g"},{k:"g"},{k:"g"}); if(Math.random()<0.4) got.push({k:"heal"}); if(Math.random()<0.4) coin=5000; }
  if(coin){ A.coins=(A.coins||0)+coin; advPop(c.x,0.22,"+"+coin.toLocaleString()+advT2("コイン"),"#ffd75e"); advMsg(advT2("🪙 {n}コインを見つけた！（脱出・クリアするともらえる）").replace("{n}",coin.toLocaleString())); try{ SFX.coin(); }catch(e){} }
  if(!got.length&&!coin){ advPop(c.x,0.3,advT2("からっぽ…"),"#ccc"); return; }
  got.forEach((g,i)=>{ const it={k:g.k, u:ADV.SHARD[g.k]?ADV.SHARD[g.k].uses:1};
    if(A.inv.length>=ADV.INV_MAX){ advMsg(advT2("リュックがいっぱいで入らなかった…")); return; }
    A.inv.push(it); setTimeout(()=>A&&advPop(c.x,0.3+i*0.08,"+"+advT2(advItemName(it)),"#ffe14a"),i*250); });
  advBagRefresh();
}

/* ---------- 死亡・復活 ---------- */
// ランキングに出るのは「この区切りの中で最後に出した記録」（前より下がっていても、その記録で順位が決まる）
// advBestT/L＝ランキング用の最新の記録、advHiT/L＝この区切りの自己ベスト（画面の「最高記録」表示用）
function advRecord(t,lv){ let rec=false; advSync();
  if(t>(S.advHiT||0)){ S.advHiT=t; rec=true; } if(lv>(S.advHiL||0)){ S.advHiL=lv; rec=true; }
  S.advBestT=t; S.advBestL=lv;
  save(); queueProfile(true); return rec; }
function advDie(){
  if(A.dead||A.over) return; A.dead=true; A.deadT=0; A.atk=null; try{ SFX.ng(); }catch(e){}
  const t=A.kills||0, lv=advLv(); const rec=advRecord(t,lv);
  setTimeout(()=>advDeathScreen(t,lv,rec),1300);
}

    <button class="ad-btn" id="adRev" type="button" ${hearts?"":"disabled"}><img src="${typeof HEART_IMG!=="undefined"?HEART_IMG:""}" alt="">${advT2("ハート石を1個消費してこのまま復活する")}<small>${advT2("のこり")} ${hearts.toLocaleString()}${advT2("個")}</small></button>
    <div class="ad-coin lost">${advT2("このままタイトルに戻ると、報酬はなし。メモも消えてしまう…")}</div>

  document.getElementById("adv").appendChild(el);

    A.dead=false; A.hp=advMaxHp(); A.inv0=3; A.revives++; A.enemies.forEach(e=>{ if(Math.abs(e.x-A.x)<1.2) e.x+=(e.x>=A.x?1:-1)*1.5; e.st=null; e.warn=0; e.zone=null; }); A.idleT=0; A.last=performance.now(); advMsg(advT2("ハート石の力で復活した！")); try{ SFX.reveal("S"); }catch(e){} };
  const r=await advRanks(); const a=el.querySelector("#adR1"), b=el.querySelector("#adR2");
  if(a) a.textContent=advRk(r.t); if(b) b.textContent=advRk(r.l); const nx=el.querySelector(".ad-next"); if(nx) nx.innerHTML=advNextTxt(r).map(x=>`<div>${x}</div>`).join("");
}
// 脱出クリア（1分をこえたら）／ボスをたおしてステージクリア
function advEscapeAsk(){ if(!A||A.dead||A.over||A.t<ADV.ESCAPE_SEC*1000) return;

// 冒険の報酬（脱出クリア）：生き延びた1分ごとに1コイン＋その時のLvの数（ランキングの報酬は30分ごとに別でわたす）
// ボスをたおしてステージクリアしたら、さらに10倍
function advReward(t,lv,top,boss){ const tc=Math.floor(t/60000), lc=lv; const mul=1; const loot=(A&&A.coins)||0; return { tc, lc, mul, boss:!!boss, loot, coins:(tc+lc)*mul*(boss?ADV.CLEAR_MUL:1)+loot }; }
function advGiveCoins(r){ if(!r||!r.coins) return; S.coins=(S.coins||0)+r.coins; save(); try{ SFX.coin(); }catch(e){}
  const bg=document.createElement("div"); bg.className="sheet-bg center ttl-top"; bg.style.zIndex=130;
  bg.innerHTML=`<div class="swear" role="dialog" aria-modal="true"><div class="swear-face">🪙</div><p>${advT2("冒険の報酬")}</p>
    <div class="note" style="margin:0;text-align:center"><b style="font-size:22px">+${r.coins.toLocaleString()}</b> ${advT2("コイン")}<br><small>(${advT2("時間")} ${r.tc} ＋ Lv ${r.lc})${r.mul>1?` ×${r.mul}`:""}${r.boss?` ×${ADV.CLEAR_MUL}`:""}${r.loot?` ＋ ${r.loot.toLocaleString()}`:""}</small></div>
    <button class="btn gold" type="button">OK</button></div>`;
  bg.setAttribute("translate","no"); document.body.appendChild(bg); bg.querySelector("button").onclick=()=>bg.remove(); try{ render(); }catch(e){} }
// 自分の自己ベストの順位だけを数える（ほかの人の順位や記録は表示しない）
// 自分の順位と「1つ上の人の記録」だけをしらべる（ほかの人の順位や名前は表示しない）
async function advRanks(){
  const out={t:null,l:null,nt:undefined,nl:undefined}; if(!DB||!MYID) return out;
  const col=DB.collection("profiles");
  const P=advSync(), bt=S.advBestT||0, bl=S.advBestL||0;   // 今の30分の中での順位
  const qT=col.where("advKk",">",P*1e6+bt).where("advKk","<",(P+1)*1e6), qL=col.where("advLk",">",P*1e6+bl).where("advLk","<",(P+1)*1e6);
  const next=async(q,f,base)=>{ try{ const d=(await withTO(q.orderBy(f).limit(1).get())).docs[0]; return d?d.data()[f]-P*base:null; }catch(e){ return undefined; } };
  const ct=await advCnt(qT); if(ct!=null&&bt) out.t=ct+1; out.nt = ct===0?null : ct==null?undefined : await next(qT,"advKk",1e6);
  const cl=await advCnt(qL); if(cl!=null&&bl) out.l=cl+1; out.nl = cl===0?null : cl==null?undefined : await next(qL,"advLk",1e6);
  return out;
}
// 「00:07:35を超えたら順位が上がります！」
function advNextTxt(r){ const L=LANG==="en", bt=S.advBestT||0, bl=S.advBestL||0, a=[];
  if(r.nt!==undefined) a.push(r.nt===null ? (bt?(L?"⚔️ You're #1 in monsters defeated!":"⚔️ 倒した数ランキングは1位！"):(L?"⚔️ No records yet — be the first!":"⚔️ まだだれも記録がない！一番乗りで1位に！"))
    : (L?`⚔️ Defeat more than ${r.nt.toLocaleString()} to rank up!`:`⚔️ ${r.nt.toLocaleString()}体を超えて倒したら順位が上がります！`));
  if(r.nl!==undefined && (r.nl!==null||bl)) a.push(r.nl===null ? (L?"⭐ You're #1 in best level!":"⭐ 最高レベルランキングは1位！")
    : (L?`⭐ Get past Lv.${r.nl} to rank up!`:`⭐ Lv.${r.nl}を超えると順位が上がります！`));
  return a; }

function advFlame(g,x,y,s,ph){ const wob=Math.sin(ph)*0.25;
  g.beginPath(); g.moveTo(x,y); g.bezierCurveTo(x-s*0.55,y-s*0.35,x-s*0.25+wob*s*0.3,y-s*0.8,x+wob*s*0.5,y-s*1.25); g.bezierCurveTo(x+s*0.35+wob*s*0.2,y-s*0.75,x+s*0.6,y-s*0.35,x,y); g.fill(); }
function advDrawBurn(g,cx,GY,bh,seed){ const t=performance.now()/1000; g.save();
  for(let i=0;i<5;i++){ const ph=t*9+i*1.7+seed*13, fx=cx+(i-2)*bh*0.2+Math.sin(ph*0.7)*bh*0.04, fy=GY-bh*(0.15+0.18*((i*37)%3)/2), s=bh*(0.28+0.1*Math.abs(Math.sin(ph)));
    g.fillStyle="rgba(255,90,20,.9)"; advFlame(g,fx,fy,s,ph); g.fillStyle="rgba(255,190,60,.95)"; advFlame(g,fx,fy-s*0.05,s*0.6,ph+1); g.fillStyle="rgba(255,250,210,.9)"; advFlame(g,fx,fy-s*0.05,s*0.28,ph+2); }
  g.fillStyle="rgba(255,110,30,.85)"; for(let i=0;i<6;i++){ const k=(t*1.6+i/6)%1, px=cx+Math.sin(i*2.3+seed*5)*bh*0.45, py=GY-bh*(0.6+k*0.9); g.globalAlpha=1-k; g.beginPath(); g.arc(px,py,bh*0.04*(1-k*0.5),0,7); g.fill(); }
  g.restore(); }
// 炎が当たったときの爆発
function advDrawBoom(g,x,y,r,k){ g.save(); g.globalAlpha=Math.max(0,1-k);
  const R=r*(0.4+k*0.9); g.fillStyle="rgba(255,120,30,.85)"; g.beginPath(); g.arc(x,y,R,0,7); g.fill(); g.fillStyle="rgba(255,210,80,.9)"; g.beginPath(); g.arc(x,y,R*0.6,0,7); g.fill();
  g.fillStyle="rgba(255,90,20,.95)"; for(let i=0;i<12;i++){ const a=i/12*6.283+i, d=R*(0.9+k*0.9); g.beginPath(); g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*0.8,r*0.07*(1-k),0,7); g.fill(); }
  g.restore(); }

    let im, h, w, cx=sx(e.x), flip=false, alpha=e.dead?Math.max(0,1-e.deadT/0.6):1;
    if(e.st&&!e.frozen){ const f=ADV_FRAMES.sd, k=Math.min(5,Math.floor(e.st.t/0.75*6)); im=advImg("sd"+k); h=bh/f.h; w=h*im.width/im.height; flip=e.dir>0;

      <div class="mg-rk"><div class="mg-rkh">🏆 ${L?"Toto's Adventure Ranking":"トトの冒険ランキング"}</div><div class="mg-rkg"><div><small>${L?"Defeated":"倒した数"}</small><b id="mgR1">―</b></div><div><small>${L?"Best Lv":"最高レベル"}</small><b id="mgR2">―</b></div></div><div class="mg-nx" id="mgNx"></div><div class="mg-rt" id="mgRt"></div></div></div>
      <button class="btn ghost" type="button" id="mgX">${L?"Close":"閉じる"}</button></div>`;
    document.body.appendChild(bg);
    const sync=()=>{ const g=id=>document.getElementById(id); if(!g("mgR1")) return; g("mgR1").textContent=g("ttlR1").textContent; g("mgR2").textContent=g("ttlR2").textContent; g("mgNx").innerHTML=g("ttlNx").innerHTML; g("mgRt").innerHTML=g("ttlRt").innerHTML;
      const ds=g("mgDefSt"), R2=S.def&&S.def.run; if(ds&&R2) ds.textContent=gnow()>=R2.end?(L?"Finished! Tap to see":"終了！ 結果を見る"):(L?"Defending ":"防衛中 ")+defFmtT(R2.end-gnow()); };   // 2026-10-30：防衛中の残り時間も1秒ごとに動かす
    sync(); try{ titleRanks().then(sync); }catch(e){} const iv=setInterval(sync,1000); const close=()=>{ clearInterval(iv); bg.remove(); };
    bg.onclick=e=>{ if(e.target===bg) close(); }; bg.querySelector("#mgX").onclick=close;
    bg.querySelector("#mgDef").onclick=()=>{ close(); try{ SFX.tap(); }catch(e){} openDefense(); };
    bg.querySelector("#mgMb").onclick=()=>{ close(); try{ SFX.tap(); }catch(e){} if(window.openMB) openMB(); };
    bg.querySelector("#mgMc").onclick=()=>{ close(); try{ SFX.tap(); }catch(e){} if(window.openMC) openMC(); };
    bg.querySelector("#mgAdv").onclick=()=>{ close(); try{ SFX.tap(); }catch(e){} onTop(openAdventureIntro); }; }); };
  // トトの戦略（試作）：まだ公開しないので、冒険者「ふっかー」にだけボタンを出す
  { const tb=document.getElementById("ttlTs"); tb.onclick=()=>{ try{ SFX.tap(); }catch(e){} if(window.openTS) openTS(); };
    tb.hidden=true; }   // トトの戦略の試作ボタンは消した（魔物合戦はホームから）
  document.getElementById("ttlKn").onclick=()=>{ try{ SFX.tap(); }catch(e){} openKuni(); };
  try{ knTitleBtn(); }catch(e){ try{ showErr("knTitleBtn: "+(e&&e.message),"title"); }catch(_){} }
  // 防衛作戦のボタンに、防衛中なら残り時間を出す
  setInterval(()=>{ const el=document.getElementById("ttlDefSt"); if(!el||T.hidden) return; const R=S.def&&S.def.run;
    el.textContent=R?(gnow()>=R.end?(LANG==="en"?"🛡 Defense finished!":"🛡 防衛作戦 終了！"):(LANG==="en"?"🛡 Defending ":"🛡 防衛中 ")+defFmtT(R.end-gnow())):""; },1000);
  setTimeout(()=>{ try{ titleRanks(); }catch(e){} },2500);
  // ランキングがリセットされるまでのタイマー（1時間ごと）
  let rtPer=null; const rtEl=document.getElementById("ttlRt");
  const rtTick=()=>{ if(T.hidden&&!document.getElementById("mgRt")) return;   /* 2026-10-30：ミニゲームはホームから開くので、タイトルが隠れていてもミニゲームの画面が出ていれば動かす */ const now=gnow(), per=advPer(), left=advPerEnd(per)-now;
    const hh=Math.floor(left/3600000), mm=String(Math.floor(left/60000)%60).padStart(2,"0"), ss=String(Math.floor(left/1000)%60).padStart(2,"0");
    rtEl.innerHTML=`<span>⏱ ${LANG==="en"?"Ranking resets in":"ランキングリセットまで"}</span><b>${hh?hh+":":""}${mm}:${ss}</b>`;
    if(rtPer!==null && per!==rtPer){ try{ titleRanks(); }catch(e){} } rtPer=per; };
  setInterval(()=>{ try{ advSettle(); }catch(e){} },60000);
  const rtSafe=()=>{ try{ rtTick(); }catch(e){} }; rtSafe(); setInterval(rtSafe,1000);   // ここでエラーが起きても、下のボタンが動くように
  document.getElementById("ttlStart").onclick=()=>{
    try{ SFX.reveal("S"); }catch(e){}
    T.classList.add("out"); document.body.classList.remove("ttl-open");
    setTimeout(()=>{ T.hidden=true; document.querySelectorAll(".ttl-top").forEach(x=>x.classList.remove("ttl-top")); try{ render(); }catch(e){ try{ showErr("render: "+(e&&e.message), "start"); }catch(_){} } },480);
    setTimeout(()=>{ try{ knTip(); }catch(e){} },3000);
  };
  // ホームの「タイトル画面に戻る」から、もう一度タイトルを出す
  window.showTitle=()=>{ document.querySelectorAll(".sheet-bg,.reveal").forEach(x=>x.remove()); T.hidden=false; T.classList.add("out"); document.body.classList.add("ttl-open"); lay();
    requestAnimationFrame(()=>requestAnimationFrame(()=>T.classList.remove("out"))); try{ titleRanks(); }catch(e){} };
  // まだ登録していない人には、最初に言語をえらんでもらう
  let langSet=false; try{ langSet=!!localStorage.getItem("toto-lang-set"); }catch(e){}
  const fresh=typeof isFreshSave==="function" && isFreshSave(S) && !S.owner;
  if(!langSet && !fresh){ try{ localStorage.setItem("toto-lang-set","1"); }catch(e){} langSet=true; }
  if(!langSet){
    const pk=document.createElement("div"); pk.className="ttl-pick";
    pk.innerHTML=`<div class="swear" role="dialog" aria-modal="true" aria-labelledby="tpT" translate="no"><div class="swear-face">🌐</div><p id="tpT">言語をえらんでください<br><small style="font-weight:700">Choose your language</small></p>
      <button class="btn gold" type="button" data-pl="ja">日本語</button><button class="btn gold" type="button" data-pl="en">English</button></div>`;
    T.appendChild(pk);
    pk.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ try{ localStorage.setItem("toto-lang-set","1"); }catch(e){} if(b.dataset.pl!==LANG) setLang(b.dataset.pl); else pk.remove(); });
  }
})();
