<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16211d">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トトと魔物たち">
<title>トトと魔物たち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen phone app — coin bar on top, scrolling stage in the middle, tab bar fixed at the bottom. Mossy dusk forest. */
:root{
  --night:#16211d;      /* page ground: forest at dusk */
  --bark:#1f2e28;       /* panels */
  --bark-2:#2a3d35;     /* raised panels */
  --mist:#e9f1ea;       /* main text, cloud white */
  --mist-dim:#a7b9ad;   /* secondary text */
  --moss:#a6c24a;       /* primary accent: Toto's grass */
  --staff:#e0ad4f;      /* coins, gold */
  --sky:#7fcbe3;        /* cloud shading */
  --berry:#e2546f;      /* blush / alerts */
  --line:#34493f;
  --r-c:#9aa59e; --r-b:#5fb7e0; --r-a:#b78cf0; --r-s:#f0b440; --r-z:#ff5e8a; --r-l:#ffd75e; --r-f:#7ee8c8;
  --f-pix:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--mist);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-pix);font-size:20px;letter-spacing:.04em;line-height:1.1;flex:1;min-width:0}
.logo{word-break:keep-all}
@media (max-width:420px){.top .logo{font-size:15px;flex:0 0 4.3em;margin-right:auto}html[lang=en] .top .logo{font-size:13px;flex-basis:5.4em}.top .daily{white-space:nowrap;padding-left:9px;padding-right:9px;font-size:12px}.top .logo small{display:none}}
.logo small{display:block;font-size:10px;color:var(--mist-dim);letter-spacing:.2em}
.coin{display:flex;align-items:center;gap:6px;background:var(--bark);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-pix);font-size:17px;font-variant-numeric:tabular-nums}
.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,var(--staff) 55%,#8c5a14);box-shadow:inset 0 0 0 2px #8c5a14}
.daily{border:2px solid var(--moss);background:color-mix(in srgb,var(--moss) 18%,transparent);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;position:relative}
.daily.ready::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--berry)}
.snd{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--line);background:var(--bark);display:grid;place-items:center;padding:0}
.snd svg{width:18px;height:18px}
html[lang=en] .logo{font-size:15px;letter-spacing:0}
html[lang=en] .logo small{display:none}
.fr-stones{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}.fr-stones span{display:flex;align-items:center;gap:6px;background:var(--bark-2);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700}.fr-stones img{width:30px;height:30px;object-fit:contain}
.hs-h{margin:14px 0 8px;font-size:14px}.hs-n{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:15px;white-space:nowrap}.hs-n img{width:24px;height:24px}
.fr-menu{display:flex;flex-direction:column;gap:10px}.fr-menu .btn{position:relative;font-size:16px;padding:14px}
.fr-n{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--berry,#e8336b);color:#fff;border-radius:999px;min-width:24px;padding:2px 7px;font-size:13px}
.fr-list{display:flex;flex-direction:column;gap:10px}.fr-item{background:var(--bark-2);border:2px solid var(--line);border-radius:14px;padding:10px}
.fr-top{display:flex;align-items:center;gap:10px}.fr-body{display:flex;flex-direction:column;min-width:0}.fr-body b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr-body small{color:var(--mist-dim)}
.fr-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fr-btns .btn{flex:1}.fr-btns .chip:disabled{opacity:.55}.fr-del{margin-left:auto;color:#ff8a7a}.fr-lock{color:var(--mist-dim);font-size:11px}
.fr-new{align-self:flex-start;margin-top:4px;background:#ff5f8f;color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:2px 10px;animation:rulesPulse 1.6s ease-in-out infinite}.fr-hot{background:#ff5f8f!important;color:#fff!important;border-color:#ff5f8f!important}
.fr-msg{margin-top:8px;background:var(--bark);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.6;word-break:break-word}
.fr-ta{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:var(--bark-2);color:var(--mist);border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:none}
.fr-pbtn{grid-template-columns:1fr 1fr}.fr-pbtn .iu img{width:28px;height:28px}
.chat-log{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
.chat-m{align-self:flex-start;max-width:82%;background:var(--bark-2);border-radius:14px 14px 14px 4px;padding:7px 11px;word-break:break-word;line-height:1.55}
.chat-m.me{align-self:flex-end;background:#3d5a2a;border-radius:14px 14px 4px 14px}.chat-m small{display:block;color:var(--mist-dim);font-size:10px;margin-bottom:2px}
.chat-in{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.chat-in .btn{flex:0 0 auto}
.hm-btn .fr-badge{right:-6px}
.tk-boost{display:block;font-size:11px;color:#ff5e8a;margin-top:2px}
.evo-b{position:absolute;right:4px;top:4px;z-index:2;background:linear-gradient(90deg,#ffd75e,#ff9ed2);color:#5a2a00;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px;animation:rulesPulse 1.6s ease-in-out infinite}
.evo-row{display:flex;align-items:center;justify-content:center;gap:6px}.evo-row img{width:72px;height:72px}.evo-row b{font-size:20px}
.evo-pick{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))!important;max-height:200px;overflow:auto}
.snd-set{gap:12px}.snd-row{display:flex;align-items:center;gap:10px;text-align:left}.snd-row b{flex:0 0 5.2em;font-size:14px}.snd-row .seg{flex:1;margin:0}.snd-row.vol span{flex:0 0 2.4em;text-align:right;font-weight:900}.snd-row input:disabled{opacity:.4}
.snd.lang{font-family:var(--f-pix);font-size:12px;font-weight:900;color:var(--mist);letter-spacing:0}
.daily:disabled{border-color:var(--line);background:none;color:var(--mist-dim);cursor:default}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bark);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mist-dim);position:relative}
.tabs button.dot::after{content:"";position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--berry)}
.tabs button svg{width:26px;height:26px}
.tabs .tab2{display:flex;flex-direction:column;align-items:center;line-height:1.15}.tabs .tab2 small{font-size:9.5px;font-weight:800}
.tabs button[aria-selected="true"]{color:var(--moss)}
h2{font-family:var(--f-pix);font-weight:400;font-size:22px;margin:8px 0 4px;text-wrap:balance}
.sub{color:var(--mist-dim);font-size:13px;margin:0 0 12px}
.seg{display:flex;background:var(--bark);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mist-dim)}
.seg button[aria-pressed="true"]{background:var(--bark-2);color:var(--mist);box-shadow:inset 0 -3px 0 var(--moss)}
/* gacha */
.altar{position:relative;border-radius:18px;overflow:hidden;background:
  radial-gradient(ellipse at 50% 115%,color-mix(in srgb,var(--moss) 40%,transparent),transparent 60%),
  radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--sky) 22%,transparent),transparent 55%),var(--bark);
  border:2px solid var(--line);padding:18px 16px 16px;text-align:center}
.altar canvas{width:min(62vw,240px);height:auto;image-rendering:auto;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.altar .title{font-family:var(--f-pix);font-size:19px;margin:4px 0 2px}
.pulls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pull{border:0;border-radius:14px;padding:12px 8px 10px;font-weight:900;font-size:16px;background:var(--moss);color:#1b2a0c;box-shadow:0 4px 0 #6f8526;transition:transform .08s}
.pull.ten{background:var(--staff);color:#3a2306;box-shadow:0 4px 0 #9a6c1d}
.pull small{display:block;font-family:var(--f-pix);font-weight:400;font-size:13px;opacity:.85}
.pull:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.pull:disabled{opacity:.45;cursor:not-allowed}
details.rates{margin-top:14px;background:var(--bark);border-radius:12px;padding:10px 14px;font-size:13px}
details.rates summary{cursor:pointer;font-weight:700}
.rate-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mist-dim);margin-top:8px}
.rk{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:5px;font-family:var(--f-pix);font-size:13px;color:#111;line-height:1}
.rk-C{background:var(--r-c)}.rk-B{background:var(--r-b)}.rk-A{background:var(--r-a)}.rk-S{background:var(--r-s)}.rk-Z{background:linear-gradient(90deg,#ff5e8a,#ffb84d,#7ee08a,#5fb7e0,#b78cf0);color:#111}.rk-L{background:linear-gradient(135deg,#fff3c4,#ffd75e 45%,#ff9ed2);color:#5a2a00;font-size:0!important;box-shadow:0 0 6px #ffd75e}.rk-L::after{content:"限定";font-size:11px;font-family:var(--f-jp,inherit);font-weight:900;letter-spacing:0}html[lang=en] .rk-L::after{content:"LTD"}.rk-F{background:linear-gradient(135deg,#d6fff1,#7ee8c8 45%,#b78cf0);color:#1b3a33;font-size:0!important;box-shadow:0 0 6px #7ee8c8}.rk-F::after{content:"融合";font-size:11px;font-family:var(--f-jp,inherit);font-weight:900;letter-spacing:0}html[lang=en] .rk-F::after{content:"FUSE"}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{position:relative;border:0;padding:0;background:none;border-radius:12px;text-align:left}
.card img{display:block;width:100%;aspect-ratio:1;max-width:100%;border-radius:12px}
.card .lv{position:absolute;right:6px;bottom:6px;font-family:var(--f-pix);font-size:12px;background:#0009;color:#fff;padding:0 5px;border-radius:5px}
.card .rk{position:absolute;left:6px;top:6px}
.card .lock{position:absolute;right:6px;top:6px;background:#0009;border-radius:5px;padding:1px 3px;font-size:11px}
.card.sel{outline:3px solid var(--moss);outline-offset:-1px}
.card.sel::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:900;color:#fff;background:#0007;border-radius:12px}
.card.dim{opacity:.35}
.card.same-m::before{content:"×2";position:absolute;left:6px;bottom:6px;z-index:1;font-family:var(--f-pix);font-size:12px;background:var(--staff);color:#3a2306;padding:0 5px;border-radius:5px}
.same{display:inline-block;font-size:11px;font-weight:900;background:var(--staff);color:#3a2306;border-radius:6px;padding:0 6px;margin-left:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:2px solid var(--line);background:var(--bark);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--moss);color:var(--moss)}
.empty{text-align:center;color:var(--mist-dim);padding:30px 10px;border:2px dashed var(--line);border-radius:14px}
/* dex */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:10px;background:var(--bark);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--staff))}
.pct{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.dex .cell{background:var(--bark);border-radius:12px;padding:6px 6px 8px;text-align:center;border:2px solid transparent}
.dex .cell img{width:100%;aspect-ratio:1;max-width:100%;display:block}
.dex .cell .nm{font-size:11px;font-weight:700;line-height:1.3;margin-top:4px;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.dex .cell .no{font-family:var(--f-pix);font-size:11px;color:var(--mist-dim)}
.dex .cell.unk .nm{color:var(--mist-dim)}
.dex .cell.has{border-color:var(--line)}
.el-head{font-family:var(--f-pix);font-size:16px;margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.el-head span{color:var(--mist-dim);font-size:13px}
.el-head span.rk{color:inherit;font-size:inherit}
.dex-sort{display:flex;gap:6px;margin:0 0 10px}
.dex-sort button{flex:1;border:2px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--bark-2);color:var(--mist);font:800 13px/1 var(--f-body);cursor:pointer}
.dex-sort button[aria-pressed="true"]{background:var(--staff);color:#3a2306;border-color:var(--staff)}
.rv .rv-sell{display:block;width:100%;margin-top:4px;border:0;border-radius:8px;padding:5px 2px;background:#c0392b;color:#fff;font:900 10.5px/1.15 var(--f-body);cursor:pointer}
.rv-grid.one .rv .rv-sell{font-size:14px;padding:8px}
.rv .rv-sell:disabled{background:#4a5550;color:#cfd8d3;cursor:default}
.rv.sold img{filter:grayscale(1) brightness(.55)}
.rv.pickable{cursor:pointer}
.rv.pickable img{outline:3px dashed #ffffff66;outline-offset:-3px}
.rv.picked img{outline:4px solid #ffd54f;outline-offset:-4px;filter:brightness(.8)}
.rv.picked::after{content:"✔";position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#ffd54f;color:#3a2306;font:900 22px/34px var(--f-body);text-align:center;box-shadow:0 2px 0 #0006}
.rv-rk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}.rv-rk small{width:100%;text-align:center;font-weight:800;font-size:12px;color:var(--mist-dim)}
.rv-rk button{border:2px solid var(--line);border-radius:999px;background:var(--bark-2);color:var(--mist);padding:6px 12px;font:800 13px/1 var(--f-body);display:flex;gap:5px;align-items:center;cursor:pointer}
.rv-pickhint{margin:8px 0 0;font-size:13px;font-weight:800;color:#ffd54f}
.reveal .rv-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reveal .rv-btns .btn{min-width:150px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.fuse-dock{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));z-index:5;margin:10px -4px 8px;padding:8px 8px 10px;background:var(--bark);border:2px solid var(--line);border-radius:14px;box-shadow:0 -6px 14px #0007}
.fuse-dock .fuse-sum{margin:0 0 6px}
.fuse-dock #doFuse{width:100%}
.sheet{background:var(--bark);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;border-top:2px solid var(--line);padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-h h3{flex:1;margin:0;font-family:var(--f-pix);font-weight:400;font-size:20px;min-width:0}
.x{border:0;background:var(--bark-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.detail{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:420px){.detail{grid-template-columns:120px 1fr}}
.detail img{width:100%;max-width:100%;border-radius:14px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-pix);font-weight:400;font-size:15px}
.xp{height:12px;background:var(--night);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.xp b{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--moss));transition:width .4s}
.xp.preview b{background:linear-gradient(90deg,var(--staff),#ffe08a)}
.frames{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.frames i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.frames i.on{background:var(--staff)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;font-size:15px;background:var(--moss);color:#1b2a0c}
.btn.ghost{background:var(--bark-2);color:var(--mist)}
.btn.gold{background:var(--staff);color:#3a2306}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.busy:disabled{opacity:1;cursor:progress;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.busy::before{content:"";width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swear .btn:active:not(:disabled){transform:scale(.96)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.fuse-sum{background:var(--night);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13px}
.fuse-sum b{font-family:var(--f-pix);font-weight:400;color:var(--staff);font-size:16px}
/* results */
.reveal{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2a3d35,#0b120f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.reveal h3{font-family:var(--f-pix);font-weight:400;font-size:22px;margin:0 0 14px}
.rv-grid{display:grid;gap:10px;width:100%;max-width:560px}
.rv-grid.one{grid-template-columns:min(70vw,260px);justify-content:center}
.rv-grid.many{grid-template-columns:repeat(5,1fr)}
.rv-grid.scroll{max-height:58vh;overflow-y:auto;padding:8px 4px}
.rv .cnt{position:absolute;left:-4px;top:-6px;background:var(--staff);color:#3a2306;font-family:var(--f-pix);font-size:12px;padding:0 5px;border-radius:5px}
.rv-sum{margin:-6px 0 10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pix);font-size:15px}

.pk-stage.rare{background:radial-gradient(circle at 50% 45%,#5a4210,#140d02 72%)}

.pk-stage.rare .pk-wrap{filter:drop-shadow(0 0 14px #ffd23dcc) drop-shadow(0 0 34px #ffae0088);animation:pkIn .5s cubic-bezier(.2,1.4,.4,1),pkGold 2.2s ease-in-out .5s infinite}
@keyframes pkGold{0%,100%{filter:drop-shadow(0 0 12px #ffd23dbb) drop-shadow(0 0 28px #ffae0066)}50%{filter:drop-shadow(0 0 22px #fff2a8ee) drop-shadow(0 0 46px #ffc400aa)}}
.pk-stage.rare .pk-body::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(110deg,transparent 35%,#fff3b066 46%,#fffbe0aa 50%,#fff3b066 54%,transparent 65%) 0 0/250% 100% no-repeat;animation:pkSheen 2.4s ease-in-out infinite}
@keyframes pkSheen{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.pk-stage.rare .pk-body::before{content:"✦  ✧   ✦\A  ✧    ✦ ✧\A ✦  ✧  ✦";white-space:pre;position:absolute;inset:8% 6% auto;color:#fff8d0;font-size:22px;line-height:2.4;text-align:center;text-shadow:0 0 8px #ffd23d;pointer-events:none;z-index:1;animation:pkTw 1.4s ease-in-out infinite alternate}
@keyframes pkTw{from{opacity:.25}to{opacity:1}}
.pk-title{font-family:var(--f-pix);font-size:18px;color:#f3e3c3;letter-spacing:.1em}
.pk-wrap{position:relative;width:min(64vw,270px);aspect-ratio:540/755;animation:pkIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pkIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.pk,.pk-ghost{position:absolute;inset:0}
.pk-ghost{border-radius:7% / 5%;background:var(--pk) 0 0/100% auto no-repeat;filter:brightness(.55);box-shadow:0 10px 24px #0008}
.pk-ghost.g1{transform:translate(9px,7px) rotate(3deg)}.pk-ghost.g2{transform:translate(-10px,10px) rotate(-4deg)}.pk-ghost.g3{transform:translate(16px,16px) rotate(7deg);filter:brightness(.4)}
.pk-body,.pk-strip{position:absolute;left:0;right:0;background-image:var(--pk);background-size:100% auto;background-repeat:no-repeat;box-shadow:0 14px 30px #000a}
.pk-body{bottom:0;top:11.7%;background-position:0 100%;border-radius:0 0 7% 7% / 0 0 5.6% 5.6%;z-index:2}
.pk-strip{top:0;height:11.8%;background-position:0 0;border-radius:24% 24% 0 0 / 70% 70% 0 0;z-index:3;touch-action:none;cursor:ew-resize;transform-origin:50% 100%;transition:transform .15s}
.pk-strip::before{content:"";position:absolute;left:-14px;right:-14px;top:-26px;bottom:-20px}
.pk-strip::after{content:"";position:absolute;left:3%;right:3%;bottom:-1px;height:6px;background:linear-gradient(135deg,transparent 33%,#00000055 33% 50%,transparent 50%) 0 0/8px 6px,linear-gradient(225deg,transparent 33%,#00000055 33% 50%,transparent 50%) 0 0/8px 6px;opacity:.75}
.pk-cut{position:absolute;bottom:-2px;height:4px;left:0;width:0;background:linear-gradient(90deg,#fff8,#fff,#fff8);border-radius:2px;box-shadow:0 0 8px #fff9}
.pk-strip.gone-r{animation:pkOffR .55s ease-in forwards}.pk-strip.gone-l{animation:pkOffL .55s ease-in forwards}

@keyframes pkOffL{to{transform:translate(-70%,-120%) rotate(-28deg);opacity:0}}
.pk-card{position:absolute;left:12%;width:76%;top:14%;border-radius:10px;z-index:1;transition:transform .9s cubic-bezier(.2,.9,.3,1) .25s;box-shadow:0 0 0 2px #0006}

.pk-glow.z{background:radial-gradient(circle,#fff 0,#fff4 12%,transparent 30%),conic-gradient(from 0deg,#ff5e8a99,#ffb84d99,#7ee08a99,#5fb7e099,#b78cf099,#ff5e8a99);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 66%);mask:radial-gradient(circle,#000 30%,transparent 66%);animation:spin 4s linear infinite}

.pk-label{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;font-family:var(--f-pix);font-size:11px;letter-spacing:.18em;color:#2b1d10;opacity:.85}

.rank li{cursor:pointer}
.rank li:active{transform:scale(.98)}
.rank li.me{border-color:var(--moss)}
/* 2026-10-28：貯金ランキング1〜3位の冒険者は、魔物ランキングの枠が金色に輝く */
.rank li.bkg{border:3px solid #ffd54a!important;background:linear-gradient(120deg,#5a4510,#8a6a14 40%,#d9b13a 50%,#8a6a14 60%,#5a4510);background-size:250% 100%;animation:bkgShine 2.6s linear infinite,bkgGlow 1.6s ease-in-out infinite alternate}
@keyframes bkgShine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes bkgGlow{from{box-shadow:0 0 6px 1px #ffd54a99}to{box-shadow:0 0 16px 4px #ffe680}}
/* 2位はシルバー、3位はブロンズ */
.rank li.bkg.bk2{border-color:#e6edf3!important;background:linear-gradient(120deg,#3a4048,#6b7682 40%,#c9d3dc 50%,#6b7682 60%,#3a4048);background-size:250% 100%;animation:bkgShine 2.6s linear infinite,bkgGlow2 1.6s ease-in-out infinite alternate}
@keyframes bkgGlow2{from{box-shadow:0 0 6px 1px #dfe7ee99}to{box-shadow:0 0 16px 4px #f2f7fb}}
.rank li.bkg.bk3{border-color:#e0954f!important;background:linear-gradient(120deg,#4a2a12,#7d4a20 40%,#c98447 50%,#7d4a20 60%,#4a2a12);background-size:250% 100%;animation:bkgShine 2.6s linear infinite,bkgGlow3 1.6s ease-in-out infinite alternate}
@keyframes bkgGlow3{from{box-shadow:0 0 6px 1px #e0954f99}to{box-shadow:0 0 16px 4px #f0b07a}}
@media (prefers-reduced-motion:reduce){.rank li.bkg,.rank li.bkg.bk2,.rank li.bkg.bk3{animation:none;box-shadow:0 0 12px 3px #ffd54acc}}
.rank li.top1{border-color:#f0c040}.rank li.top2{border-color:#c8d0d8}.rank li.top3{border-color:#c88a50}
.rk-no{font-family:var(--f-pix);font-size:18px;width:30px;text-align:center;flex:0 0 auto}
.rank li.top1 .rk-no{color:#f0c040}.rank li.top2 .rk-no{color:#c8d0d8}.rank li.top3 .rk-no{color:#c88a50}
.rk-body{flex:1;min-width:0}
.rk-name{font-weight:900;overflow-wrap:anywhere}
.rk-name em{font-style:normal;font-size:11px;background:var(--moss);color:#1b2a0c;border-radius:6px;padding:0 5px;margin-left:4px}
.rk-sub{font-size:11px;color:var(--mist-dim)}
.cell .soul{position:relative;height:12px;margin:3px 4px 0;background:#0005;border-radius:999px;overflow:hidden}.cell .soul i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff7a2f,#ffd75e)}.cell .soul span{position:relative;display:block;font-size:9px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 1px #000}
.rk-cmt{font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.rk-rep{margin-top:4px;border:2px solid var(--line);background:transparent;color:var(--mist);border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;font-weight:900}
.rep-top{background:#0003;border-radius:12px;padding:8px 10px;margin-bottom:8px}.rep-top small{font-size:11px;opacity:.75}
.rep-list{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.rep-it{position:relative;background:#ffffff12;border-radius:12px;padding:6px 30px 6px 10px;font-size:14px;overflow-wrap:anywhere}
.rep-it b{font-size:11px;margin-right:6px;opacity:.8}.rep-it small{font-size:10px;opacity:.6}
.rep-del{position:absolute;right:6px;top:6px;border:0;background:#0004;color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px}
.rk-lv{font-family:var(--f-pix);font-size:20px;color:var(--moss);text-align:center;flex:0 0 auto}
.rk-lv small{display:block;font-size:10px;color:var(--mist-dim)}
.login-box{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;background:var(--bark);border:2px solid var(--staff);border-radius:16px;padding:16px}
.login-box p{margin:0}
.login-btn{text-decoration:none;display:block}
.guard-box{display:flex;gap:12px;align-items:center;background:var(--bark);border:2px solid var(--moss);border-radius:14px;padding:10px;margin-top:8px}
.guard-box.warn{border-color:var(--berry)}
.guard-box img{width:84px;height:84px;border-radius:10px;flex:0 0 auto}
.gb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.guard-b{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:900;background:var(--moss);color:#1b2a0c;padding:0 5px;border-radius:5px}
.rk-guard{width:40px;height:40px;border-radius:8px;flex:0 0 auto}
.rk-guard.none{display:inline-block;border:2px dashed var(--line)}
.vs{display:flex;align-items:center;justify-content:center;gap:10px}
.vs img{width:96px;height:96px;border-radius:12px}
.vs.big img{width:min(36vw,160px);height:auto}
.vs b{font-family:var(--f-pix);font-size:22px;color:var(--staff)}
.vs img.lose{filter:grayscale(1) brightness(.5);transform:rotate(-8deg)}
.swear.news{max-width:380px;max-height:86vh;text-align:left}
.swear.news #nwT{text-align:center}
.news-body{overflow-y:auto;font-size:14px;line-height:1.65;padding-right:4px}
.news-body h4{margin:10px 0 2px;font-size:15px;color:var(--staff)}
.swear.news .news-body p{margin:0 0 4px;font-weight:500;font-size:14px;line-height:1.65}
.swear.news .news-end{margin-top:10px;font-weight:900;text-align:center}
.warn-bar{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));margin-bottom:6px;background:color-mix(in srgb,var(--berry) 22%,var(--bark));border:2px solid var(--berry);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:900;line-height:1.5}
.warn-bar{position:relative;padding-right:44px}
.warn-bar small{display:block;font-weight:500;color:var(--mist-dim)}
.warn-x{position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:14px}
.missions{display:flex;flex-direction:column;gap:10px}
.mission{background:var(--bark);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.mission.open{border-color:var(--moss)}
.mission.big{background:linear-gradient(135deg,color-mix(in srgb,var(--staff) 16%,var(--bark)),var(--bark))}
.mission.big.open{border-color:var(--staff)}
.mission.cleared .m-text{color:var(--mist-dim);text-decoration:line-through;text-decoration-color:var(--moss)}
.m-body{flex:1;min-width:0}
.m-no{font-family:var(--f-pix);font-size:11px;color:var(--mist-dim);letter-spacing:.08em}
.m-text{font-weight:700;line-height:1.45;margin:2px 0}
.mission .amt{font-family:var(--f-pix);color:var(--staff);font-size:14px}
.mission .btn{min-width:84px;flex:0 0 auto}
.mission .cd{flex:0 0 auto;min-width:96px;font-size:12px}
.mission .cd .t{display:block;font-size:15px}
.sheet-bg.center{align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.swear{background:var(--bark);border:2px solid var(--staff);border-radius:20px;padding:20px 18px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:tin .2s ease-out}
.swear-face{font-size:44px;line-height:1}
.swear p{margin:0;font-weight:900;font-size:17px;line-height:1.6}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--mist);color:var(--night);font-weight:900;padding:8px 16px;border-radius:999px;z-index:60;box-shadow:0 6px 20px #0006;font-size:14px;max-width:90vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.rv{opacity:1;transform:none}}
/* ===== PC向けの画面（横幅1100px以上）：左にメニュー、まん中にゲーム、右にランキングとフレンド ===== */
.side{display:none}
@media (min-width:1100px){
  .app{max-width:1400px;display:grid;grid-template-columns:210px minmax(0,1fr) 330px;grid-template-rows:auto auto minmax(0,1fr);column-gap:20px;padding:0 20px}
  .app>header.top{grid-column:1/-1}
  .app>.warn-bar{grid-column:1/-1}
  .stage{grid-column:2;grid-row:3;padding-bottom:28px;border-radius:18px}
  .tabs{position:static;grid-column:1;grid-row:3;align-self:start;background:var(--bark);border:2px solid var(--line);border-radius:18px;padding:10px 8px}
  .tabs nav{display:flex;flex-direction:column;gap:4px;max-width:none}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px;text-align:left}
  .tabs button svg{width:24px;height:24px;flex:0 0 auto}
  .tabs button:hover{background:var(--bark-2)}
  .tabs button[aria-selected="true"]{background:var(--bark-2);box-shadow:inset 3px 0 0 var(--moss)}
  .tabs button.dot::after{top:50%;right:14px;transform:translateY(-50%)}
  .side{display:flex;flex-direction:column;gap:14px;grid-column:3;grid-row:3;overflow-y:auto;padding-bottom:24px;min-height:0}
  .home{height:calc(100dvh - 120px);margin-left:0;margin-right:0;border-radius:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .sheet-bg{align-items:center}
  .sheet{max-width:760px;max-height:88%;border-radius:20px;border:2px solid var(--line)}
  .toast{max-width:420px}
  button:not(:disabled),[role=button]{cursor:pointer}
}
.sd-box{background:var(--bark);border:2px solid var(--line);border-radius:18px;padding:12px 12px 10px}
.sd-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.sd-h b{font-size:16px}
.sd-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.sd-row{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;cursor:pointer}
.sd-row:hover{background:var(--bark-2)}

.sd-row .no{font-family:var(--f-pix);font-weight:900;text-align:center;color:var(--mist-dim)}

.sd-new{background:#ff5f8f;color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:900}

/* ===== タイトル画面（ゲームを開いたら最初に出る） ===== */
.ttl{position:fixed;inset:0;z-index:100;overflow:hidden;background:#3a9be8;transition:opacity .45s ease;--s:.5;user-select:none;-webkit-user-select:none}
.ttl.out{opacity:0;pointer-events:none}
.ttl[hidden]{display:none}
.ttl:not(.laid) .ttl-stage,.ttl:not(.laid) .ttl-corner{visibility:hidden}
.ttl-blur{position:absolute;inset:-40px;background:url(title/bg.jpg) center/cover;filter:blur(18px) brightness(.85)}
.ttl-stage{position:absolute;left:0;top:0;width:1046px;height:1504px;transform-origin:0 0;overflow:hidden}
.ttl-bg{position:absolute;inset:0;width:100%;height:100%}
.ttl-clouds{position:absolute;inset:0;pointer-events:none}
.ttl-clouds img{position:absolute;left:0;width:var(--w);height:auto;image-rendering:pixelated;animation:ttlDrift var(--d) linear infinite;animation-delay:var(--o);will-change:transform}
@keyframes ttlDrift{from{transform:translateX(-420px)}to{transform:translateX(1100px)}}
.ttl-banner{position:absolute;left:78px;top:238px;width:900px;height:350px;animation:ttlFloat 6s ease-in-out infinite}
@keyframes ttlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ttl-start{position:absolute;left:315px;top:691px;width:425px;height:194px;padding:0;border:0;background:none;cursor:pointer;animation:ttlPulse 2.4s ease-in-out infinite}
.ttl-start img{position:absolute;inset:0;width:100%;height:100%}
.ttl-start:active{transform:scale(.96)}
@keyframes ttlPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.ttl span{display:none}
html[lang=en] .ttl span{display:block}
.ttl-start span{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:900 40px/1 var(--f-body);color:#3a1a08;letter-spacing:.01em;white-space:nowrap}
html[lang=en] .ttl-start span{display:flex}
.ttl-corner{position:absolute;top:0;padding:0;border:0;background:none;cursor:pointer}
.ttl-corner img{display:block;width:100%;height:100%}
.ttl-corner:active{transform:scale(.95)}
.ttl-set span{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:900 calc(var(--s)*24px)/1 var(--f-body);color:#222}
.ttl-code{box-sizing:border-box;display:grid;place-items:center;background:linear-gradient(#ffe27a,#f2b84b);border:calc(var(--s)*6px) solid #3a2306;border-radius:calc(var(--s)*14px);box-shadow:inset 0 calc(var(--s)*-6px) 0 #c98a1e,0 calc(var(--s)*4px) 0 #0005}
.ttl .ttl-code span{display:block!important;position:static;font:900 calc(var(--s)*27px)/1 var(--f-body);color:#3a2306;white-space:nowrap}
.ttl .ttl-news span{font-size:calc(var(--s)*25px)}
.ttl-news{overflow:visible}
.ttl-news-dot{position:absolute;top:calc(var(--s)*-10px);right:calc(var(--s)*-10px);width:calc(var(--s)*30px);height:calc(var(--s)*30px);border-radius:50%;background:#e53935;border:calc(var(--s)*4px) solid #fff;box-shadow:0 0 0 2px #3a2306}
.news-mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:6px 0 4px}
.news-mon{background:#fff8;border:2px solid #3a230633;border-radius:12px;padding:6px 4px;text-align:center;font-size:11px;line-height:1.3}

.news-mon img.sil{filter:brightness(0);opacity:.85}
.news-ss{margin:14px 0 4px;font-weight:900;font-size:15px;border-bottom:2px solid #0002;padding-bottom:3px}

.ttl-lang{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:#0008;border:2px solid #fff6;border-radius:999px;padding:4px}

/* --- えらぶ画面 --- */
.dsel{background:radial-gradient(circle at 50% 0,#2a1d10,#0b0704 70%);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.ds-top{display:flex;align-items:center;gap:8px}
.ds-back{flex:none;width:44px;height:52px;border:0;background:linear-gradient(#c62828,#8e1414);clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);color:#ffd54f;font-size:20px;font-weight:900;box-shadow:inset 0 0 0 3px #ffcf4a}
.ds-scroll{flex:1;min-width:0;background:linear-gradient(#f6e2b3,#e7c98b);color:#3a1e08;border:3px solid #6b3d12;border-radius:10px;padding:10px 6px;text-align:center;font:900 clamp(13px,3.9vw,20px)/1.2 var(--f-body);white-space:nowrap;box-shadow:inset 0 0 12px #a8743a88,0 3px 0 #0008}
html[lang=en] .ds-scroll{white-space:normal}
.ds-coin{flex:none;background:#2a1a0a;border:3px solid #e2b13c;border-radius:10px;padding:4px 8px;text-align:right;box-shadow:inset 0 0 0 2px #6b4a10}
.ds-coin small{display:block;font-size:10px;color:#f6d77a;font-weight:800}
.ds-coin b{font:900 17px/1.1 var(--f-body);color:#fff}
.gold-fr{position:relative;border:4px solid #e2b13c;border-radius:8px;background:#151821;box-shadow:inset 0 0 0 2px #7a5512,inset 0 0 14px #000,0 0 0 2px #3a2306,0 4px 0 #0009}
.gold-fr::before,.gold-fr::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c21818 60%,#600);box-shadow:0 0 0 2px #e2b13c;top:-7px;left:-7px}
.gold-fr::after{left:auto;right:-7px}
.gold-fr.blue::before,.gold-fr.blue::after{background:radial-gradient(circle at 35% 35%,#9ad0ff,#1f5fd1 60%,#06215a)}
.gold-fr.green::before,.gold-fr.green::after{background:radial-gradient(circle at 35% 35%,#a6f5a6,#1e9a3a 60%,#063a12)}
.ds-slots{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:8px;margin:16px 0 8px;align-items:end}
.ds-slot{display:flex;flex-direction:column;align-items:stretch}
.ds-tag{align-self:center;margin-bottom:-6px;z-index:1;padding:3px 10px;border-radius:6px;font:900 12px/1 var(--f-body);color:#fff;background:linear-gradient(#d33,#911);border:2px solid #e2b13c;white-space:nowrap}
.ds-tag.blue{background:linear-gradient(#2f6fe0,#163f96)}
.ds-tag.green{background:linear-gradient(#2fae4c,#16702c)}
.ds-cell{aspect-ratio:1;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ds-cell img{max-width:86%;max-height:86%;image-rendering:pixelated;object-fit:contain}
.ds-cell.big{aspect-ratio:.95}
.ds-cell .nm{position:absolute;left:0;right:0;bottom:2px;font:800 9px/1 var(--f-body);color:#ffe9a8;text-align:center;text-shadow:0 1px 2px #000}
.ds-cell:empty::after{content:"";width:40%;height:2px;background:#ffffff14}
.ds-row{margin-top:16px}
.ds-row .gold-fr{display:flex;gap:6px;padding:8px 8px 8px 8px;overflow-x:auto;min-height:72px;scrollbar-width:none}
.ds-row .ds-tag{display:inline-block;margin:0 0 -4px 10px;position:relative}
.ds-own{flex:none;width:62px;height:62px;border-radius:6px;border:2px solid #6b4a10;background:#0f1117;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.ds-own img{max-width:84%;max-height:84%;image-rendering:pixelated;object-fit:contain}
.ds-own.on{border-color:#ffd54f;box-shadow:0 0 0 2px #ffd54f88,inset 0 0 10px #ffd54f55}
.ds-own.on::after{content:"✓";position:absolute;right:2px;top:0;font:900 12px/1 sans-serif;color:#ffd54f}
.ds-own.empty{border-style:dashed;border-color:#ffffff1c;background:none}
.ds-hint{font-size:11px;color:#d9c08a;margin:6px 2px 0;line-height:1.4}
.ds-bottom{display:grid;grid-template-columns:1fr 1.05fr;gap:10px;margin-top:18px;align-items:center}
.ds-bt{display:flex;flex-direction:column;gap:8px}
.ds-b{border:3px solid #e2b13c;border-radius:10px;padding:9px 8px;font:900 13px/1.2 var(--f-body);color:#fff;display:flex;align-items:center;gap:8px;text-align:left;box-shadow:inset 0 0 0 2px #0004,0 3px 0 #0008}
.ds-b i{font-style:normal;font-size:22px;filter:drop-shadow(0 1px 0 #0008)}
.ds-b.green{background:linear-gradient(#2e9b55,#1a6a36)}
.ds-b.teal{background:linear-gradient(#24808a,#14525a)}
.ds-start{position:relative;border:4px solid #8a5a10;border-radius:14px;padding:18px 6px;background:linear-gradient(#ffe68a,#f2b51e 55%,#d18a06);color:#4a2604;font:900 clamp(24px,7.6vw,34px)/1 var(--f-body);letter-spacing:.06em;box-shadow:inset 0 0 0 3px #fff6c4,0 5px 0 #6b3d08,0 0 24px #ffc84a66;text-shadow:0 1px 0 #fff8}
.ds-start::before{content:"";position:absolute;left:50%;top:-14px;width:22px;height:22px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#ff6b6b,#a50e0e);border:3px solid #e2b13c}
.ds-start:disabled{filter:grayscale(.7) brightness(.7)}
.ds-start:not(:disabled){animation:ttlPulse 2.4s ease-in-out infinite}
.ds-run{margin-top:12px;text-align:center;font-size:12px;color:#ffd54f}
.ds-test{margin-top:14px;padding:8px;border:2px dashed #ff7ad9;border-radius:10px;font-size:11px;color:#ffb3ea;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ds-test button{border:0;border-radius:999px;padding:6px 10px;background:#ff7ad9;color:#3a0a2a;font:900 11px/1 var(--f-body)}
/* --- たたかう画面 --- */
.dbat canvas{display:block;width:100%;flex:1;min-height:0;image-rendering:pixelated;touch-action:manipulation}
.dh{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.dh>*{pointer-events:auto}
.dh-l{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;max-width:58%}
.dh-hp{display:flex;align-items:center;background:#2b2b2b;border:3px solid #8a6a2a;border-radius:6px;box-shadow:inset 0 0 0 2px #0006,0 3px 0 #0007;overflow:hidden}
.dh-hp span{padding:5px 7px;background:#d9d2c3;color:#222;font:900 13px/1 var(--f-body);white-space:nowrap;border-right:3px solid #8a6a2a}
.dh-bar{flex:1;height:16px;margin:0 5px;background:#111;border:2px solid #000;border-radius:3px;overflow:hidden;position:relative}
.dh-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5dff3a,#21b50c);transition:width .25s}
.dh-bar i.mid{background:linear-gradient(#ffe14a,#d79b06)}.dh-bar i.low{background:linear-gradient(#ff6a6a,#c21010)}
.dh-hpn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 10px/1 var(--f-body);color:#fff;text-shadow:0 1px 2px #000}
.dh-wall{font:800 11px/1.2 var(--f-body);color:#fff;text-shadow:0 1px 2px #000}
.dh-tool{align-self:flex-start;border:2px solid #0006;border-radius:999px;padding:6px 10px;font:900 11px/1.15 var(--f-body);color:#3a2306;background:#fff3d2ee;box-shadow:0 2px 0 #0006;text-align:left}
.dh-tool.rec{background:#ffe0f4ee}
.dh-r{flex:none;width:min(44%,190px);border:3px solid #8a6a2a;border-radius:8px;overflow:hidden;box-shadow:0 3px 0 #0007;background:#1c1c1c}
.dh-r small{display:block;font:900 11px/1.2 var(--f-body);color:#333;background:#f3ead6;text-align:center;padding:3px 0}
.dh-coin{display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#ffe066,#f2b51e);color:#2a1a0a;font:900 clamp(20px,6vw,28px)/1.1 var(--f-body);padding:3px 4px}
.dh-coin::before{content:"";width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#e2a30c 60%,#9a6400);box-shadow:0 0 0 2px #7a5000}
.dh-time{background:#c9c9c9;color:#111;padding:2px 6px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.dh-time em{font:800 10px/1 var(--f-body);font-style:normal;color:#333}
.dh-time b{font:900 clamp(16px,5vw,22px)/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dh-stat{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 118px);font:800 11px/1.35 var(--f-body);color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;text-align:right;pointer-events:none}
.dh-buff{display:block;color:#ffe14a}
.dpan{position:relative;flex:none;background:linear-gradient(#d9b98c,#c9a374);border-top:4px solid #5b3a17;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}
.dcard{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.dcard .dc-fr{border:3px solid #2b2b2b;border-radius:5px;background:#2b2b2b;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 0 #0005}
.dcard .dc-h{background:#fff;color:#222;font:900 11px/1.5 var(--f-body);text-align:center}
.dcard .dc-img{aspect-ratio:1/1.05;background:#9fd0e6;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.dcard .dc-img.sub{background:#111}
.dcard .dc-img img{position:absolute;image-rendering:pixelated}
.dcard .dc-cost{background:#e8b41a;color:#c3121a;font:900 10px/1.4 var(--f-body);text-align:center}
.dcard .dc-up{border:3px solid #2b2b2b;border-radius:0;background:#ffd84a;color:#2b1a05;font:900 15px/1 var(--f-body);padding:8px 0;margin:0}
.dcard .dc-up:disabled{filter:grayscale(.6) brightness(.85)}
.dcard .dc-up:not(:disabled):active{transform:scale(.95)}
.dcard .dc-lv{font:900 15px/1 var(--f-body);color:#2b1a05;padding-left:2px}
.dcard.none .dc-img{background:#0006}
.dcard.none .dc-img::after{content:"―";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff6;font-size:20px}
.dbtns{display:flex;flex-direction:column;gap:6px}
.dbtn{flex:1;border:3px solid #333;border-radius:4px;background:#cfe0ea;color:#111;font:900 clamp(12px,3.6vw,15px)/1.15 var(--f-body);padding:4px;box-shadow:inset 0 0 0 2px #fff8,0 3px 0 #0005}
.dbtn small{display:block;color:#d0121a;font:900 11px/1.2 var(--f-body);margin-top:2px}
.dbtn.item{font-size:clamp(17px,5vw,22px)}
.dbtn:active{transform:scale(.96)}
.dbtn:disabled{opacity:.55}
.dfo .dlg-bg{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:#0007}
.dfo .dlg-bg.clear{background:none;pointer-events:none}
.dfo .dlg-bg.clear>*{pointer-events:auto}
.dshop{width:min(100%,360px);background:linear-gradient(#f6e6c4,#ead2a0);color:#2a1a0a;border:4px solid #6b4a1a;border-radius:10px;padding:12px;box-shadow:inset 0 0 0 3px #e2b13c,0 10px 30px #000a}
.dshop h4{margin:0 0 8px;font:900 16px/1.35 var(--f-body)}
.dshop .ds-have{background:#111;border:3px solid #e2b13c;border-radius:6px;color:#ff4a4a;font:900 22px/1 var(--f-body);text-align:center;padding:8px;margin-bottom:8px}
.dshop .ds-have small{display:block;font-size:10px;color:#ffe9a8;margin-bottom:3px}
.dshop .it{width:100%;display:flex;align-items:center;gap:8px;border:3px solid #8a6a2a;border-radius:6px;background:#fff8e6;padding:7px 8px;margin-top:6px;text-align:left;color:#2a1a0a}
.dshop .it i{font-style:normal;font-size:22px;width:28px;text-align:center}
.dshop .it b{flex:1;font:900 15px/1.2 var(--f-body)}
.dshop .it b small{display:block;font:700 10px/1.3 var(--f-body);color:#6b4a1a}
.dshop .it em{font-style:normal;background:#111;color:#ff4a4a;font:900 13px/1 var(--f-body);padding:5px 6px;border-radius:4px}
.dshop .it:disabled{opacity:.5}
.dshop .it.on{outline:3px solid #2f6fe0}
.dshop .x{margin-top:10px;width:100%;border:0;border-radius:8px;background:#5b3a17;color:#fff;font:900 14px/1 var(--f-body);padding:10px}
.dcard-d{width:min(100%,340px);background:#1e2a24;border:3px solid #e2b13c;border-radius:12px;padding:16px;text-align:center;box-shadow:0 10px 30px #000a}
.dcard-d h4{margin:0 0 8px;font:900 18px/1.3 var(--f-body);color:#ffe9a8}
.dcard-d p{margin:6px 0;font-size:13px;line-height:1.55}
.dcard-d img{max-width:150px;max-height:130px;image-rendering:pixelated;margin:6px auto;display:block}
.dcard-d .big{font:900 30px/1.1 var(--f-body);color:#ffd54f;margin:6px 0}
.dcard-d .btn2{display:block;width:100%;margin-top:8px;border:0;border-radius:10px;padding:12px;font:900 15px/1 var(--f-body);background:#f2c94c;color:#3a2306}
.dcard-d .btn2.ghost{background:#ffffff1a;color:#fff}
.dcard-d .btn2:disabled{opacity:.5}
.dfo .dmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:15;background:#000c;color:#fff;border:2px solid #ffd54f;border-radius:12px;padding:10px 16px;font:900 14px/1.4 var(--f-body);text-align:center;pointer-events:none;max-width:86%;animation:dmsg 2.2s ease forwards}
@keyframes dmsg{0%{opacity:0;transform:translate(-50%,-40%)}10%,80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-60%)}}
.dfo .dtest{position:absolute;left:8px;bottom:calc(100% + 6px);display:flex;gap:4px;z-index:5}
.dfo .dtest button{border:0;border-radius:999px;padding:5px 8px;background:#ff7ad9;color:#3a0a2a;font:900 10px/1 var(--f-body)}
.def-rec{margin:14px 0 4px}
.def-rec h4{margin:0 0 6px;font:900 14px/1.3 var(--f-body)}
.def-rec img{display:block;width:100%;border-radius:10px;border:3px solid #e2b13c;box-shadow:0 4px 0 #0006}
.def-rec small{display:block;margin-top:4px;font-size:11px;opacity:.7}
/* ===== トトの冒険（2Dアクション） ===== */
.ai-ch{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;text-align:center}
.ai-ch>b{font-size:14px}
.ai-ch small{font-size:11.5px;line-height:1.5;opacity:.9}
.ai-chs{display:flex;gap:10px;justify-content:center}
.ai-chs button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:12px;border:2px solid #ffffff40;background:#0003;color:inherit;font:inherit;font-weight:900;font-size:13px;cursor:pointer}
.ai-chs button img{height:64px;width:auto;object-fit:contain;image-rendering:pixelated}
.ai-chs button[aria-pressed="true"]{border-color:var(--staff,#ffc94a);background:#ffc94a22;box-shadow:0 0 0 2px #ffc94a55}
.ai-chs button:disabled{cursor:default;opacity:.75}
.ttl-adv{position:absolute;left:358px;top:1008px;width:340px;height:112px;padding:0;border:0;background:none;cursor:pointer}
.ttl-adv img{position:absolute;inset:0;width:100%;height:100%}
html .ttl .ttl-adv span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 46px/1 var(--f-body);color:#3a1a08;white-space:nowrap}
html[lang=en] .ttl .ttl-adv span{font-size:32px}
.ttl-adv:active{transform:scale(.96)}
.ttl-rk{position:absolute;left:288px;top:1150px;width:480px;height:90px;padding-top:12px;box-sizing:border-box;overflow:visible!important;display:grid;grid-template-columns:1fr 1fr;background:#8a5a2b;border:6px solid #3a2306;border-radius:18px;box-shadow:inset 0 -8px 0 #6b4220,0 6px 0 #0004;overflow:hidden}
.ttl-rk>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ttl-rk>div+div{border-left:5px solid #3a2306}
.ttl .ttl-rk small{display:block;font:800 19px/1 var(--f-body);color:#f6e6c4;white-space:nowrap}
.ttl-nx{position:absolute;left:213px;top:1244px;width:630px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.ttl .ttl-nx div{background:#fff8e8ee;border:4px solid #3a2306;border-radius:999px;padding:3px 16px;font:900 19px/1.15 var(--f-body);color:#3a2306;white-space:nowrap}
.ttl-rt{position:absolute;left:288px;top:1322px;width:480px;height:52px;display:flex;align-items:center;justify-content:center;gap:12px;background:#2a1a0ae0;border:5px solid #3a2306;border-radius:999px;color:#fff8e8;box-shadow:0 5px 0 #0004}
.ttl .ttl-rt span{display:block;font:800 22px/1 var(--f-body)}
.ttl .ttl-rt b{font:900 32px/1 var(--f-pix,monospace);color:#ffd75e;letter-spacing:.04em}
.ttl-rkh{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:900 20px/1 var(--f-body);font-style:normal;color:#3a2306;background:#ffd75e;border:4px solid #3a2306;border-radius:999px;padding:5px 16px;white-space:nowrap;z-index:1}
.ttl .ttl-rk b{font:900 38px/1 var(--f-body);color:#fff8e8;text-shadow:0 3px 0 #3a2306}
.adv{position:fixed;inset:0;z-index:140;background:#1d140b;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.adv-box{position:relative;width:100%;max-width:calc(100dvh*.9);height:100%;overflow:hidden}
.adv canvas{position:absolute;inset:0;display:block;image-rendering:pixelated}
.adv-hud{position:absolute;left:0;right:0;top:max(8px,env(safe-area-inset-top,0px));display:flex;gap:6px;padding:0 8px;align-items:flex-start;pointer-events:none;font-family:var(--f-pix,monospace)}
.ah{background:#fff8e8;border:3px solid #2a1a0a;border-radius:6px;box-shadow:0 3px 0 #0005;color:#2a1a0a}
.ah small{display:block;font:800 10px/1.1 var(--f-body);color:#4a3218}
.ah-lv{flex:1.25;padding:3px 6px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;align-items:center}
.ah-lvn{font:900 14px/1 var(--f-pix,monospace)}
.ah-lv .ah-hp{grid-column:1/3;display:flex;align-items:center;gap:4px}
.ah-bar{flex:1;height:10px;background:#b3261e;border:2px solid #2a1a0a;border-radius:3px;overflow:hidden}
.ah-bar i{display:block;height:100%;background:linear-gradient(#7be05a,#3fae2a);transition:width .15s}
.ah-hpn{grid-row:1;grid-column:2;text-align:right;font:800 11px/1 var(--f-pix,monospace)}
.ah-time{flex:1.3;padding:3px 6px;text-align:center}
.ah-time>b{display:block;font:900 20px/1.05 var(--f-pix,monospace);letter-spacing:.02em}
.ah-best{display:flex;gap:4px;align-items:center;justify-content:center;border-top:2px solid #2a1a0a;margin-top:2px;padding-top:2px;font:800 10px/1 var(--f-pix,monospace)}
.ah-best small{display:inline;white-space:nowrap;font-size:9px;background:#2a1a0a;color:#fff8e8;padding:1px 3px;border-radius:3px}
.ah-cnt{flex:.7;padding:3px 6px;text-align:center}
.ah-cnt b{display:block;font:900 20px/1.1 var(--f-pix,monospace)}
.adv-msg{position:absolute;left:50%;top:22%;transform:translate(-50%,-10px);background:#000c;color:#fff;font:800 14px/1.4 var(--f-body);padding:8px 14px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.adv-msg.on{opacity:1;transform:translate(-50%,0)}
.adv-stock{position:absolute;left:8px;top:18%;z-index:3;display:flex;flex-direction:column;align-items:flex-start}   /* 画面の左側に縦にならべ、そのすぐ下に装備の枠 */
.adv-stock>small{display:block;white-space:nowrap;font:900 10px/1.2 var(--f-body);color:#fff;text-shadow:0 1px 2px #000a;margin:0 0 3px 2px}
.as-row{display:flex;flex-direction:column;gap:4px;background:#2a2622;border:3px solid #1a1714;border-radius:6px;padding:4px;box-shadow:0 3px 0 #0005}
.as-cell{position:relative;width:min(13vw,7dvh,56px);aspect-ratio:1;border:2px solid #1a1714;border-radius:4px;background:#4a4540;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.as-cell img{max-width:76%;max-height:76%;image-rendering:pixelated;pointer-events:none}
.as-cell small{position:absolute;right:2px;bottom:1px;font:900 10px/1 var(--f-pix,monospace);color:#fff;text-shadow:0 1px 0 #000;pointer-events:none}
.as-cell.on:active{transform:scale(.93)}
.ab-cell em.stk{left:auto;right:2px;top:1px;background:#7fd0ff}

/* エラーが起きたら、画面の下に小さく出す（原因を調べるため。スクリーンショットを送ってもらう） 2026-10-25 */
(function(){ const seen=new Set();
  function show(msg,src){ try{ msg=String(msg||"エラー").slice(0,160); if(seen.has(msg)||seen.size>3) return; seen.add(msg);
    const box=document.createElement("div"); box.setAttribute("translate","no");
    box.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99999;background:#3a0d0dee;color:#fff;border:2px solid #ff7a6a;border-radius:10px;padding:8px 10px;font:12px/1.5 system-ui,sans-serif;word-break:break-all";
    box.innerHTML="⚠️ エラーが起きました（この画面のスクリーンショットを運営に送ってください）<br><b></b><br><small></small> <button type='button' style='float:right;margin-top:4px'>とじる</button>";
    box.querySelector("b").textContent=msg; box.querySelector("small").textContent=(src||"")+" / "+navigator.userAgent.slice(0,90);
    box.querySelector("button").onclick=()=>box.remove();
    (document.body||document.documentElement).appendChild(box); }catch(e){} }
  window.addEventListener("error",e=>{ if(e && e.message) show(e.message, (String(e.filename||"").split("/").pop()||"")+":"+(e.lineno||"")); });
  window.addEventListener("unhandledrejection",e=>{ const r=e&&e.reason; const m=r&&(r.message||String(r)); if(m && !/network|fetch|Failed to get document|offline|unavailable|permission|deadline|timeout|TO/i.test(m)) show(m,"promise"); });
  window.showErr=show; })();
</script>

  const lay=()=>{ if(T.hidden) return; const vw=innerWidth, vh=innerHeight; const s=vh/H;   // 高さに合わせる（スマホは左右が少し切れ、PCは左右にぼかした背景）
    const sw=W*s, ox=(vw-sw)/2; st.style.transform=`translate(${ox}px,0) scale(${s})`;
    // 画面がせまいときは、タイトルの巻物を見えている幅に合わせて小さくする
    const vis=Math.min(W, vw/s), bw=Math.min(900, vis*0.96), bh=bw*350/900, bn=T.querySelector(".ttl-banner");
    bn.style.width=bw+"px"; bn.style.height=bh+"px"; bn.style.left=(W-bw)/2+"px"; bn.style.top=(413-bh/2)+"px";
    T.style.setProperty("--s",s);
    const fl=Math.max(0,ox), fr=Math.min(vw,ox+sw), m=Math.max(10,30*s);
    set.style.width=138*s+"px"; set.style.height=169*s+"px"; set.style.left=(fl+m)+"px"; set.style.top=Math.max(10,31*s)+"px";
    upd.style.width=319*s+"px"; upd.style.height=97*s+"px"; upd.style.left=(fr-m-319*s)+"px"; upd.style.top=Math.max(10,47*s)+"px";
    if(fr-fl<(138+319)*s+3*m){ const k=(fr-fl-3*m)/((138+319)*s); set.style.width=138*s*k+"px"; set.style.height=169*s*k+"px"; upd.style.width=319*s*k+"px"; upd.style.height=97*s*k+"px"; upd.style.left=(fr-m-319*s*k)+"px"; }
    // 呪文・QRプレゼントのボタン：アップデート情報のすぐ下
    if(cod){ cod.style.width=upd.style.width; cod.style.height=upd.style.height; cod.style.left=upd.style.left; cod.style.top=(parseFloat(upd.style.top)+parseFloat(upd.style.height)+Math.max(8,22*s))+"px"; }
    // 2026-10-28：お知らせのボタン：設定とゲーム情報のあいだ
    const nw=document.getElementById("ttlNews"); if(nw){ const L=parseFloat(set.style.left)+parseFloat(set.style.width)+m*0.6, R=parseFloat(upd.style.left)-m*0.6;
      nw.style.left=L+"px"; nw.style.width=Math.max(40,R-L)+"px"; nw.style.height=upd.style.height; nw.style.top=upd.style.top; }
  };
  window.ttlLay=()=>{ lay(); T.classList.add("laid"); };
  window.ttlLay(); addEventListener("resize",window.ttlLay);
})();
</script>

/* ---------- 言語切り替え（日本語 / English） ----------
   画面に出た日本語を、下の辞書で英語に置きかえる。新しい文を足したら I18N_EN にも英語を足す。
   {0} {1} … は数字や名前が入るところ。辞書にない文は日本語のまま出る */
let LANG="ja";

const I18N=(()=>{

  const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  for(const [ja,en] of Object.entries(D)){
    if(!/\{\d+\}/.test(ja)){ exact.set(ja,en); continue; }
    const order=[]; const src="^"+ja.split(/(\{\d+\})/).map(p=>{ const m=p.match(/^\{(\d+)\}$/); if(m){ order.push(+m[1]); return "(.*?)"; } return reEsc(p); }).join("")+"$";
    pats.push({re:new RegExp(src,"s"), order, en, w:ja.replace(/\{\d+\}/g,"").length});
  }
  pats.sort((a,b)=>b.w-a.w);
  // 辞書の語を長い順に並べた「部分置きかえ」用（最後の手段）
  const keys=[...exact.keys()].filter(k=>k.length>=2&&JPC.test(k)).sort((a,b)=>b.length-a.length);
  const seg=keys.length?new RegExp(keys.map(reEsc).join("|"),"g"):null;
  const PUNC={"、":", ","。":". ","！":"!","？":"?","：":": ","；":"; ","（":" (","）":")","「":"\"","」":"\"","『":"\"","』":"\"","／":" / ","・":" · ","〜":"–","～":"–","＋":"+","−":"−","＆":" & ","　":" ","…":"…","ー":"-","％":"%","＃":"#","＞":">","＜":"<","＝":"="};
  const punc=t=>t.replace(/[、。！？：；（）「」『』／・〜～＋＆　％＃＞＜＝]/g,c=>PUNC[c]??c).replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const cache=new Map();
  function tr(s, depth=0){
    if(!JPC.test(s)) return s;
    if(cache.has(s)) return cache.get(s);
    let out=exact.get(s);
    if(out===undefined){
      for(const p of pats){ const m=s.match(p.re); if(!m) continue;
        out=p.en.replace(/\{(\d+)\}/g,(_,i)=>{ const v=m[p.order.indexOf(+i)+1]??""; return depth<4?tr(v,depth+1):v; }); break; }
    }
    if(out===undefined && depth<4){ const t=s.replace(/[。、！？]+$/,"");   // 最後の句読点だけ違うときは、中身を訳してつなぐ
      if(t && t!==s){ const mid=tr(t,depth+1); if(!JPC.test(mid)) out=mid+punc(s.slice(t.length)); } }
    if(out===undefined){ out=seg?s.replace(seg,k=>exact.get(k)):s; out=punc(out).replace(/ {2,}/g," "); }

    walk(document.body);

      if(m.type==="characterData") { if(!skip(m.target.parentElement)) node(m.target); }

  }

const IMG = {};

// 融合で生まれたオリジナル魔物（2026-10-26）：MONSTERS にない番号は、セーブ（S.fmons）か読みこんだ一覧（FMON_CACHE）から追加する
const FMON_CACHE = {};
// 融合でできる魔物のランク：どちらかが限定ランクなら限定ランク、それ以外（C〜Z・融合ランク）は融合ランク
const fuseRank=(a,b)=>((mon(a)||{}).rank==='L'||(mon(b)||{}).rank==='L')?'L':'F';
const rkName=r=>r==='L'?'限定':'融合';
function fmonReg(id){ const f=((typeof S!=="undefined"&&S&&S.fmons)||{})[id]||FMON_CACHE[id]; if(!f||!f.img) return undefined;
  const m={ id, name:f.name||"融合魔物", rank:f.rk==="L"?"L":"F", exp:10000, gift:1, fuse:1, img:f.img, recipe:{a:f.a, b:f.b, an:f.an, bn:f.bn} }; MONSTERS.push(m);
  const im=new Image(); im.onload=()=>{ IMG[id]=im; try{ cardCache.forEach((v,k)=>{ if(k.startsWith(id+"|")) cardCache.delete(k); }); }catch(e){} try{ if(tab==="box"&&boxMode==="dexM"){ clearTimeout(fmonReg.t); fmonReg.t=setTimeout(()=>{ const y=$("#stage").scrollTop; render(); $("#stage").scrollTop=y; },150); } }catch(e){} }; im.src=f.img; return m; }
const mon = id => MONSTERS.find(m=>m.id===id) || fmonReg(id);
const rankColor = r => getComputedStyle(document.documentElement).getPropertyValue("--r-"+r.toLowerCase()).trim();

/* ---------- 魔物カードの枠を描く (10段階) ---------- */
const cardCache = new Map();
function cardURL(mid, stage, size=256){
  stage = RANK_FRAME[mon(mid).rank];
  const key = mid+"|"+stage+"|"+size;
  if(cardCache.has(key)) return cardCache.get(key);
  const cv = document.createElement("canvas"); cv.width=cv.height=size;
  drawCard(cv.getContext("2d"), mid, stage, size);
  const url = cv.toDataURL(); if(IMG[mid]) cardCache.set(key,url); return url;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawCard(ctx, mid, stage, S0){
  const st = STAGES[stage], m = mon(mid), u = S0/256;
  const bw = (7 + stage*1.6)*u;
  // 外枠
  let g;
  if(st.rainbow){ g = ctx.createLinearGradient(0,0,S0,S0); ["#ff5e8a","#ffb84d","#ffe46b","#7ee08a","#5fb7e0","#b78cf0"].forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c)); }
  else { g = ctx.createLinearGradient(0,0,S0,S0); g.addColorStop(0,st.b); g.addColorStop(.5,st.a); g.addColorStop(1,st.b); }
  if(st.divine){ ctx.save(); ctx.shadowColor="#ffe9a0"; ctx.shadowBlur=18*u; }
  rr(ctx,2*u,2*u,S0-4*u,S0-4*u,22*u); ctx.fillStyle=g; ctx.fill();
  if(st.divine) ctx.restore();
  ctx.lineWidth=2*u; ctx.strokeStyle=st.c; ctx.stroke();
  // 内側の背景
  const ix=bw, iw=S0-bw*2;
  rr(ctx,ix,ix,iw,iw,15*u); ctx.save(); ctx.clip();
  const rc = rankColor(m.rank);
  const bg = ctx.createRadialGradient(S0/2,S0*.42,4,S0/2,S0/2,S0*.7);
  bg.addColorStop(0,"#2f4a40"); bg.addColorStop(.7,"#1a2823"); bg.addColorStop(1,"#101814");
  ctx.fillStyle=bg; ctx.fillRect(0,0,S0,S0);
  ctx.globalAlpha=.25; ctx.fillStyle=rc; ctx.beginPath(); ctx.arc(S0/2,S0*.46,S0*.33,0,7); ctx.fill(); ctx.globalAlpha=1;
  if(stage>=4){ // 後光
    ctx.save(); ctx.translate(S0/2,S0*.46); ctx.globalAlpha=.12+stage*.015; ctx.fillStyle=st.b;
    const n=8+stage*2; for(let i=0;i<n;i++){ ctx.rotate(Math.PI*2/n); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-6*u,-S0*.6); ctx.lineTo(6*u,-S0*.6); ctx.fill(); }
    ctx.restore();
  }
  if(IMG[mid]){ const p=iw*.04; ctx.drawImage(IMG[mid],ix+p,ix+p,iw-p*2,iw-p*2); }
  ctx.restore();
  rr(ctx,ix,ix,iw,iw,15*u); ctx.lineWidth=2*u; ctx.strokeStyle=st.c; ctx.stroke();
  // 角の飾り (段階ごとに増える)
  const orn = Math.min(stage,4);
  const corners=[[bw*.5,bw*.5],[S0-bw*.5,bw*.5],[S0-bw*.5,S0-bw*.5],[bw*.5,S0-bw*.5]];
  if(stage>=1) corners.forEach(([x,y])=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4); ctx.fillStyle=st.b; ctx.strokeStyle=st.c; ctx.lineWidth=1.5*u; const s=(5+orn*2)*u; ctx.fillRect(-s/2,-s/2,s,s); ctx.strokeRect(-s/2,-s/2,s,s); ctx.restore(); });
  // 宝石 (翡翠以上)
  if(stage>=5){
    const gem=(x,y,r,c)=>{ const gg=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r); gg.addColorStop(0,"#fff"); gg.addColorStop(.35,c); gg.addColorStop(1,st.c); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); };
    const gc = st.rainbow?"#ff5e8a":st.divine?"#ffd04a":st.b;
    gem(S0/2,bw*.5,(4+stage*.6)*u,gc);
    if(stage>=7){ gem(S0/2,S0-bw*.5,(3+stage*.5)*u,gc); gem(bw*.5,S0/2,(3+stage*.4)*u,gc); gem(S0-bw*.5,S0/2,(3+stage*.4)*u,gc); }
  }
  // 段階の星
  if(stage>=1){
    ctx.fillStyle = st.divine?"#b88a1e":"#fff"; ctx.globalAlpha=.9;
    const n=stage, sp=9*u, x0=S0/2-(n-1)*sp/2, y=S0-bw*.5;
    if(stage<7) for(let i=0;i<n;i++) star(ctx,x0+i*sp,y,3.4*u,1.5*u);
    ctx.globalAlpha=1;
  }
}
function star(ctx,x,y,R,r,p=5){ctx.beginPath();for(let i=0;i<p*2;i++){const a=-Math.PI/2+i*Math.PI/p,d=i%2?r:R;ctx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}ctx.closePath();ctx.fill()}

/* ---------- アイコン枠を描く ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const frameCache = new Map();
function frameURL(fid,size=200){
  const key=fid+"|"+size; if(frameCache.has(key)) return frameCache.get(key);
  const cv=document.createElement("canvas"); cv.width=cv.height=size; const ctx=cv.getContext("2d");
  ctx.fillStyle="#22332c"; ctx.beginPath(); ctx.arc(size/2,size/2,size*FRAME_IN,0,7); ctx.fill();
  drawFrame(ctx,fid,size);
  const url=cv.toDataURL(); frameCache.set(key,url); return url;

function drawFrame(ctx,fid,S0){

/* ---------- レベルアップ処理 ---------- */
function addExp(unit, amount){
  const ev={levels:0, evo:0, coins:0, capped:false};
  const cap=capOf(unit);
  if(unit.l>=cap){ unit.e=0; ev.capped=true; return ev; }
  unit.e += amount;
  while(unit.l<cap){
    const need=needFor(unit); if(unit.e<need) break;
    unit.e-=need; unit.l++; unit.g++; ev.levels++;
    if(unit.g%10===0) ev.coins+=100;
  }
  if(unit.l>=cap){ unit.e=0; ev.capped=true; }
  return ev;
}
function previewExp(unit, amount){ const c={...unit}; const ev=addExp(c,amount); return {u:c, ev}; }

// ガチャチケットで魔物パックを引くと、S・Zランクの確率が2.5倍（そのぶんCランクが減る）
const TICKET_BOOST = 2.5;
const RATES_TICKET = (()=>{ const t={...RATES}; t.Z=+(RATES.Z*TICKET_BOOST).toFixed(4); t.S=+(RATES.S*TICKET_BOOST).toFixed(4); t.C=+(100-t.Z-t.S-t.A-t.B).toFixed(4); return t; })();
function rollRank(R=RATES){ let x=Math.random()*100; for(const r of ["Z","S","A","B","C"]){ if((x-=R[r])<0) return r; } return "C"; }
// rate を持つ魔物は個別の確率で先に抽選し、ランク抽選の候補からは外す
const SPECIAL = MONSTERS.filter(m=>m.rate&&!m.gift&&!m.evoOnly&&m.rank!=="L");
const NORMAL = MONSTERS.filter(m=>!m.rate&&!m.gift&&!m.evoOnly&&m.rank!=="L");   // 進化でしか手に入らない魔物はガチャに出ない
function rollMonster(ticket){
  let x=Math.random()*100;
  for(const m of SPECIAL){ if((x-=m.rate)<0) return m; }
  return pickFrom(NORMAL, rollRank(ticket?RATES_TICKET:RATES));
}
const COLLAB_W = 0.5;
function pickFrom(list, rank){
  const order=[rank]; const i=RANKS.indexOf(rank);
  for(let d=1;d<5;d++){ if(RANKS[i-d]) order.push(RANKS[i-d]); if(RANKS[i+d]) order.push(RANKS[i+d]); }
  for(const r of order){ const p=list.filter(x=>x.rank===r); if(!p.length) continue;
    // コラボの魔物（by あり）は、同じランクのほかの魔物の半分の出やすさ
    const w=x=>x.by?COLLAB_W:1, tot=p.reduce((a,x)=>a+w(x),0); let k=Math.random()*tot; for(const x of p){ if((k-=w(x))<0) return x; } return p[p.length-1]; }
}

    .sort((a,b)=>(RANKS.indexOf(mon(a.m).rank)-RANKS.indexOf(mon(b.m).rank)) || ((a.k?1:0)-(b.k?1:0)) || (a.l-b.l) || (a.u-b.u)).slice(0,over);

  let p=NORMAL.filter(m=>m.rank===rank); if(!p.length) p=NORMAL.filter(m=>["S","Z"].includes(m.rank));
  const w=m=>(S.got[m.id]?1:RARE_NEW_W)*(m.by?COLLAB_W:1), tot=p.reduce((a,m)=>a+w(m),0); let k=Math.random()*tot;
  for(const m of p){ if((k-=w(m))<0) return m; } return p[p.length-1]; }

// 10連より多いときは同じものをまとめて、ランクの高い順に並べる
function groupRes(res){
  if(res.length<=10) return res;
  const m=new Map();
  res.forEach(r=>{ const g=m.get(r.name); if(g){ g.count++; g.isNew=g.isNew||r.isNew; if(r.u!=null) g.us.push(r.u); } else m.set(r.name,{...r,count:1,us:r.u!=null?[r.u]:[]}); });

const PACK_IMG = "im/8d68db3f6422.jpg";
const PACK_TEAR = 0.117;   // 切り込みの位置（パックの高さに対する割合）
function openPack(res, kind, title, opts={}){
  const n=res.length, best=res.reduce((a,b)=>RANKS.indexOf(b.rank)>RANKS.indexOf(a.rank)?b:a,res[0]);
  const shine=best.rank==="S"||best.rank==="Z";

  el.innerHTML=`<div class="pk-title">${opts.rare?"✨ 魔物レアパック ✨":kind==="mon"?"魔物パック":kind==="deco"?"装飾パック":"アイコン枠パック"}</div>
    <div class="pk-wrap" style="--pk:url('${PACK_IMG}')">
      ${n>=10?`<div class="pk-ghost g2"></div><div class="pk-ghost g1"></div>`:""}${n>=100?`<div class="pk-ghost g3"></div>`:""}
      <div class="pk">
        <div class="pk-glow ${best.rank==="Z"?"z":""}"></div>
        <img class="pk-card" src="${best.img}" alt="">
        <div class="pk-body"><div class="pk-label">${opts.rare?"RARE MONSTER PACK":kind==="mon"?"MONSTER PACK":kind==="deco"?"HOME DECO PACK":"ICON FRAME PACK"}<b>${n===1?"1パック":n+"連パック"}</b></div></div>
        <div class="pk-strip"><div class="pk-cut"></div></div>
        <div class="pk-finger" aria-hidden="true">👆</div>
      </div>
    </div>
    <p class="pk-hint">上の切り込みを、指で横になぞって開けよう</p>
    <button class="pk-skip" type="button">なぞれないときはタップで開ける</button>`;
  document.body.appendChild(el);
  const pk=el.querySelector(".pk"), strip=el.querySelector(".pk-strip"), cut=el.querySelector(".pk-cut");
  let opened=false, drag=null, lastX=0, run=0;
  const open=()=>{ if(opened) return; opened=true;
    el.classList.add("opened"); strip.classList.add(drag&&drag.dir<0?"gone-l":"gone-r"); SFX.rip();
    if(shine) setTimeout(()=>{ el.classList.add("shine"); SFX.sparkle(); },420);
    setTimeout(()=>{ el.classList.add("fade"); setTimeout(()=>{ el.remove(); showReveal(res,title,opts); },260); }, shine?2100:1400);
  };
  strip.addEventListener("pointerdown",e=>{ if(opened) return; e.preventDefault(); strip.setPointerCapture(e.pointerId);
    const r=pk.getBoundingClientRect(); drag={x0:e.clientX, min:e.clientX, max:e.clientX, w:r.width, left:r.left, dir:0}; lastX=e.clientX; run=0; el.classList.add("touching"); });
  strip.addEventListener("pointermove",e=>{ if(!drag||opened) return;
    const x=Math.max(drag.left,Math.min(drag.left+drag.w,e.clientX));
    drag.min=Math.min(drag.min,x); drag.max=Math.max(drag.max,x); drag.dir=x-drag.x0;
    run+=Math.abs(x-lastX); lastX=x;
    while(run>9){ run-=9; SFX.tear(.7+Math.random()*.4); }
    const prog=(drag.max-drag.min)/drag.w;
    cut.style.left=((drag.min-drag.left)/drag.w*100)+"%"; cut.style.width=(prog*100)+"%";
    strip.style.transform=`translateY(${-prog*3}px) rotate(${(drag.dir<0?1:-1)*prog*2.5}deg)`;
    if(prog>=0.72) open(); });
  const end=()=>{ if(!opened && drag){ strip.style.transform=""; } drag=opened?drag:null; el.classList.remove("touching"); };
  strip.addEventListener("pointerup",end); strip.addEventListener("pointercancel",end);
  el.querySelector(".pk-skip").onclick=open;
}

      const rk=el.querySelector("#rvRk"); if(rk){ const by={}; units(G.flatMap(g=>g.us)).filter(z=>!sellLockLeft(z)&&!z.k&&z.u!==S.guard).forEach(z=>{ const r=mon(z.m).rank; (by[r]=by[r]||[]).push(z.u); });
        const rs=["C","B","A","S","Z","F","L"].filter(r=>by[r]); rk.innerHTML=rs.length?`<small>${L?"Sell by rank":"ランク別に売却"}</small>${rs.map(r=>`<button type="button" data-rks="${r}"><span class="rk rk-${r}">${r==="L"?(L?"Ltd":"限定"):r}</span>×${by[r].length}</button>`).join("")}`:"";
        rk.querySelectorAll("[data-rks]").forEach(b=>b.onclick=()=>confirmSell(by[b.dataset.rks],()=>{ upd(); renderCoins(); try{ drawPick(); }catch(e){} })); }

    // 選択して売却：ボタンを押すと選ぶモード。魔物をタップしてえらび、もう一度ボタンで売却
    let picking=false; const pick=new Set(); const pb=el.querySelector("#rvPick"), hint=el.querySelector("#rvHint");
    const sellable=g=>units(g.us).filter(z=>!sellLockLeft(z)&&!z.k&&z.u!==S.guard);

      const n=[...pick].reduce((t,i)=>t+sellable(G[i]).length,0);

    pb.onclick=()=>{ if(!picking){ picking=true; pick.clear(); return drawPick(); }

    G.forEach((g,i)=>{ const c=el.querySelector(`[data-rv="${i}"]`); if(c) c.addEventListener("click",()=>{ if(!picking) return; if(!sellable(g).length) return toast(L?"This one can't be sold":"この魔物は売却できません"); pick.has(i)?pick.delete(i):pick.add(i); drawPick(); }); });
    upd(); }

/* ---------- 効果音 (その場で合成) ---------- */
const SND_KEY="toto-monsters-sound";
let muted=false; try{ muted=localStorage.getItem(SND_KEY)==="off" }catch(e){}
let AC=null;
function ac(){ if(muted) return null; if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)() }catch(e){ return null } } if(AC.state==="suspended") AC.resume(); return AC; }
function voice(c,{f,f2=f,t=0,dur=.12,type="sine",vol=.2,attack=.004}){
  const o=c.createOscillator(), g=c.createGain(), now=c.currentTime+t;
  o.type=type; o.frequency.setValueAtTime(f,now); o.frequency.exponentialRampToValueAtTime(f2,now+dur);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(vol,now+attack); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g).connect(c.destination); o.start(now); o.stop(now+dur+.02);
}
const SFX={
  tap(){ const c=ac(); if(!c) return; const j=1+(Math.random()-.5)*.08;   // ぽこっ、と丸い泡のはじける音
    voice(c,{f:880*j,f2:440*j,dur:.09,vol:.22}); voice(c,{f:1760*j,f2:1320*j,dur:.035,type:"triangle",vol:.05}); },
  coin(){ const c=ac(); if(!c) return; voice(c,{f:988,dur:.09,type:"square",vol:.06}); voice(c,{f:1319,t:.08,dur:.35,type:"square",vol:.06}); voice(c,{f:2637,t:.08,dur:.3,vol:.05}); },
  level(){ const c=ac(); if(!c) return; [523,659,784,1047].forEach((f,i)=>voice(c,{f,t:i*.07,dur:.22,type:"triangle",vol:.12})); },
  reveal(rank){ const c=ac(); if(!c) return;
    const base=[523,659,784,1047]; base.forEach((f,i)=>voice(c,{f,t:i*.06,dur:.25,type:"triangle",vol:.1}));
    if(rank==="S"||rank==="Z"){ [1319,1568,2093].forEach((f,i)=>voice(c,{f,t:.3+i*.08,dur:.5,type:"sine",vol:.12})); }
    if(rank==="Z"){ [784,988,1175,1568,1976,2349].forEach((f,i)=>voice(c,{f,t:.6+i*.05,dur:.9,type:"triangle",vol:.08})); voice(c,{f:130,f2:65,t:.55,dur:1.2,vol:.2}); } },
  ng(){ const c=ac(); if(!c) return; voice(c,{f:220,f2:180,dur:.16,type:"square",vol:.05}); },
  // 紙が裂ける音：ノイズを細かく刻んで、なぞる速さに合わせて鳴らす
  tear(strength=1){ const c=ac(); if(!c) return;
    if(!NOISE){ NOISE=c.createBuffer(1,Math.floor(c.sampleRate*.6),c.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(Math.random()<.25?1:.3); }
    const t=c.currentTime, dur=.03+Math.random()*.035;
    const src=c.createBufferSource(); src.buffer=NOISE; src.playbackRate.value=.85+Math.random()*.4;
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1600+Math.random()*2800; bp.Q.value=.8;
    const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=700;
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28*strength,t+.003); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(bp).connect(hp).connect(g).connect(c.destination); src.start(t,Math.random()*.5,dur+.02); },
  rip(){ for(let i=0;i<7;i++) setTimeout(()=>SFX.tear(1.25-i*.1),i*16);
    const c=ac(); if(c) voice(c,{f:180,f2:90,t:.02,dur:.12,vol:.06}); },
  sparkle(){ const c=ac(); if(!c) return; [2093,2637,3136,2637,3520].forEach((f,i)=>voice(c,{f,t:i*.07,dur:.35,vol:.05})); },
};
let NOISE=null;
document.addEventListener("pointerdown",e=>{ const b=e.target.closest("button,.chip"); if(b && !b.disabled && b.id!=="snd") SFX.tap(); },true);
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
/* ===== BGM：曲の最後をフェードアウトさせ、次の周回をフェードインで重ねてなめらかにループ ===== */
const BGM_KEY="toto-bgm", BGM_XF=4;   // XF＝前の周回の終わりと次の周回の始まりを重ねる秒数
let BGM={on:true,vol:40}; try{ Object.assign(BGM,JSON.parse(localStorage.getItem(BGM_KEY)||"{}")); }catch(e){}
const BG={ctx:null,gain:null,buf:null,loading:null,next:0,timer:null,srcs:[],playing:false};
function bgmSave(){ try{ localStorage.setItem(BGM_KEY,JSON.stringify({on:BGM.on,vol:BGM.vol})); }catch(e){} }
function bgmLevel(){ const v=Math.max(0,Math.min(100,+BGM.vol||0))/100; return v*v*.9; }
function bgmCtx(){ if(!BG.ctx){ try{ BG.ctx=new (window.AudioContext||window.webkitAudioContext)(); BG.gain=BG.ctx.createGain(); BG.gain.gain.value=.0001; BG.gain.connect(BG.ctx.destination); }catch(e){ BG.ctx=null; return null; } } return BG.ctx; }
function bgmLoad(){ if(BG.buf) return Promise.resolve(BG.buf); if(BG.loading) return BG.loading;
  BG.loading=fetch("bgm.mp3").then(r=>{ if(!r.ok) throw new Error("bgm"); return r.arrayBuffer(); })
    .then(a=>new Promise((res,rej)=>{ const p=BG.ctx.decodeAudioData(a,res,rej); if(p&&p.then) p.then(res,rej); }))
    .then(b=>(BG.buf=b)).catch(e=>{ BG.loading=null; throw e; });
  return BG.loading; }
function bgmFade(v,d){ if(!BG.gain) return; const g=BG.gain.gain, t=BG.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(Math.max(g.value,.0001),t); g.exponentialRampToValueAtTime(Math.max(v,.0001),t+d); }
function bgmPlayAt(t){ const s=BG.ctx.createBufferSource(); s.buffer=BG.buf; s.connect(BG.gain); s.onended=()=>{ BG.srcs=BG.srcs.filter(x=>x!==s); }; s.start(t); BG.srcs.push(s); BG.next=t+BG.buf.duration-BGM_XF; }
function bgmPump(){ if(!BG.playing||!BG.buf) return; const c=BG.ctx; while(BG.next<c.currentTime+6) bgmPlayAt(Math.max(BG.next,c.currentTime+.05)); }
function bgmStart(){ if(!BGM.on) return; const c=bgmCtx(); if(!c) return; if(c.state!=="running") c.resume().catch(()=>{}); if(BG.playing) return;
  BG.playing=true;
  bgmLoad().then(()=>{ if(!BG.playing) return; BG.next=c.currentTime+.05; bgmPump(); clearInterval(BG.timer); BG.timer=setInterval(bgmPump,1000); bgmFade(bgmLevel(),2.5); })
    .catch(()=>{ BG.playing=false; }); }
function bgmStop(){ BG.playing=false; clearInterval(BG.timer); if(!BG.ctx) return; bgmFade(.0001,.6); const t=BG.ctx.currentTime+.7, ss=BG.srcs.splice(0); ss.forEach(s=>{ try{ s.stop(t); }catch(e){} }); }
function bgmSetVol(v){ BGM.vol=v; bgmSave(); if(BG.playing&&BG.gain){ const g=BG.gain.gain, t=BG.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(Math.max(g.value,.0001),t); g.linearRampToValueAtTime(Math.max(bgmLevel(),.0001),t+.08); } }
// ブラウザのきまりで、最初に画面を触ったときから鳴らす
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(BGM.on) bgmStart(); },true));
document.addEventListener("visibilitychange",()=>{ if(!BG.ctx) return; if(document.hidden) BG.ctx.suspend().catch(()=>{}); else if(BG.playing) BG.ctx.resume().catch(()=>{}); });
