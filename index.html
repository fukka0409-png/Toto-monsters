const UNIT_BIG_WARN = 800;
function bigUnitWarn(){ const n=S.units.length;
  if(n<UNIT_BIG_WARN-20){ S.ubw=0; return; }
  if(n<UNIT_BIG_WARN || document.querySelector(".ubw")) return;
  if(S.ubw && gnow()-S.ubw<24*HOUR_MS) return;
  if(document.querySelector("#title:not([hidden]),#adv,#dfo")) return;
  S.ubw=gnow(); save();
  const L=LANG==="en", el=document.createElement("div"); el.className="reveal ubw"; el.setAttribute("translate","no");
  el.innerHTML=`<div style="font-size:64px;line-height:1">⚠️</div><h3 style="color:#ffd75e">${L?`You have ${n.toLocaleString()} monsters!`:`魔物が${n.toLocaleString()}体になりました！`}</h3>
    <p class="note" style="text-align:center;max-width:330px;font-size:15px;line-height:1.7">${L?"If you go over <b>1,000 monsters</b>, the game will get heavy and may stop working.<br>Sell or fuse monsters to keep the number down.":"<b>1000体をこえると、ゲームが重くなって</b>動かなくなることがあります。<br>売却や合成で、数を減らしてね。"}</p>${byeSpellHtml(L)}

  el.querySelector("#ubwX").onclick=()=>el.remove();
  el.querySelector("#ubwBox").onclick=()=>{ el.remove(); tab="box"; boxMode="units"; render(); };
}

function updateUnitWarn(){
  try{ bigUnitWarn(); }catch(e){}
  const w=document.getElementById("unitWarn"); if(!w) return;
  if(S.units.length <= UNIT_WARN){ warnOpen=false; w.hidden=true; return; }
  if(!warnOpen){
    let last=0; try{ last=+localStorage.getItem(WARN_KEY)||0; }catch(e){}
    if(gnow()-last >= 24*60*60*1000){ warnOpen=true; try{ localStorage.setItem(WARN_KEY,String(gnow())); }catch(e){} }
  }
  w.hidden=!warnOpen;
}

function sortedUnits(){
  let u=[...S.units];
  if(boxFilter!=="all") u=u.filter(x=>mon(x.m).rank===boxFilter);
  const rk=x=>RANKS.indexOf(mon(x.m).rank);
  // 鍵付きは先頭（今までどおり）。鍵なしは ランクの高い順 → 同じ魔物どうしが隣り合うようにまとめる → 枠・Lvの高い順
  return u.sort((a,b)=> ((b.k?1:0)-(a.k?1:0)) || (a.k&&b.k ? ((b.s-a.s) || (rk(b)-rk(a)) || (b.l-a.l) || (a.u-b.u))
    : ((rk(b)-rk(a)) || (a.m-b.m) || (b.s-a.s) || (b.l-a.l) || (a.u-b.u))));
}

// 2026-10-29：ファイヤーボール・爆弾・コインマグネットは、それぞれ100個でガチャチケット1枚と交換できる
const TK_SWAP = 100, TK_SWAP_ITEMS = ["fire","bomb","magnet"];
function tkSwap(k){ if(!TK_SWAP_ITEMS.includes(k)) return; if(inv(k)<TK_SWAP) return toast(`${itemOf(k).name}が${TK_SWAP}個ありません`);
  addItem(k,-TK_SWAP); addItem("ticket",1); save(); try{ SFX.coin(); }catch(e){} toast(`${itemOf(k).name}${TK_SWAP}個をガチャチケット1枚と交換しました！`); render(); }
function pullItems(n, ticket){
  if(ticket){ if(!inv("ticket")) return toast("ガチャチケットがありません"); addItem("ticket",-1); n=TICKET_ITEMS; }
  else { if(S.coins < ITEM_COST*n) return toast("コインが足りません"); S.coins-=ITEM_COST*n; }
  S.stats.pulls+=n; gainPExp(PXP.pull*n);
  const got={};
  for(let i=0;i<n;i++){ let x=Math.random()*100, it=ITEMS[1]; for(const c of GACHA_ITEMS){ if((x-=c.rate)<0){ it=c; break; } } addItem(it.k,1); got[it.k]=(got[it.k]||0)+1; }
  save(); renderCoins();
  const el=document.createElement("div"); el.className="reveal"; el.setAttribute("role","dialog");
  el.innerHTML=`<h3>アイテムを手に入れた！</h3><div class="rv-grid ${n>1?"many":"one"}">${GACHA_ITEMS.filter(i=>got[i.k]).map((i,j)=>`<div class="rv r-B" style="animation-delay:${j*80}ms">
    <img src="${i.img}" alt="${i.name}">${got[i.k]>1?`<span class="cnt">×${got[i.k]}</span>`:""}<div class="nm">${i.name}</div></div>`).join("")}</div>
    <button class="btn" type="button">OK</button>`;
  el.querySelector(".btn").onclick=()=>{el.remove();render()};
  document.body.appendChild(el); el.querySelector(".btn").focus(); SFX.reveal("A");
}
// 覚醒の石：Lv100以上の魔物に使うと1個につき1レベル上がる
function openAwaken(uid, back){   // back：合成の画面から開いたときは、終わったら合成の画面にもどる
  const x=S.units.find(z=>z.u===uid); if(!x) return; const m=mon(x.m);
  const have=inv("stone"); let n=Math.min(1,have);
  const bg=document.createElement("div"); bg.className="sheet-bg center"; bg.style.zIndex=55;
  bg.innerHTML=`<div class="swear" role="dialog" aria-modal="true" aria-labelledby="awT"><img src="${itemOf("stone").img}" alt="" style="width:88px;height:88px;margin:0 auto;image-rendering:pixelated"><p id="awT">${esc(m.name)}に覚醒の石を合成</p>
    <div class="note" style="margin:0">持っている覚醒の石：${have.toLocaleString()}個</div>
    <div class="aw-row"><button class="chip" type="button" data-d="-10">−10</button><button class="chip" type="button" data-d="-1">−1</button><b id="awN"></b><button class="chip" type="button" data-d="1">+1</button><button class="chip" type="button" data-d="10">+10</button></div>
    <button class="chip" id="awAll" type="button">ぜんぶ使う</button>
    <div class="note" style="margin:0" id="awPrev"></div>
    <button class="btn gold" id="awGo" type="button">合成する</button><button class="btn ghost" id="awNo" type="button">やめる</button></div>`;
  document.body.appendChild(bg);
  const upd=()=>{ n=Math.max(have?1:0,Math.min(have,n)); bg.querySelector("#awN").textContent=n+"個"; bg.querySelector("#awPrev").innerHTML=`Lv${x.l} → <b>Lv${x.l+n}</b>`; bg.querySelector("#awGo").disabled=!n; };
  bg.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ n+=+b.dataset.d; upd(); });
  bg.querySelector("#awAll").onclick=()=>{ n=have; upd(); };
  bg.querySelector("#awNo").onclick=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector("#awGo").onclick=()=>{ if(!n||inv("stone")<n) return;
    addItem("stone",-n); x.l+=n; x.a=(x.a||0)+n; if(x.l>=MAX_LV) x.e=0; else x.e=Math.min(x.e,needFor(x)-1); save(); bg.remove(); SFX.level(); render(); back?back():openUnit(uid); queueProfile();
    toast(`覚醒！ ${m.name}が Lv${x.l} になった！`); };
  upd();
}

const evoPartners = x => S.units.filter(z=>z.u!==x.u && z.m===x.m && z.l>=capOf(z) && !z.k && z.u!==S.guard);

function openEvolve(uid){

  const m=mon(x.m), nx=mon(m.next), cap=capOf(x), L=evoPartners(x).sort((a,b)=>(a.g||0)-(b.g||0));
  let pick=L[0].u;
  const bg=document.createElement("div"); bg.className="sheet-bg center"; bg.style.zIndex=55;

// 支払いが終わったモコを受け取る：mokopay/{支払いID} に { uid, moko, claimed } がサーバーから届く
let mokoPayBusy=false;
async function checkMokoPay(){ if(!DB||!MYID||mokoPayBusy) return; mokoPayBusy=true;
  try{ const q=await withTO(DB.collection("mokopay").where("uid","==",MYID).get()); let got=0;
    for(const d of q.docs){ const v=d.data(); if(!v||v.claimed||!(v.moko>0)) continue;
      let ok=false; try{ await DB.runTransaction(async t=>{ const x=await t.get(d.ref); if(!x.exists||x.data().claimed) return; t.update(d.ref,{claimed:true,claimedAt:Date.now()}); ok=true; }); }catch(e){ ok=false; }
      if(ok) got+=v.moko; }
    if(got>0){ S.moko=(S.moko||0)+got; save(); try{ render(); }catch(e){}
      const bg=document.createElement("div"); bg.className="sheet-bg center"; bg.style.zIndex=75;
      bg.innerHTML=`<div class="swear" role="dialog" aria-modal="true"><div class="swear-face">🎉</div><p>お買い上げありがとうございます！</p>
        <div class="note" style="margin:0;font-size:16px"><img src="moko.png" alt="" style="width:28px;height:28px;vertical-align:-8px"> <b>${got.toLocaleString()}モコ</b> を受け取りました</div>
        <button class="btn gold" type="button">OK</button></div>`;
      document.body.appendChild(bg); try{ SFX.coin(); }catch(e){} bg.querySelector("button").onclick=()=>bg.remove(); }
  }catch(e){} mokoPayBusy=false; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkMokoPay(); });

const DM_MAX = 2;
const DMS = [
  { k:"c",   title:"Cランクモンスターをガチャで500体集める！", coins:5000 },
  { k:"nw",  title:"ガチャで新たな魔物と出会う！",             coins:1000 },

const DM_C_GOAL = 500;
// デイリーミッションは、ランク戦の切り替わり（毎日22:00）でリセット
function dmFix(){ S.dm=S.dm||{}; const k="ss"+seasonNow(); if(S.dm.day!==k){ S.dm.day=k; S.dm.done={}; } S.dm.done=S.dm.done||{}; }
const dmCount = m => { dmFix(); return S.dm.done[m.k]||0; };
function dmMet(m){ dmFix();
  if(m.k==="c") return (S.dm.c||0)>=DM_C_GOAL;
  if(m.k==="nw") return (S.dm.nw||0)>=1;
  if(m.k==="inv"){ const iv=activeInvs().slice(-1)[0]; return !!(iv && S.dm.invAt!==iv.at); }
  return false; }
const dmMax = m => m.max||DM_MAX;
const dmReady = m => dmCount(m)<dmMax(m) && dmMet(m);
function claimDM(k){ const m=DMS.find(x=>x.k===k); if(!m||!dmReady(m)) return;
  if(k==="c") S.dm.c=Math.max(0,(S.dm.c||0)-DM_C_GOAL);
  if(k==="nw") S.dm.nw=0;
  if(k==="inv") S.dm.invAt=activeInvs().slice(-1)[0].at;
  S.dm.done[k]=(S.dm.done[k]||0)+1; S.coins+=m.coins; save(); SFX.coin(); toast(`ミッションクリア！ +${m.coins.toLocaleString()}コイン`); render(); }

/* ---------- QRコードの読み取り（カメラ／保存した画像） ---------- */
let jsQRp=null;
function loadJsQR(){ if(window.jsQR) return Promise.resolve(window.jsQR); if(jsQRp) return jsQRp;
  jsQRp=new Promise((ok,ng)=>{ const sc=document.createElement("script"); sc.src="lib/jsQR.js"; sc.onload=()=>ok(window.jsQR); sc.onerror=()=>{ jsQRp=null; ng(new Error("load")); }; document.head.appendChild(sc); }); return jsQRp; }
function qrSay(t,ok){ const m=document.getElementById("qrMsg"); if(m){ m.textContent=t; m.className="code-msg "+(ok?"ok":"ng"); } if(!ok) try{ SFX.ng(); }catch(e){} }
function qrDecodeCanvas(cv){ const g=cv.getContext("2d",{willReadFrequently:true}), d=g.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(d.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"}); return r&&r.data||null; }
async function qrFromFile(f){
  try{ await loadJsQR(); }catch(e){ return qrSay("読み取りの準備ができませんでした。電波のよい所でもう一度ためしてください",false); }
  qrSay("読み取り中…",true);
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ URL.revokeObjectURL(url); let txt=null;
    for(const max of [1600,1000,700,2400]){ const k=Math.min(1,max/Math.max(im.width,im.height)), cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(im.width*k)); cv.height=Math.max(1,Math.round(im.height*k)); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); txt=qrDecodeCanvas(cv); if(txt) break; }
    if(!txt) return qrSay("QRコードが見つかりませんでした。QRコードが大きくはっきり写っている画像をえらんでください",false);
    qrRedeem(txt); };
  im.onerror=()=>{ URL.revokeObjectURL(url); qrSay("この画像は読み込めませんでした",false); };
  im.src=url;
}
async function qrCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return qrSay("この端末ではカメラが使えません。「保存した画像から読み取る」をためしてください",false);
  try{ await loadJsQR(); }catch(e){ return qrSay("読み取りの準備ができませんでした。電波のよい所でもう一度ためしてください",false); }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
  catch(e){ return qrSay("カメラを使えませんでした。カメラの使用を許可するか、「保存した画像から読み取る」をためしてください",false); }
  const el=document.createElement("div"); el.className="qr-cam"; el.innerHTML=`<video playsinline muted autoplay></video><div class="qr-frame"></div><p>QRコードを枠の中に写してください</p><button class="btn ghost" type="button">やめる</button>`;
  document.body.appendChild(el); const v=el.querySelector("video"); v.srcObject=stream; try{ await v.play(); }catch(e){}
  let done=false; const cv=document.createElement("canvas");
  const stop=()=>{ done=true; stream.getTracks().forEach(t=>t.stop()); el.remove(); };
  el.querySelector("button").onclick=stop;
  const tick=()=>{ if(done) return; if(v.videoWidth){ const k=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight)); cv.width=Math.round(v.videoWidth*k); cv.height=Math.round(v.videoHeight*k); cv.getContext("2d",{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);
      const txt=qrDecodeCanvas(cv); if(txt){ stop(); try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} qrRedeem(txt); return; } }
    setTimeout(tick,180); };
  tick();
}
async function qrRedeem(txt){
  const v=String(txt).trim(); let h; try{ h=await sha256(v); }catch(e){ return qrSay("この画面ではQRコードを確認できませんでした",false); }
  const c=QR_CODES.find(x=>x.h===h);
  if(!c) return qrSay("このQRコードは、トトと魔物たちの報酬のQRコードではありません",false);
  S.qrUsed=S.qrUsed||[];
  if(S.qrUsed.includes(h)) return qrSay(`このQRコード（${c.name||"QRコード"}）はもう使われています`,false);
  S.qrUsed.push(h); const got=[];
  if(c.coins){ S.coins+=c.coins; got.push(`${c.coins.toLocaleString()}コイン`); }
  if(c.ticket){ addItem("ticket",c.ticket); got.push(`ガチャチケット${c.ticket}枚`); }
  if(c.stone){ addItem("stone",c.stone); got.push(`覚醒の石${c.stone}個`); }

      scatter(30,(x,y,s)=>{ c.fillStyle="#8a7a66"; c.beginPath(); c.ellipse(x,y,6*s,3.5*s,0,0,7); c.fill(); }); haze("#9fc59a55"); break;

      scatter(50,(x,y,s)=>{ c.fillStyle="#ffffff"; c.beginPath(); c.arc(x,y,2.2*s,0,7); c.fill(); }); haze("#ffffff88"); break;
    case "meadow": base("#2c5a3a","#173524");

      scatter(60,(x,y,s)=>{ c.fillStyle="#d8f4ff"; c.beginPath(); c.arc(x,y,1.6*s,0,7); c.fill(); }); haze("#5a7fb055"); break;
    case "jungleg": base("#3f7a2a","#22501a");
      scatter(45,(x,y,s)=>{ c.save(); c.translate(x,y); c.rotate((R()-0.5)*1.2); c.fillStyle=["#2e6a22","#4f9a33","#1f4d17"][Math.floor(R()*3)]; c.beginPath(); c.ellipse(0,0,(30+R()*22)*s,(8+R()*5)*s,0,0,7); c.fill(); c.restore(); }); haze("#9fe0b066"); break;
    case "sand": base("#f0d79f","#d2b070");
      c.strokeStyle="#c9a361"; c.lineWidth=2; rowsY(16).forEach(y=>{ const s=sc(y); c.beginPath(); c.moveTo(0,y); for(let x=0;x<=W;x+=34*s+6) c.quadraticCurveTo(x+(17*s+3),y-5*s,x+34*s+6,y); c.stroke(); }); haze("#ffe6b088"); break;

// 装飾ガチャ：背景・床・装飾。持っているものが出たら 80%で10コイン、20%で覚醒の石1個に変わる
const DECO_DUP_COIN = 10, DECO_DUP_STONE = 0.2;
function pullDeco(n, ticket){
  if(ticket){ if(!inv("ticket")) return toast("ガチャチケットがありません"); addItem("ticket",-1); n=TICKET_PACKS; }
  else { if(S.coins < COST*n) return toast("コインが足りません"); S.coins-=COST*n; }
  S.stats.pulls+=n; gainPExp(PXP.pull*n);
  const own=homeOwn(), res=[]; let dup=0, dupSt=0;
  for(let i=0;i<n;i++){ const x=pickFrom(DECO_POOL,rollRank(FRAME_RATES)); if(!x) continue;
    const isNew=!own[x.type][x.k]; let tag="";
    if(isNew) own[x.type][x.k]=1;
    else { dup++; if(Math.random()<DECO_DUP_STONE){ dupSt++; tag=" →💎"; } else tag=" →🪙"; }
    res.push({img:decoThumb(x), name:DECO_TYPE[x.type]+tag, rank:x.rank, isNew}); }
  const dupC=(dup-dupSt)*DECO_DUP_COIN;
  if(dupSt) addItem("stone",dupSt); if(dupC) S.coins+=dupC;
  const note=!dup?"":dupSt&&dupC?`かぶり ${dup}個 → 🪙 +${dupC}コイン・💎 覚醒の石 +${dupSt}`:dupSt?`かぶり ${dup}個 → 💎 覚醒の石 +${dupSt}`:`かぶり ${dup}個 → 🪙 +${dupC}コイン`;
  save(); renderCoins(); openPack(res,"deco","装飾を手に入れた！",{newCoin:0, note});
}
/* ---------- 冒険者に投資する ----------
   1回のランク戦で2人まで（同じ人には1回）。金額は自由（持っているコインまで）。投資した時点でコインが減る。
   ランク戦終了時の投資先の順位で：1位 投資額の7倍もらえる／2位 5倍／3位 2倍／4位以下 投資額の10倍を失う（投資した分もふくめて合計。0コインまで）
   投資した自分が3位以内に入ったら、その時点で投資は無効（投資した分は戻らない）
   投資された人は、投資されたときにすぐ投資額の40%をもらえる（2026-10-20〜。checkInvestIncoming） */
const INV_MUL = {1:7, 2:5, 3:2}, INV_LOSE = 10, INV_GIVE40_SS = 5;
// 2026-10-21：ランク戦5から新しいルール。4位でも1.5倍（5位以下は損）。3位以内の冒険者も投資でき、投資先が4位以内なら順位に関係なく2倍
const INV_NEW_SS = 5, INV_MUL2 = {1:7, 2:5, 3:2, 4:1.5}, INV_TOP_MUL = 2;
const invNew = ss => (ss??seasonNow()) >= INV_NEW_SS;
const invMulOf = (tr, ss, meTop3) => !invNew(ss) ? (INV_MUL[tr]||0) : meTop3 ? (tr&&tr<=4?INV_TOP_MUL:0) : (INV_MUL2[tr]||0);   // 2026-10-21：次のランク戦（5）から10%→40%
const invGiveOf = ss => (ss??seasonNow())>=INV_GIVE40_SS ? 0.4 : 0.1, invPct = () => Math.round(invGiveOf()*100);
const INV_CLOSE_MS = 10*HOUR_MS;   // 投資できるのはランク戦終了の10時間前まで
const INV_RESET_AT = Date.parse("2026-10-17T19:45:00+09:00");   // これより前の投資はすべて解除（払ったコインは返す）
const invValid = x => x && !x.void && (x.at||0) >= INV_RESET_AT;
// 投資は1回のランク戦で2人まで（S.invs）。1人目のデータは invests/{uid}_{ss}、2人目は invests/{uid}_{ss}_2
const INV_MAX = 2;
function invFix(){ if(S.inv!==undefined){ if(S.inv) (S.invs=S.invs||[]).push(S.inv); delete S.inv; } S.invs=(S.invs||[]).filter(Boolean); S.invs.forEach(iv=>{ if(!iv.doc&&MYID) iv.doc=MYID+"_"+iv.ss; }); return S.invs; }
const invDocId = iv => iv.doc || (MYID+"_"+iv.ss);
function resetOldInvest(){
  invFix(); const old=S.invs.filter(iv=>(iv.at||0)<INV_RESET_AT); if(!old.length) return;
  old.forEach(iv=>{ if(iv.paid && !iv.void){ S.coins+=iv.amt; toast(`投資は解除されました（+${iv.amt.toLocaleString()}コイン返却）`); }
    try{ DB&&MYID&&DB.doc("invests/"+invDocId(iv)).update({void:true}).catch(()=>{}); }catch(e){} });
  S.invs=S.invs.filter(iv=>!old.includes(iv)); save(); renderCoins();
}
const invOpen = () => gnow() < seasonEnd(seasonNow()) - INV_CLOSE_MS;
let INV_LIST=null, INV_CNT={}, invQ="", invErr=false;
const myInvs=()=>invFix().filter(iv=>iv.ss===seasonNow());
const myInv=()=>{ const L=myInvs(); return L.length?L[L.length-1]:null; };   // いちばん新しい投資
const activeInvs=()=>myInvs().filter(iv=>!iv.void);
function seedShuffle(arr,seed){ let a=seed>>>0||1; const rnd=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const r=arr.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
async function loadInvestCounts(){

// そのランク戦に一度でも3位以内に入ったら、4位以下に落ちてもそのランク戦は投資できない
// 2026-10-19 の特別ルール（今回だけ・10/19 22:00に終わるランク戦）：この更新より前に3位以内に入って投資できなくなっていた人も、
// いま4位以下なら投資できる。更新のあとでまた3位以内に入ったら、いつも通りそのランク戦は投資できなくなる
const TOP3_AMNESTY_SS = 2;
function top3Amnesty(){ if(seasonNow()!==TOP3_AMNESTY_SS || S.top3amn) return; S.top3amn=1; if(S.top3ss===TOP3_AMNESTY_SS) S.top3ok=S.top3ss; save(); }
const top3Pardoned = () => { top3Amnesty(); return S.top3ok!=null && S.top3ok===S.top3ss; };
const top3Locked = () => !invNew() && ( (S.top3ss===seasonNow() && !top3Pardoned()) || (!!myRankSafe && myRankSafe<=3 && rankFresh() && !rankless()));   // 古い順位（前のランク戦）では判定しない
// 順位が「今のランク戦で順位がつきはじめたあと」に計算されたものか（アプリを開いたままランク戦をまたぐと、前の順位が残っていることがある）
const rankFresh = () => { try{ return myRankAt >= seasonEnd(seasonNow()-1) + RANKLESS_MS; }catch(e){ return false; } };
// 本当に3位以内か：「かたい順位」でも3位以内で、それが1分以上あけた2回の読み込みで続けて確認できたときだけ
function top3Sure(){ const now=gnow(); if(!myRankSafe || myRankSafe>3 || !rankFresh() || rankless()){ top3Seen=0; return false; }
  if(!top3Seen){ top3Seen=now; return false; } return now-top3Seen>=60000; }
function markTop3(){ if(invNew() || !top3Sure() || seasonBusy || (S.season??0)<seasonNow()) return;   // 精算前（前のランク戦の順位のまま）は数えない
  if(S.top3ss!==seasonNow() || top3Pardoned()){ S.top3ss=seasonNow(); S.top3ok=null; save(); if(tab==="home"&&homeMode==="invest") render(); } }
function checkInvestVoid(){
  markTop3(); if(invNew()) return;   // 新しいルール：3位以内でも投資は無効にならない
  const L=activeInvs(); if(!L.length||!(top3Seen&&gnow()-top3Seen>=60000)||!myRankSafe||myRankSafe>3||!rankFresh()||rankless()||seasonBusy||(S.season??0)<seasonNow()) return;
  let lose=0; L.forEach(iv=>{ const l=iv.paid?iv.amt:Math.min(iv.amt,S.coins); if(!iv.paid) S.coins-=l; iv.void=1; iv.lost=l; lose+=l;
    try{ DB&&DB.doc("invests/"+invDocId(iv)).update({void:true}).catch(()=>{}); }catch(e){} });

  el.innerHTML=`<h3>投資が無効になりました</h3><p class="note" style="text-align:center;max-width:320px">あなたがランキング${myRankSafe}位に入ったので、${L.map(iv=>`<span translate="no">${esc(iv.name||"")}</span>さん`).join("・")}への投資は無効になりました。<br><b style="color:#ff6a5a">−${lose.toLocaleString()}コイン</b>（投資額を没収）</p><button class="btn" type="button">OK</button>`;
  document.body.appendChild(el); el.querySelector(".btn").onclick=()=>{ el.remove(); render(); };
}
// 投資されたら、すぐに投資額の40%を受け取る（1つの投資につき1回だけ）
let invInBusy=false;
async function checkInvestIncoming(ss){
  if(invInBusy||!DB||!MYID) return; invInBusy=true;
  try{
    ss = ss ?? seasonNow();
    const r=await withTO(DB.collection("invests").where("def","==",MYID).where("ss","==",ss).get());
    S.invGot=S.invGot||{}; const got=S.invGot;
    const fresh=r.docs.filter(d=>{ const x=d.data(); return x && (x.at||0)>=INV_RESET_AT && !x.void && x.att!==MYID && !got[d.id]; });
    if(fresh.length){
      const items=fresh.map(d=>{ const x=d.data(), r0=invGiveOf(x.ss??ss), g=Math.floor((x.amt||0)*r0); got[d.id]=1; return {amt:x.amt||0, g, p:Math.round(r0*100)}; });
      const total=items.reduce((a,x)=>a+x.g,0);
      // 古いランク戦の受け取り記録は消す（データを軽く）
      Object.keys(got).forEach(k=>{ const m=k.match(/_(\d+)(?:_2)?$/); if(m && +m[1]<seasonNow()-2) delete got[k]; });
      S.coins+=total; save(); renderCoins(); try{ SFX.reveal("S"); SFX.coin(); }catch(e){}
      const show=()=>{ if(document.querySelector(".reveal")) return setTimeout(show,1500);
        const el=document.createElement("div"); el.className="reveal";
        el.innerHTML=`<div class="burst"></div><h3>💰 投資家から投資されました！</h3><p class="note" style="text-align:center;max-width:330px">あなたは今期待されています✨<br><br>
          ${items.map(x=>`${x.amt.toLocaleString()}コインの${x.p}%を受け取りました！！（+${x.g.toLocaleString()}コイン）`).join("<br>")}</p><button class="btn gold" type="button">OK</button>`;
        document.body.appendChild(el); el.querySelector(".btn").onclick=()=>{ el.remove(); render(); }; };
      show(); render();
    }
  }catch(e){}
  invInBusy=false;
}
/* ---------- 投資の素質：投資したランク戦のうち、投資の損益が黒字だったランク戦の割合（ランク戦ごとに記録） ----------
   だれに投資したか・だれから投資されたかは出さない。プロフィールには回数（ivn）と黒字の回数（ivw）だけを載せる */
function ivRecord(ss, black){ S.ivSeen=S.ivSeen||{}; if(S.ivSeen[ss]!=null) return; S.ivSeen[ss]=black?1:0; S.ivn=(S.ivn||0)+1; S.ivw=(S.ivw||0)+(black?1:0); save(); try{ queueProfile(true); }catch(e){} }
const ivPct = r => r && r.ivn>0 ? Math.round((r.ivw||0)/r.ivn*100) : null;
// これまでのランク戦の投資を、1回だけさかのぼって集計する（投資のデータと、各ランク戦の正式な順位から）
async function ivBackfill(){
  if(S.ivBF||!DB||!MYID) return;
  try{
    const r=await withTO(DB.collection("invests").where("att","==",MYID).get(),12000);
    const by={}; r.docs.forEach(d=>{ const x=d.data(); if(!x||(x.at||0)<INV_RESET_AT||x.ss==null||x.ss>=seasonNow()) return; (by[x.ss]=by[x.ss]||[]).push(x); });
    const sss=Object.keys(by).map(Number).filter(ss=>!(S.ivSeen&&S.ivSeen[ss]!=null));
    if(sss.length){ const q=await withTO(DB.collection("profiles").limit(3000).get({source:"server"}),15000);
      for(const ss of sss){ await loadSeasonEvents(ss); let net=0;
        const all=q.docs.map(x=>{ const isMe=x.id===MYID, v=x.data(); return {id:x.id, score:isMe&&S.sv&&S.sv[ss]!=null?S.sv[ss]:finalScore(x.id,v,ss), ok:true}; }).filter(o=>o.score!=null);
        for(const x of by[ss]){ if(x.void){ net-=x.amt||0; continue; }
          const t=all.find(o=>o.id===x.def); const tr=t?effRank(t.score,true,all.filter(o=>o!==t)):null, mul=INV_MUL[tr];   // さかのぼり集計は前のルールのランク戦だけ
          net += mul ? (x.amt||0)*(mul-1) : -(x.amt||0)*INV_LOSE; }
        ivRecord(ss, net>0); } }
    S.ivBF=1; save();
  }catch(e){}
}
async function settleInvest(old, rank, q, mine, coinsSoFar){
  const out={delta:0, lines:[]};
  resetOldInvest();
  let ivNet=null;   // 投資の素質：このランク戦の投資の損益（黒字か赤字か）
  for(const iv of invFix().filter(x=>x.ss===old)){ if(iv.void){ ivNet=(ivNet||0)-iv.amt; continue; }
    if(ivNet==null) ivNet=0;
    const nm=esc(iv.name||"相手");
    if(!invNew(old) && rank && rank<=3){ ivNet-=iv.amt; const lose=iv.paid?0:Math.min(iv.amt, S.coins+(S.bank||0)+coinsSoFar); out.delta-=lose; out.lines.push(`💸 あなたが${rank}位に入ったので、投資は無効（−${(iv.paid?iv.amt:lose).toLocaleString()}コイン没収）`); }
    else if(q){
      const d=q.docs.find(x=>x.id===iv.def), ts=d?finalScore(d.id,d.data(),old):null;
      let tr=null; if(ts!=null){
        const others=q.docs.filter(x=>x.id!==iv.def&&x.id!==MYID).map(x=>({score:finalScore(x.id,x.data(),old), ok:profOk(x.data(),old)})).filter(o=>o.score!=null);
        others.push({score:mine, ok:prizeOk(old)});
        tr=effRank(ts, profOk(d.data(),old), others); }
      const mul=invMulOf(tr, old, !!(rank&&rank<=3));
      if(mul){ ivNet+=iv.amt*(mul-1); out.delta+=Math.floor(iv.amt*mul); out.lines.push(`💰 投資先の${nm}さんが${tr}位！ ${invNew(old)&&rank&&rank<=3?`（あなたが${rank}位なので2倍）`:""}+${Math.floor(iv.amt*mul).toLocaleString()}コイン`); }
      else { ivNet-=iv.amt*INV_LOSE; const more=Math.min(iv.amt*(INV_LOSE-(iv.paid?1:0)), S.coins+(S.bank||0)+coinsSoFar+out.delta); out.delta-=more; out.lines.push(`💸 投資先の${nm}さんは${tr?tr+"位":"順位なし"}…（−${((iv.paid?iv.amt:0)+more).toLocaleString()}コイン）`); }
    }
  }
  if(ivNet!=null) ivRecord(old, ivNet>0);
  S.invs=invFix().filter(x=>x.ss>old);
  // 投資された分の40%は、投資されたときにすぐ受け取る（checkInvestIncoming）。精算では受け取らない
  try{ await checkInvestIncoming(old); }catch(e){}   // まだ受け取っていない前のランク戦の分だけ、ここで受け取る
  return out;
}

   1人につき1日1回まで、BOT_RATE の確率で行動。強さは自分のレベルに合わせて決まる */
const BOTS = [
  { p:0.6, m:0.55 },   // p: 冒険者レベルの倍率 / m: 魔物レベルの倍率（自分の配置魔物に対して）
  { p:0.8, m:0.75 },
  { p:1.0, m:0.9  },
  { p:1.2, m:1.0  },
  { p:1.5, m:1.15 },

const BOT_RATE = 0.25;
let botItemQueue = [];
function genBotEvents(){
  const out=[];
  if(!DB||!MYID||S.plv<SAFE_LV) return out;
  if(itemRest()||noAct()) return out;   // ランク戦が始まって1時間は、CPUもアイテム・攻撃をしない（その日の分は1時間たってから）
  const day=todayN(); S.botDay=S.botDay||{};
  BOTS.forEach((bt,i)=>{
    if(S.botDay[i]===day) return; S.botDay[i]=day;
    if(Math.random()>=BOT_RATE) return;
    const attP=Math.max(1,Math.round(S.plv*bt.p*(0.85+Math.random()*0.3)));
    const at=Math.max(gnow()-Math.floor(Math.random()*3*HOUR_MS), seasonEnd(seasonNow()-1)+HOUR_MS);   // 休み時間の中の時刻にはしない
    const g=guardUnit(), x=Math.random();
    if(g && x<0.6){
      // バトル：魔物レベル→ランク→図鑑No.で決着（ふつうのバトルと同じ）
      const lv=Math.max(1,Math.min(100,Math.round(g.l*bt.m*(0.85+Math.random()*0.3))));
      const ranks=bt.m<0.7?["C","B"]:bt.m<1?["B","A"]:["A","S"];
      const pool=NORMAL.filter(m=>ranks.includes(m.rank)); const bm=pool[Math.floor(Math.random()*pool.length)]||mon(START_MONSTER);
      const rI=m=>RANKS.indexOf(mon(m).rank);

      const msgs=[]; let lostLv=0, coinDiff=0; const downed=new Set();

async function checkFriends(){
  if(frBusy||!DB||!MYID) return; frBusy=true;
  try{
    wingFix(); await loadFriends();
    const lines=[];
    if(S.fOff && FR.reqIn.length){ for(const q of FR.reqIn){ try{ await DB.doc("friendReq/"+q.doc).update({st:"no"}); }catch(e){} } FR.reqIn=[]; }   // 機能オフ中に届いた申請は自動で却下
    let no=0;
    const mine=await withTO(DB.collection("friendReq").where("from","==",MYID).get());
    for(const d of mine.docs){ if(d.data().st==="no"){ no++; try{ await d.ref.delete(); }catch(e){} } }
    const due=(S.frNotes||[]).filter(t=>t<=gnow()); if(due.length){ no+=due.length; S.frNotes=S.frNotes.filter(t=>t>gnow()); }
    for(let i=0;i<no;i++) lines.push(FR_NO_MSG);
    const known=new Set(S.fKnown||[]), ids=FR.friends.map(x=>x.id);
    ids.filter(id=>!known.has(id)).forEach(id=>lines.push(`🤝 ${frName(id)}さんとフレンドになりました！`));
    S.fKnown=ids;
    // 羽根つきハート石 → ハート石として受け取る（同じ記録を2回数えないように、最近の分はIDでも確認）
    const h=await withTO(DB.collection("hearts").where("to","==",MYID).get());
    const win=15*60*1000, seen=S.hIds||{}, got={}; let tot=0, last=S.lastHeart||0;
    h.docs.forEach(d=>{ const x=d.data(); if(!x||!x.from||(x.at||0)<=(S.lastHeart||0)-win||seen[d.id]) return;
      const n=Math.max(1,Math.min(WING_MAX,Math.floor(x.n||1))); S.hr=S.hr||{}; S.hr[x.from]=(S.hr[x.from]||0)+n; got[x.from]=(got[x.from]||0)+n; tot+=n; seen[d.id]=x.at||0; (S.hLog=S.hLog||[]).push({f:x.from, n, at:x.at||gnow()}); last=Math.max(last,x.at||0);
      d.ref.delete().catch(()=>{}); });
    if(S.hLog) S.hLog=S.hLog.sort((a,b)=>b.at-a.at).slice(0,200);   // もらったハート石の記録（新しい200件）
    S.lastHeart=last; Object.keys(seen).forEach(k=>{ if(seen[k]<last-win) delete seen[k]; }); S.hIds=seen;
    if(tot){ S.heart=(S.heart||0)+tot; await Promise.all(Object.keys(got).map(frProfile));
      Object.entries(got).forEach(([id,n])=>lines.push(`💗 ${frName(id)}さんからハート石が${n}個届いた！（親密度 ${intimacy(id)}）`)); }
    FR.friends.filter(frUnread).forEach(f=>{ if(((S.fMsgSeen||{})[f.pair]||0)>=(f.lm.at||0)) return; lines.push(`💬 ${frName(f.id)}さんからメッセージが届いています！`); S.fMsgSeen=S.fMsgSeen||{}; S.fMsgSeen[f.pair]=f.lm.at||0; });
    const fresh=FR.reqIn.filter(q=>!(S.frSeen||[]).includes(q.doc));
    if(fresh.length) lines.unshift(`📨 フレンド申請が${fresh.length}件届いています`);
    S.frSeen=FR.reqIn.map(q=>q.doc);
    save();
    if(lines.length){ if(tot) SFX.sparkle(); frNotice(lines, fresh.length>0, tot?HEART_IMG:null); }
    if(tab==="home") render();
  }catch(e){}

}

async function sendFriendReq(r,msg){

  try{
    const [p,ex]=await withTO(Promise.all([DB.doc("profiles/"+r.id).get(), DB.doc("friendReq/"+id).get()]));

      S.frNotes=(S.frNotes||[]).concat(gnow()+Math.floor((60+Math.random()*180)*1000)); save(); toast("フレンド申請を送りました！"); return true; }
    if(ex.exists) await ex.ref.delete();
    await withTO(DB.doc("friendReq/"+id).set({from:MYID, to:r.id, fromName:myName().slice(0,12), msg, st:"p", at:gnow()}));
  }catch(e){ toast("申請を送れませんでした。少し時間をおいてためしてください"); return false; }

}

function openReport(r){ if(!DB||!MYID) return toast("ログインすると通報できます");
  S.rptAt=S.rptAt||{}; const last=S.rptAt[r.id]||0;
  if(gnow()-last<DAY_MS) return toast("この冒険者は、もう通報しています（同じ冒険者への通報は1日1回までです）");
  const bg=document.createElement("div"); bg.className="sheet-bg center"; bg.style.zIndex=70;
  bg.innerHTML=`<div class="swear" role="dialog" aria-modal="true"><div class="swear-face">🚨</div><p>${uname(r.name)}さんを通報する</p>
    <div class="note" style="margin:0">通報の理由を書いてください（${RPT_MIN}〜${RPT_MAX}文字）。<br><small>通報した内容は運営だけが確認します。相手やほかの冒険者には伝わりません。</small></div>
    <textarea id="rpT" class="fr-ta" maxlength="${RPT_MAX}" rows="4" style="width:100%;box-sizing:border-box" placeholder="例：同じ相手に何度もアイテムを使っている、ありえない数のコインを持っている など"></textarea>
    <button class="btn gold" type="button" id="rpGo" disabled>通報を送信</button><button class="btn ghost" type="button" id="rpNo">やめる</button></div>`;
  document.body.appendChild(bg);
  const ta=bg.querySelector("#rpT"), go=bg.querySelector("#rpGo");
  ta.oninput=()=>{ go.disabled=ta.value.trim().length<RPT_MIN; };
  bg.querySelector("#rpNo").onclick=()=>bg.remove();
  go.onclick=async e=>{ const t=ta.value.trim().slice(0,RPT_MAX); if(t.length<RPT_MIN) return toast(`理由を${RPT_MIN}文字以上書いてください`);
    const ok=await busyRun(e.currentTarget,"送信中…",async()=>{ try{
      await withTO(DB.collection("reports").add({from:MYID, fromNm:String(myName()).slice(0,24), to:r.id, toNm:String(r.name||"").slice(0,24), reason:t, at:gnow()})); return true; }
      catch(err){ toast("送信できませんでした"+(err&&err.code?`（${err.code}）`:"")); return false; } });
    if(ok){ S.rptAt[r.id]=gnow(); save(); bg.remove(); toast("通報を送信しました。ご協力ありがとうございます🙏"); } };
}
// 運営（ふっかー）用：タイトル画面の「通報箱」
async function openReportBox(){ if(!DB||!dexPeek()) return;
  const bg=document.createElement("div"); bg.className="sheet-bg chat-sheet"; bg.style.zIndex=235;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>🚨 通報箱</h3><button class="x" type="button" aria-label="閉じる">✕</button></div>
    <div class="note" style="margin:0 0 8px">運営（ふっかー）だけが見られます。新しい順。🆕は前に開いたあとに届いた通報です。 <button class="chip" type="button" id="rbR" style="margin-left:6px">🔄 更新</button></div>
    <div id="rbL"><div class="empty">読み込み中…</div></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove(); bg.querySelector(".x").onclick=close; bg.onclick=e=>{ if(e.target===bg) close(); };
  const el=bg.querySelector("#rbL"), seen=S.rpSeen||0;
  const load=async()=>{
    try{ const q=await withTO(DB.collection("reports").orderBy("at","desc").limit(100).get()); const L=q.docs.map(d=>d.data());
      const cnt={}; L.forEach(x=>{ cnt[x.to]=(cnt[x.to]||0)+1; });
      el.innerHTML=L.length?L.map(x=>`<div class="note" style="margin:0 0 8px;text-align:left">${(x.at||0)>seen?"🆕 ":""}<b translate="no">${esc(x.fromNm||"?")}</b> さん → <b translate="no" style="color:var(--berry)">${esc(x.toNm||"?")}</b> さん<small>（この人への通報 ${cnt[x.to]}件）</small><br>
        <span translate="no">${esc(x.reason||"").replace(/\n/g,"<br>")}</span><br><small>${new Date(x.at||0).toLocaleString("ja-JP")}</small></div>`).join("")
        :`<div class="empty">通報はまだありません</div>`;
      S.rpSeen=Math.max(S.rpSeen||0,...L.map(x=>x.at||0),0); save(); rptCount(); }
    catch(e){ el.innerHTML=`<div class="note" style="margin:0;text-align:left">読み込めませんでした${e&&e.code?`（${esc(e.code)}）`:""}。<br>Firestoreのルールが最新か確かめてください。</div>`; }
  };
  bg.querySelector("#rbR").onclick=load; load();
}
async function rptCount(){ const b=document.getElementById("ttlRpB"); if(!b||!DB||!dexPeek()) return;
  try{ const q=await withTO(DB.collection("reports").where("at",">",S.rpSeen||0).get()); const n=q.size; b.textContent=n>99?"99+":String(n); b.hidden=!n; }catch(e){} }
setInterval(()=>{ const b=document.getElementById("ttlRp"); if(!b) return; const on=!!(DB&&MYID)&&dexPeek(); if(b.hidden===on){ b.hidden=!on; if(on) rptCount(); } }, 1500);

// フレンドとだけ使える掲示板
async function openChat(id){
  const f=FR.friends.find(x=>x.id===id); if(!f) return toast("フレンドではありません");
  const p=FR.prof[id]||{};
  const bg=document.createElement("div"); bg.className="sheet-bg chat-sheet"; bg.style.zIndex=56;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>💬 ${uname(p.name)}さん</h3><button class="x" type="button" aria-label="閉じる">✕</button></div>
    <div class="note" style="margin:0 0 8px">2人だけの掲示板です。💞 親密度 <b translate="no">${intimacy(id).toLocaleString()}</b> <button class="chip" type="button" id="chR" style="margin-left:6px">🔄 更新</button></div>
    <div class="chat-log" id="chLog"><div class="empty">読み込み中…</div></div>
    <div class="chat-in"><textarea id="chT" class="fr-ta" maxlength="${FR_MSG_MAX}" rows="2" placeholder="${LANG==="en"?`Write a message (up to ${FR_MSG_MAX} characters)`:`メッセージを書く（${FR_MSG_MAX}文字まで）`}"></textarea><button class="btn gold" type="button" id="chGo">送信</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove(); bg.querySelector(".x").onclick=close; bg.onclick=e=>{ if(e.target===bg) close(); };
  const col=DB.collection("friends").doc(f.pair).collection("msgs"), log=bg.querySelector("#chLog");
  const load=async()=>{
    try{ const q=await withTO(col.orderBy("at","desc").limit(50).get()); const L=q.docs.map(d=>d.data()).reverse();
      log.innerHTML=L.length?L.map(m=>`<div class="chat-m ${m.from===MYID?"me":""}"><small>${m.from===MYID?"あなた":uname(p.name)} ・ <span translate="no">${new Date(m.at||0).toLocaleString(LANG==="en"?"en-US":"ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></small><div translate="no">${esc(m.text||"").replace(/\n/g,"<br>")}</div></div>`).join(""):`<div class="empty">まだメッセージはありません。最初のひとことを送ろう！</div>`;
      log.scrollTop=log.scrollHeight; S.fRead=S.fRead||{}; S.fRead[f.pair]=gnow(); save(); if(document.querySelector(".fr-sheet")) drawFriends(); }
    catch(e){ log.innerHTML=`<div class="empty">読み込めませんでした。フレンドが解除されたかもしれません</div>`; }
  };
  bg.querySelector("#chR").onclick=load;
  const ta=bg.querySelector("#chT");
  bg.querySelector("#chGo").onclick=async e=>{ const t=ta.value.trim().slice(0,FR_MSG_MAX); if(!t) return;
    const ok=await busyRun(e.currentTarget,"送信中…",async()=>{ try{ const at=gnow(); await withTO(col.add({from:MYID, text:t, at})); DB.doc("friends/"+f.pair).update({lm:{from:MYID, at}}).catch(()=>{}); return true; }catch(err){ toast("送信できませんでした"); return false; } });
    if(ok){ ta.value=""; load(); } };
  load();
}

function itemBox(r){
  if(!DB) return "";

  if(r.id===MYID) return inv("gift")?`<div class="item-box"><div class="pick-label" style="margin:0 0 6px">アイテムを使う</div><div class="item-use"><button type="button" class="iu gift" data-selfgift="1"><img src="${itemOf("gift").img}" alt=""><b>神からの贈り物を自分に使う</b><small>×${inv("gift")}</small></button></div></div>`:"";
  const safe=(r.lv||1)<SAFE_LV;
  const giftBtn=SENDABLE.filter(k=>inv(k)).map(k=>`<button type="button" class="iu gift" data-item="${k}" data-to="${esc(r.id)}"><img src="${itemOf(k).img}" alt=""><b>${itemOf(k).name}を贈る</b><small>×${inv(k).toLocaleString()}</small></button>`).join("")
    + ownArts().map(x=>`<button type="button" class="iu gift" data-artgift="${x.k}" data-to="${esc(r.id)}"><img src="${x.img}" alt=""><b>${esc(x.name)}を贈る</b><small>×${(S.arts[x.k]||0).toLocaleString()}</small></button>`).join("");
  return `<div class="item-box"><div class="pick-label" style="margin:0 0 6px">アイテムを使う</div>${giftBtn?`<div class="item-use" style="margin-bottom:6px">${giftBtn}</div>`:""}

    `<div class="item-use">${["magnet","fire","bomb",...(inv("shbomb")?["shbomb"]:[])].map(k=>{ const i=itemOf(k), cost=USE_COST[k]||0, no=!(k==="bomb"&&inv("bomb")>=SHBOMB_NEED)&&(!inv(k)||(k==="fire"&&!r.gm)||(k==="bomb"&&S.plv<BOMB_MIN_LV)||S.coins<cost||useLeft(k)<=0), lf=useLeft(k);
      return `<button type="button" class="iu" data-item="${k}" data-to="${esc(r.id)}" ${no?"disabled":""}><img src="${i.img}" alt=""><b>${i.name}</b><small>×${inv(k)}${cost?`・${cost.toLocaleString()}コイン`:""}${isFinite(lf)?`<br>今シーズンのこり${lf}回`:""}</small></button>`; }).join("")}</div>

    ${ITEMS.every(i=>i.k==="stone"||!inv(i.k))?`<div class="note" style="margin:4px 0 0">アイテムはガチャの「アイテムガチャ」で手に入ります</div>`:""}`}</div>`;
}

async function sendArt(r,x,n){
  if(!DB||!MYID||(S.arts[x.k]||0)<n) return false;
  try{ await withTO(DB.collection("items").add({att:MYID, def:r.id, attP:S.plv, defName:String(r.name||"").slice(0,12), item:"art:"+x.k, qty:n, coins:0, at:gnow()})); }
  catch(e){ toast("贈れませんでした。少し時間をおいてためしてください"); return false; }
  S.arts[x.k]-=n; save(); closeSheet(); render(); SFX.coin(); toast(`${r.name||"名無しの召喚士"}さんに「${x.name}」を${n}枚贈りました！`); return true;
}
// 爆弾とマグネットは1シーズン（ランク戦）に30回まで使える（ファイヤーボールは制限なし）
const SEASON_USE_MAX = { bomb:30, magnet:30 };
const useCnt = () => { const s=seasonNow(); if(!S.useCnt||S.useCnt.s!==s) S.useCnt={s}; return S.useCnt; };
const useLeft = k => SEASON_USE_MAX[k]==null ? Infinity : Math.max(0, SEASON_USE_MAX[k]-(useCnt()[k]||0));
const useLimitTxt = k => `${itemOf(k).name}は1シーズンに${SEASON_USE_MAX[k]}回まで使えます（今シーズンはもう使えません）`;
// 2026-10-27：運営がブロックした冒険者は、ほかの冒険者にアイテムを使えない（名前で指定。大文字・小文字は区別しない）
const ITEM_BLOCKED = [];
// 2026-10-27：同じ冒険者に1時間に10回以上攻撃アイテムを使うと、今のランク戦の残り＋次の2シーズンのあいだアイテムを使えない
const BAN_N = 10, BAN_SS = 2;
const itemBanned = () => S.itemBanSS!=null && seasonNow()<=S.itemBanSS;
const itemBlocked = () => { if(itemBanned()) return true; try{ const me=normName(myName()); return ITEM_BLOCKED.some(n=>normName(n)===me); }catch(e){ return false; } };
const ITEM_BLOCK_TXT0 = "⛔ 運営により、アイテムの使用が制限されています";
const itemBlockTxt = () => itemBanned() ? `⛔ 同じ冒険者に連続でアイテムを使いすぎたため、アイテムが使えません（あと${fmtDays(seasonEnd(S.itemBanSS)-gnow())}）` : ITEM_BLOCK_TXT0;
// 2026-10-27：マグネットは、同じ相手には1シーズンに10個まで
const MAGNET_PER_TARGET = 10;
const magLeft = id => { const u=useCnt(); return Math.max(0, MAGNET_PER_TARGET-((u.mt||{})[id]||0)); };
const magLimitTxt = () => `マグネットは同じ冒険者に1シーズン${MAGNET_PER_TARGET}個までしか使えません（今シーズン、この冒険者にはもう使えません）`;
function confirmItem(r,k,direct){
  if(itemBlocked()) return toast(itemBlockTxt());
  if(k==="bomb" && !direct) return bombChoice(r);
  if(noAct()) return toast(FREEZE_TXT);
  if(useLeft(k)<=0) return toast(useLimitTxt(k));
  if(k==="magnet" && magLeft(r.id)<=0) return toast(magLimitTxt());
  if(itemRest()) return toast(ITEM_REST_TXT);
  const i=itemOf(k), who=esc(r.name||"名無しの召喚士");
  if(SENDABLE.includes(k)) return qtyDialog({img:i.img, title:`${who}さんに${i.name}を贈る`, max:inv(k), ok:"贈る！",
    desc:n=>(k==="gift"?`${who}さんに <b>${(GIFT_COIN*n).toLocaleString()}コイン</b> がプレゼントされます。`:`${who}さんに <b>ガチャチケット${n}枚</b> が届きます。`)+"<br>相手には次にアプリを開いたときに届きます。"}, n=>useItem(r,k,n));
  const what=k==="shbomb"?`${who}さんの盾を${SHBOMB_BREAK}つこわします。（使うのに${USE_COST.shbomb}コイン）`:k==="gift"?`${who}さんに${GIFT_COIN.toLocaleString()}コインをプレゼントします。`:k==="magnet"?`${who}さんの所持コインの1%をうばいます。<br><small>この冒険者には、今シーズンあと${magLeft(r.id)}個使えます</small>`:k==="fire"?`${who}さんの配置魔物（${esc(mon(r.gm)?.name||"魔物")}）のレベルを${FIRE_LV}下げます。（使うのに${USE_COST.fire}コイン）`:`${who}さんの冒険者レベルを${BOMB_LV}下げます。（使うのに${USE_COST.bomb.toLocaleString()}コイン）`;
  const bg=document.createElement("div"); bg.className="sheet-bg center"; bg.style.zIndex=55;
  bg.innerHTML=`<div class="swear" role="dialog" aria-modal="true" aria-labelledby="iuT"><img src="${i.img}" alt="" style="width:96px;height:96px;margin:0 auto;image-rendering:pixelated"><p id="iuT">${i.name}を使いますか？</p>
    <div class="note" style="margin:0">${what}<br>相手には、次にアプリを開いたときに反映されます。${ATK_ITEMS.includes(k)&&atkRecent(r.id)+1>=BAN_N?`<b style="color:var(--berry)">⛔ 今回使うと、同じ冒険者に連続${BAN_N}回になるため、このランク戦の残りと次の${BAN_SS}シーズンのあいだ<u>アイテムが使えなくなります</u></b><br>`:""}${ATK_ITEMS.includes(k)&&atkRecent(r.id)+1>=CONSEC_N?`<b style="color:var(--berry)">⚠️ 同じ冒険者に連続で使っているので、今回は<u>あなたの名前が相手に伝わります</u></b>`:`あなたの名前は出ず「中級冒険者」のように、レベル帯だけが伝わります。<br><small>※同じ冒険者に1時間に${CONSEC_N}回以上使うと、名前が伝わります</small>`}（残り ${inv(k)}個）</div>
    <button class="btn gold" id="iuGo" type="button">使う！</button><button class="btn ghost" id="iuNo" type="button">やめる</button></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#iuNo").onclick=()=>bg.remove();
  bg.querySelector("#iuGo").onclick=async e=>{ if(await busyRun(e.currentTarget,"使っています…",()=>useItem(r,k))) bg.remove(); };
}
async function useItem(r,k,qty=1){
  if(!DB||!MYID||inv(k)<qty) return false;
  if(itemBlocked()){ toast(itemBlockTxt()); return false; }
  if(noAct()){ toast(FREEZE_TXT); return false; }
  if(itemRest()){ toast(ITEM_REST_TXT); return false; }
  // 相手の最新プロフィールを読む。読めなかったときも、贈り物（神からの贈り物・チケット）は相手の情報がいらないので、手元のランキングの情報で贈れるようにする
  let d, ferr=null; try{ const snap=await withTO(DB.doc("profiles/"+r.id).get(),8000); d=snap.exists?snap.data():null; }catch(e){ ferr=e; }
  if(ferr){ if(SENDABLE.includes(k) && r && r.id) d={...r}; else { toast("通信できませんでした。電波のよい所でもう一度ためしてください"+(ferr.code?`（${ferr.code}）`:"")); return false; } }
  else { if(!d) { toast("相手が見つかりませんでした"); return false; } d=effProfile(r.id,d); }
  if(!SENDABLE.includes(k) && (d.lv||1)<SAFE_LV) { toast(`相手はLv${SAFE_LV}未満なので、まだアイテムを使えません`); return false; }
  if(k==="fire"&&(!d.gm||!mon(d.gm))) { toast("相手は魔物を配置していません"); return false; }
  if(k==="bomb"&&S.plv<BOMB_MIN_LV) { toast(`爆弾は冒険者Lv${BOMB_MIN_LV}から使えます`); return false; }
  const cost=USE_COST[k]||0; if(S.coins<cost) { toast(`使うのに${cost.toLocaleString()}コイン必要です`); return false; }
  if(useLeft(k)<=0) { toast(useLimitTxt(k)); return false; }
  if(k==="magnet" && magLeft(r.id)<qty) { toast(magLimitTxt()); return false; }
  const coins = k==="magnet" ? Math.floor(Math.max(0,d.cn||0)*MAGNET) : 0;
  let banHit=false; const atk=ATK_ITEMS.includes(k), reveal=atk && atkRecent(r.id)+1>=CONSEC_N;   // 連続で使うと名前が相手に伝わる
  try{
    await withTO(DB.collection("items").add({att:MYID, def:r.id, attP:S.plv, defName:String(d.name||"").slice(0,12),
      item:k, qty, coins, defM:d.gm||0, defU:d.gu||0, at:gnow(), ...(reveal?{an:String(myName()).slice(0,24)}:{})}));
    if(atk){ S.atkLog[r.id]=(S.atkLog[r.id]||[]).concat(gnow()); if(S.atkLog[r.id].length>=BAN_N){ S.itemBanSS=seasonNow()+BAN_SS; S.atkLog={}; banHit=true; } }
  }catch(e){ { toast("アイテムを使えませんでした。少し時間をおいてためしてください"); return false; } }

// レーダーチャート：ガチャ回数・合成回数・魔物コンプ率・手持ちの魔物を、ランキングの平均と重ねて表示
// 回数は人によって差が大きいので、ランキング内の最大値を外側として平方根でならす（コンプ率は0〜100%そのまま）
function radarHtml(r){
  const pool=[...(RANK||[])]; if(!pool.some(x=>x.id===r.id)) pool.push(r);
  const AX=[{k:"pulls",l:"ガチャ回数",ic:"🎰"},{k:"fuses",l:"合成回数",ic:"🔨"},{k:"comp",l:"魔物コンプ率",ic:"📖",pct:1},{k:"units",l:"手持ちの魔物",ic:"👾"}];
  const val=(x,a)=>Math.max(0,Number(x[a.k])||0);
  AX.forEach(a=>{ const vs=pool.map(x=>val(x,a)); a.avg=vs.reduce((s,v)=>s+v,0)/vs.length; a.max=a.pct?200:Math.max(1,...vs); a.v=val(r,a); });
  const f=(v,a)=>a.pct?Math.min(1,v/200):Math.sqrt(Math.min(1,v/a.max));
  const C=150, R=92, ang=i=>-Math.PI/2+i*Math.PI/2, pt=(i,t)=>[C+Math.cos(ang(i))*R*t, C+Math.sin(ang(i))*R*t];
  const poly=g=>AX.map((a,i)=>pt(i,Math.max(.03,g(a))).map(v=>v.toFixed(1)).join(",")).join(" ");
  const fmt=(v,a)=>a.pct?(Math.round(v*10)/10)+"%":Math.round(v).toLocaleString();
  const lab=AX.map((a,i)=>{ const [x,y]=pt(i,1.18), anc=i===1?"start":i===3?"end":"middle", dy=i===0?-18:i===2?14:-6;
    return `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anc}" class="rd-l">${a.ic} ${a.l}</text><text x="${x.toFixed(1)}" y="${(y+dy+17).toFixed(1)}" text-anchor="${anc}" class="rd-v">${fmt(a.v,a)}</text>`; }).join("");
  const rings=[.25,.5,.75,1].map(t=>`<polygon points="${AX.map((a,i)=>pt(i,t).join(",")).join(" ")}" class="rd-ring"/>`).join("");
  const axes=AX.map((a,i)=>`<line x1="${C}" y1="${C}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" class="rd-ring"/>`).join("");
  const dots=AX.map((a,i)=>{ const [x,y]=pt(i,Math.max(.03,f(a.v,a))); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" class="rd-dot"/>`; }).join("");
  return `<div class="radar"><svg viewBox="-40 0 380 300" role="img" aria-label="${AX.map(a=>T(a.l+" "+fmt(a.v,a)+"（平均 "+fmt(a.avg,a)+"）")).join(T("、"))}">
    ${rings}${axes}<polygon points="${poly(a=>f(a.avg,a))}" class="rd-avg"/><polygon points="${poly(a=>f(a.v,a))}" class="rd-me"/>${dots}${lab}</svg>
    <div class="rd-leg"><span><i class="me"></i>${uname(r.name)}</span><span><i class="avg"></i>平均（ランキング${pool.length}人）</span></div>
    <div class="rd-avgs">${AX.map(a=>`<span>${a.ic} 平均 ${fmt(a.avg,a)}</span>`).join("")}</div></div>`;
}

function composeIcon(size){
  const cv=document.createElement("canvas"); cv.width=cv.height=size; const c=cv.getContext("2d"); const d=S.dress;
  c.fillStyle=BGS[d.bg]; c.fillRect(0,0,size,size);

const DEF = {
  DUR: 24*60*60*1000,                 // 制限時間 24時間
  GACHA: 10000, DUP: 100,             // ガチャ1回1万コイン／持っているものが出たら100コイン
  PROVOKE: 10, TEMPT: 10,             // 挑発・誘惑（値段は変わらない）
  ITEMS: { wall:1000, speed:100, fan:5000, sorry:200 },
  WALL_MS: 60*60*1000, SPEED_MS: 30*1000, FAN_MS: 60*1000,
  // 世界の大きさ（横7マス）
  W: 7, SPAWN_X: 7.15, SP0: 1.25, SP1: 1.0, PCOIN: 0.3,
  CH: {
    toto:    { kind:"main", name:"トト",       img:"def/toto.png",    atk:3, int:2.0, tip:[0.88,0.47], w:1.5, bolt:"#ff7ad9" },
    slime_b: { kind:"sub",  name:"スライム",   img:"def/slime_b.png", atk:1, int:1.6, tip:[0.93,0.12], w:1.2, bolt:"#ffb347" },
    slime_g: { kind:"sub",  name:"緑スライム", img:"def/slime_g.png", atk:2, int:2.0, tip:[0.93,0.14], w:1.2, bolt:"#ffb347" },
  },
  BASES: { base_m: { name:"にこにこ岩の土台", img:"def/base_m.png", hp:40 } },
  SUB_BASE: { img:"def/base_s.png", hp:15 },
  // 敵（スライム）
  EN: { hp0:6, hp1:9, atk:1, aint:1.6, spd:0.26, coin:1 },
};
// レベルアップ：Lv L → L+1 に必要なコイン（Lv1は1コイン、少しずつ増える）
const defCost = L => Math.max(1, Math.ceil(0.55*L*L - 0.3*L));
const defAtk  = (c,L) => DEF.CH[c].atk*(1+0.3*(L-1));
const defInt  = (c,L) => DEF.CH[c].int/(1+0.06*(L-1));
// 挑発：敵の攻撃力・体力・移動速度が約2倍ずつ（そのかわり、たおしたときのコインも2倍ずつ）／謝罪：少しずつ弱く・出現もゆっくり
const defMul  = R => Math.pow(1.9,R.prov)*Math.pow(0.9,R.sorry);
const defWaveN = R => 1+5*R.tempt;
const defDelay = R => 1.0*Math.pow(1.12,R.sorry);
// 建物の並び（x：左はし・幅・高さ）
function defLayout(sel){
  const L=[{k:"main", x:0.1, w:1.05, h:1.35}];
  if(sel.sub[0]) L.push({k:"sub0", x:1.25, w:0.95, h:0.8});
  if(sel.sub[1]) L.push({k:"sub1", x:L[L.length-1].x+L[L.length-1].w+0.12, w:0.95, h:0.8});
  return L;
}
function defNewRun(sel,now){
  const lay=defLayout(sel), hp=DEF.BASES[sel.base].hp + DEF.SUB_BASE.hp*(lay.length-1);
  return { start:now, end:now+DEF.DUR, last:now, t:0, hp, hpMax:hp, coins:0, earned:0, spent:0, kills:0,
    sel:{main:sel.main, sub:[sel.sub[0]||null, sel.sub[1]||null], base:sel.base},
    lv:[1,1,1], cd:[1.2,1.6,2.0], prov:0, tempt:0, sorry:0,
    en:[], bolts:[], left:0, spawnCd:0, nextWave:2, wall:null, fanT:0, spdT:0, over:false, won:false, eid:1, supers:0 };
}
const defShooters = R => [R.sel.main, R.sel.sub[0], R.sel.sub[1]];
const defFront = R => { const l=defLayout(R.sel), b=l[l.length-1]; return b.x+b.w; };
const defWallX = R => defFront(R)+0.3;
// 1ステップ進める（dt秒）。rnd は 0〜1 の乱数
function defStep(R,dt,rnd=Math.random,fx=null){
  if(R.over) return;
  R.t+=dt;
  if(R.wall && (R.wall.hp<=0 || R.t>=R.wall.until)) { R.wall=null; fx&&fx("wallDown"); }
  if(R.fanT>0) R.fanT-=dt; if(R.spdT>0) R.spdT-=dt;
  // 敵の出現：画面の敵がいなくなったら、少しして次の群れ（誘惑すると1回の数が増える）
  const alive=R.en.filter(e=>e.hp>0);
  // 誘惑した瞬間：残っている敵がいてもかまわず、増えた分がどんどん出てくる
  const spawn1=()=>{ const m=defMul(R);
      const hp=Math.round((DEF.EN.hp0+rnd()*(DEF.EN.hp1-DEF.EN.hp0+1-1e-9)|0)*m*10)/10;
      R.en.push({id:R.eid++, x:DEF.SPAWN_X+rnd()*0.4, hp, max:hp, atk:DEF.EN.atk*Math.pow(1.9,R.prov)*Math.pow(0.9,R.sorry),
        spd:DEF.EN.spd*Math.min(8,m)*(0.9+rnd()*0.2), cd:DEF.EN.aint*rnd(), coin:DEF.EN.coin*(1+DEF.PCOIN*R.prov), ph:rnd()*6, hit:0, at:0, dead:0}); };
  if(R.burst>0){ R.burstCd=(R.burstCd||0)-dt; if(R.burstCd<=0){ R.burst--; R.burstCd=0.25+rnd()*0.35; spawn1(); } }
  if(R.left>0){ R.spawnCd-=dt; if(R.spawnCd<=0){ R.left--; R.spawnCd=DEF.SP0+rnd()*DEF.SP1; spawn1(); } }
  else if(!alive.length && !(R.burst>0)){ R.nextWave-=dt; if(R.nextWave<=0){ R.left=defWaveN(R); R.spawnCd=0; R.nextWave=defDelay(R)*(0.85+rnd()*0.3); } }
  // 敵の移動・攻撃
  const stopX = R.wall ? defWallX(R)+0.28 : defFront(R)+0.05;
  for(const e of R.en){
    if(e.hp<=0){ e.dead+=dt; continue; }
    if(e.hit>0) e.hit-=dt; if(e.at>0) e.at-=dt;
    const v=e.spd*(R.fanT>0?0.1:1);
    if(e.x>stopX){ e.x=Math.max(stopX,e.x-v*dt); e.ph+=dt*(R.fanT>0?1.5:6); }
    else { e.cd-=dt; if(e.cd<=0){ e.cd=DEF.EN.aint; e.at=0.3;
        if(R.wall){ R.wall.hp-=e.atk; } else { R.hp-=e.atk; fx&&fx("hurt"); }
        if(R.hp<=0){ R.hp=0; R.over=true; R.won=false; fx&&fx("lose"); return; } } }
  }
  R.en=R.en.filter(e=>e.hp>0||e.dead<0.6);
  // 味方の攻撃：いちばん近い敵（土台にいちばん近い＝いちばん左）をねらう
  const tgt = () => { let b=null; for(const e of R.en) if(e.hp>0 && e.x<DEF.W+0.2 && (!b||e.x<b.x)) b=e; return b; };
  const sp=defShooters(R), spdMul=R.spdT>0?2:1, lay=defLayout(R.sel);
  for(let i=0;i<3;i++){ const c=sp[i]; if(!c) continue; R.cd[i]-=dt*spdMul;
    if(R.cd[i]<=0){ const e=tgt(); if(!e){ R.cd[i]=0; continue; }
      R.cd[i]=defInt(c,R.lv[i]); const sup = i===0 && rnd()<0.03; if(sup) R.supers++;
      const b=lay[i]||lay[0], ch=DEF.CH[c];
      R.bolts.push({x:b.x+b.w*0.5+ch.w*(ch.tip[0]-0.5), y:b.h+0.55, tg:e.id, dmg:defAtk(c,R.lv[i])*(sup?20:1), sup, c, life:3});
      fx&&fx("shoot",i,sup); } }
  // 弾：ねらった敵に向かって飛ぶ（敵がいなくなったら、ほかのいちばん近い敵へ）
  for(const b of R.bolts){ b.life-=dt; let e=R.en.find(z=>z.id===b.tg&&z.hp>0); if(!e){ e=tgt(); if(e) b.tg=e.id; else { b.life=0; continue; } }
    const tx=e.x+0.3, ty=0.3, dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy), st=(b.sup?7:9)*dt;
    if(d<=st+0.05){ b.life=0; e.hp-=b.dmg; e.hit=0.15; fx&&fx("hit",e,b);
      if(e.hp<=0){ e.hp=0; R.coins+=e.coin; R.earned+=e.coin; R.kills++; fx&&fx("kill",e); } }
    else { b.x+=dx/d*st; b.y+=dy/d*st; } }
  R.bolts=R.bolts.filter(b=>b.life>0);
}
// 何もしていない間（画面を閉じていた間も）をまとめて進める
function defCatchUp(R,now,fx){
  const until=Math.min(now,R.end); let left=(until-R.last)/1000; if(left<=0) return;
  const big=left>5; while(left>1e-6 && !R.over){ const dt=Math.min(left, big?0.25:0.05); defStep(R,dt,Math.random,big?null:fx); left-=dt; }
  R.last=until;
  if(!R.over && now>=R.end){ R.over=true; R.won=true; }
}
// 強化・挑発・誘惑・アイテム
function defUpgrade(R,i){ const c=defShooters(R)[i]; if(!c||R.over) return false; const cost=defCost(R.lv[i]); if(R.coins<cost) return false;
  R.coins-=cost; R.spent+=cost; R.lv[i]++; R.hpMax+=1; R.hp+=1; return true; }
function defBuy(R,k){ if(R.over) return false; const cost=k==="provoke"?DEF.PROVOKE:k==="tempt"?DEF.TEMPT:DEF.ITEMS[k]; if(R.coins<cost) return false;
  if(k==="wall" && R.wall) return false;
  R.coins-=cost; R.spent+=cost;
  if(k==="provoke") R.prov++; else if(k==="tempt"){ R.tempt++; R.burst=(R.burst||0)+5; R.burstCd=0; }
  else if(k==="wall") R.wall={hp:Math.round(R.hpMax/2), max:Math.round(R.hpMax/2), until:R.t+DEF.WALL_MS/1000};
  else if(k==="speed") R.spdT=DEF.SPEED_MS/1000; else if(k==="fan") R.fanT=DEF.FAN_MS/1000;
  else if(k==="sorry"){ R.sorry++; }
  return true; }

  for(const [k,c] of Object.entries(d.c)){ if(!c.mon||!c.lv) continue; if(c.as==null){ c.as=sl; ch=true; continue; }

      knMonHit(d,+tg[Math.floor(Math.random()*tg.length)][0],KN.GUN[c.g&&c.g[0]?c.g[0].lv:1]*(0.9+Math.random()*0.2),now); } }

  <p>🏰 <b>国の強化</b>（王だけ）：国の資金で、お城ごとに「お城・大砲・国民の装備（武器）」をそれぞれ6段階までレベルアップ。見た目もどんどん進化する。レベルが上がるほど必要な資金は大きく増えるので、360時間かけてじっくり育てよう。</p>
  <p>⚔️ <b>攻撃</b>：国民（王も）は15分ごとに3回、武器で敵のお城を攻撃できる（同じお城に3回でもOK）。💣 大砲は王が国の資金50万コインで購入（お城ひとつに2つまで）。大砲1つにつき15分に2回撃てて、Lv1の大砲はLv1の武器の10倍の威力。使える武器は自分がいるお城のもの。大砲は、国のお城についているものをぜんぶ撃てる（大砲のあるお城の数だけ攻撃できる）。攻撃すると貢献度が上がる。お城の耐久力は1時間に3%ずつ回復する。王は国の資金で、お城をすぐに修復することもできる（耐久力1につき資金10から。同じお城を修復するたびに1.5倍ずつ高くなる）。</p>
  <p>💥 お城をこわすと、その国の資金を奪い、跡地は自分の国の領土になる（王が国の資金10万コインでお城を建てられる。1時間お城を建てないと空き地にもどる）。中にいた国民は倒れてしまう。<b>王がいたお城がこわれると、その国は敗北</b>（王がどのお城にいるかは、ほかの国からは見えない）（すべてのお城がこわれ、資金はすべて奪われる）。</p>
  <p>👹 <b>魔物の城</b>：シーズン中、島の空いている場所によく魔物の城があらわれる（1島に2つまで・冒険者が少ない島ほど出やすい）。島の国のお城の平均レベルの半分くらいのペースで強くなり、15分ごとに大砲で、まわりの国のお城を攻撃してくる！ 耐久力は低めで、国民が武器で5回くらい攻撃すればこわせる。こわすと国の資金に10万コイン入り、跡地が自分の国の領土になる。</p>
  <p>🗺 はじめは草原の島だけ。シーズン中に島のマスが国（お城と領土）で<b>一度でも全部うまる</b>と、次の島（砂漠 → 雪原（氷の島） → 火山）が解放される。</p>
  <p>📋 国の詳細の<b>「国の掲示板」</b>で、王と国民どうしでメッセージを送り合える（匿名・その国の人だけが見られる）。</p>
  <p>🎭 王と国民はみんな<b>匿名</b>。ほかの国からも、同じ国の中でも、名前は出ない（「王」「国民1」…と表示）。</p>
  <p>🔰 シーズンが始まってから国を作ると、作った直後の1時間は🔰マークがついて、ほかの国から攻撃されない。</p>
  <p>💀 倒れると所持コインから5万コイン没収。待ち時間はなく、すぐにまた国を作ったり、お城に空きのある国に参加したりできる。</p>
  <p>🏰 1つのお城に入れるのは、王を含めて10人まで。お城に空きがあれば、どの国にも参加できる。</p>
  <p>🏆 島の中では<b>国の資金が多い順</b>。180時間をすぎると、島のイラストに「四天王候補（上位4か国）」が出る。シーズンが終わると、資金の多い上位4か国が四天王になり、1〜4位がつく。</p>
  <p>👑 <b>最高順位ボーナス</b>：王がもらう報酬（作ったときのプレゼント・お城の収入・シーズンの報酬）は、プロフィールの最高順位で増える。1位×3・2〜3位×2.5・4〜10位×2・11〜30位×1.5・31〜100位×1.2。</p>
  <p>💰 <b>報酬</b>：四天王の国の資金（振り分けられるのは最大1000万コインまで。こえた分は消える）を、王が70%、国民が残りを貢献度に応じて分ける（国民がいない国は王が100%）（貢献度がとても低い国民は−1000コイン）。1位は全額、2位は80%、3位は50%、4位は20%。さらに<b>島の1〜3位の国</b>には、王を含む全員で山分けする賞金（1位100万・2位50万・3位30万コイン）も出る。四天王の王と国民にはプロフィールに称号がつく。四天王1位の国は、王が決めた広告が次のシーズンのあいだ島えらびの画面に載る。</p>`,`
  <p><b>A season lasts 360 hours</b> (in-game timer). Pick an island, then found a nation or join one! During the prep time before a season starts, you can do everything except attack.</p>
  <p>👑 <b>Found a nation (free · the King gets 50,000 coins)</b>: anyone can found one (the better your best ranked placement, the bigger the King's rewards). While the nation stands, the King gains Adventurer Level +${KN.LV_KING} every hour. First come, first served — build one castle on any free spot. Choose a name, an emblem and the ad image shown if you become the #1 Heavenly King.</p>
  <p>🏰 <b>Castle income</b>: every hour you get coins for each of your nation's castles (depends on castle Lv). Destroy enemy castles to gain more castles and more income!<br>King: Lv1: 200, Lv2: 400, Lv3: 1,000, Lv4: 2,000, Lv5: 3,000, Lv6: 5,000 coins<br>Citizens: Lv1: 100, Lv2: 200, Lv3: 500, Lv4: 1,000, Lv5: 1,500, Lv6: 3,000 coins</p>
  <p>🙋 <b>Join a nation (free · get 20,000 coins)</b>: become a citizen. While in the nation, gain Adventurer Level +${KN.LV_CIT} every hour. Put your coins into the national funds to raise your contribution.</p>
  <p>🏰 <b>Strengthen</b> (King only): use national funds to level up each castle's Castle, Cannon and Citizen Weapons, up to 6 stages each. Their look evolves too. Each level costs far more than the last, so grow your nation over the 360 hours.</p>
  <p>⚔️ <b>Attack</b>: every citizen (the King too) can hit enemy castles 3 times every 15 minutes with their weapon (all 3 on the same castle is fine). 💣 The King buys cannons with national funds (500,000 each, up to 2 per castle). Each cannon fires 2 shots every 15 minutes, and a Lv1 cannon hits 10× harder than a Lv1 weapon. You use the weapon of the castle you're in, and you can fire every cannon on your nation's castles. Attacks raise your contribution. Castles regain 3% durability per hour. The King can also repair a castle right away with national funds (from 10 funds per HP, ×1.5 each time you repair the same castle).</p>
  <p>💥 Destroying a castle steals that nation's funds and the site becomes your territory (the King can build a castle there for 100,000 of national funds; if nothing is built within 1 hour, it becomes free land). Citizens inside fall. <b>If the King's castle is destroyed, that nation is defeated</b> (all its castles collapse and all its funds are taken).</p>
  <p>👹 <b>Monster Castles</b>: during a season they often appear on free spots (up to 2 per island, more often on islands with few adventurers). They grow at about half the average castle level of the island's nations, and every 15 min they fire cannons at nearby nations' castles! Their HP is low — about 5 weapon attacks by citizens will destroy one. Destroy one to add 100,000 to your national funds and claim the site as territory.</p>
  <p>🗺 Only Grassland Isle is open at first. Once every spot on the newest island is filled by nations (castles and territory) even once during the season, the next island opens (Desert → Ice → Volcano).</p>
  <p>📋 Use the <b>Nation board</b> in Nation details to message your King and fellow citizens (anonymous, only your nation can see it).</p>
  <p>🎭 Kings and citizens are all <b>anonymous</b> — no names are shown, even inside your own nation (shown as "King", "Citizen 1"…).</p>
  <p>🔰 A nation founded after the season starts gets a 🔰 mark for its first hour and can't be attacked by other nations.</p>
  <p>💀 If you fall, you lose 50,000 coins. There's no waiting time — you can found a nation again right away (you can only join a nation that has just one starting castle).</p>
  <p>🏆 Nations are ranked on each island by <b>national funds</b>. After 180 hours, the island shows the "Candidates" (top 4). When the season ends, the top 4 nations by funds become the Four Heavenly Kings, ranked 1–4.</p>
  <p>👑 <b>Best-rank bonus</b>: the King's rewards (founding gift, castle income, season rewards) grow with your best ranked placement: #1 ×3 · #2–3 ×2.5 · #4–10 ×2 · #11–30 ×1.5 · #31–100 ×1.2.</p>
  <p>💰 <b>Rewards</b>: up to 10,000,000 of the funds are shared out (anything above is lost). The King gets 70% (100% if there are no citizens); citizens split the rest by contribution (very low contributors get −1,000). #1 keeps it all, #2 80%, #3 50%, #4 20%. On top of that, the <b>top 3 nations of each island</b> split a prize among everyone including the King (#1: 1,000,000 · #2: 500,000 · #3: 300,000). Kings and citizens get a profile title, and the #1 nation's ad appears on the island screen all next season.</p>`)}</div>`,[[K_("閉じる","Close"),null]],{cls:"wide"}); }

/* 描画（opt.shot：プロフィール用の写真＝土台とキャラを大きめに） */
function defDraw(g,W,H,R,opt){
  const front=defFront(R), viewW=opt.shot?Math.max(5.8,front+3.8):DEF.W, ox=opt.shot?0.45:0, u=W/viewW, GY=opt.shot?H*0.8:Math.min(H*0.86,H-u*0.5);   // 写真は少し引いて、全体が入るように
  const t=performance.now()/1000;
  g.save(); g.imageSmoothingEnabled=false;
  if(DV.shake>0&&!opt.shot) g.translate((Math.random()-.5)*8*DV.dpr,(Math.random()-.5)*6*DV.dpr);
  // 背景：空・雲・山
  const sk=g.createLinearGradient(0,0,0,GY); sk.addColorStop(0,"#3f9fe8"); sk.addColorStop(0.7,"#8fd0ff"); sk.addColorStop(1,"#cdeeff"); g.fillStyle=sk; g.fillRect(0,0,W,GY);
  ["c1","c3","c2","c4"].forEach((n,i)=>{ const im=defImg("title/"+n+".png"); if(!im.complete||!im.naturalWidth) return; const w=W*(0.42+0.1*i), h=w*im.naturalHeight/im.naturalWidth, span=W+w*2;
    const x=((i*0.29*span + t*W*0.004*(1+i*0.4))%span)-w; g.globalAlpha=.95; g.drawImage(im,x,GY*(0.08+0.17*i),w,h); g.globalAlpha=1; });
  const mt=(col,base,amp,seed,step)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(0,GY); for(let x=0;x<=W+step;x+=step){ const k=x/W*Math.PI;
      const y=GY-base-amp*(0.55+0.45*Math.sin(k*2.1+seed))*(0.6+0.4*Math.sin(k*5.3+seed*2)); g.lineTo(x,Math.round(y/step)*step); } g.lineTo(W,GY); g.fill(); };
  const st=Math.max(4,Math.round(u*0.12)); mt("#7fa9d8",u*0.9,u*1.6,1.3,st); mt("#4f9a5a",u*0.35,u*1.0,4.1,st); mt("#3b8045",0,u*0.55,2.2,st);
  // 地面
  g.fillStyle="#7a4f2a"; g.fillRect(0,GY,W,H-GY); g.fillStyle="#6a4222"; const px=Math.max(4,u*0.09);
  for(let x=0;x<W;x+=px*4) for(let y=GY+px*3;y<H;y+=px*3) if(((x/px+y/px)|0)%3===0) g.fillRect(x,y,px,px);
  g.fillStyle="#5ec53a"; g.fillRect(0,GY-px*0.5,W,px*2.2); g.fillStyle="#3f9a25"; for(let x=0;x<W;x+=px*2) g.fillRect(x,GY-px*1.2,px,px*1.2);
  const X=x=>(x+ox)*u, Y=y=>GY-y*u, lay=defLayout(R.sel), sp=defShooters(R);
  // 扇風機
  if(R.fanT>0){ const fx=X(front+0.12), fy=Y(0.55), r=u*0.32; g.fillStyle="#555"; g.fillRect(fx-u*0.03,fy,u*0.06,GY-fy);
    g.save(); g.translate(fx,fy); g.rotate(t*25); g.fillStyle="#9fd6ff"; for(let k=0;k<3;k++){ g.rotate(Math.PI*2/3); g.beginPath(); g.ellipse(r*0.5,0,r*0.5,r*0.18,0,0,7); g.fill(); } g.restore();
    g.fillStyle="#2a7ad8"; g.beginPath(); g.arc(fx,fy,u*0.07,0,7); g.fill();
    g.strokeStyle="#ffffffaa"; g.lineWidth=2*DV.dpr; for(let k=0;k<4;k++){ const yy=fy-u*0.3+k*u*0.2, xx=fx+u*0.4+((t*3+k*0.37)%1)*u*1.2; g.beginPath(); g.moveTo(xx,yy); g.lineTo(xx+u*0.3,yy); g.stroke(); } }
  // 土台とキャラ
  lay.forEach((b,i)=>{ const bi=defImg(i?DEF.SUB_BASE.img:DEF.BASES[R.sel.base].img);
    if(bi.complete){ const w=(b.w*u), h=w*bi.naturalHeight/bi.naturalWidth*(i?1:1); g.drawImage(bi,X(b.x),GY-h+u*0.04,w,h); b.hpx=h; }
    const c=sp[i]; if(!c) return; const ch=DEF.CH[c], ci=defImg(ch.img); if(!ci.complete) return;
    const cw=(ch.w*u), chh=cw*ci.naturalHeight/ci.naturalWidth, cast=DV.cast[i]>0&&!opt.shot?DV.cast[i]/0.3:0, bob=Math.sin(t*3+i)*u*0.025;
    const baseTop=GY-(b.hpx||(b.h*u))+u*0.06, cx=X(b.x+b.w/2);
    g.save(); g.translate(cx,baseTop+bob);
    const sq=1+Math.sin(cast*Math.PI)*0.14; g.rotate(-Math.sin(cast*Math.PI)*0.12); g.scale(1/Math.sqrt(sq),sq);
    g.drawImage(ci,-cw/2,-chh,cw,chh); g.restore();
    if(cast>0.5){ const tx=cx+cw*(ch.tip[0]-0.5), ty=baseTop-chh*(1-ch.tip[1]); g.fillStyle=ch.bolt; g.globalAlpha=cast; g.beginPath(); g.arc(tx,ty,u*0.14*cast,0,7); g.fill(); g.globalAlpha=1; } });
  // 壁
  if(R.wall){ const wx=X(defWallX(R)), wh=u*1.55, ww=u*0.26; g.fillStyle="#8a5a2b"; g.fillRect(wx,GY-wh,ww,wh); g.strokeStyle="#2b1a0a"; g.lineWidth=3*DV.dpr; g.strokeRect(wx,GY-wh,ww,wh);
    g.strokeStyle="#5b3a17"; g.lineWidth=2*DV.dpr; for(let k=1;k<5;k++){ g.beginPath(); g.moveTo(wx+ww*0.3,GY-wh*k/5); g.lineTo(wx+ww*0.45,GY-wh*k/5+u*0.1); g.stroke(); }
    g.fillStyle="#444"; for(let k=0;k<6;k++){ const yy=GY-wh+u*0.12+k*wh/6; g.beginPath(); g.moveTo(wx+ww,yy); g.lineTo(wx+ww+u*0.1,yy+u*0.05); g.lineTo(wx+ww,yy+u*0.1); g.fill(); }
    const p=Math.max(0,R.wall.hp/R.wall.max); g.fillStyle="#000a"; g.fillRect(wx-u*0.05,GY-wh-u*0.12,ww+u*0.1,u*0.06); g.fillStyle="#ffcc33"; g.fillRect(wx-u*0.05,GY-wh-u*0.12,(ww+u*0.1)*p,u*0.06); }
  // 敵
  const ei=defImg("adv/sl_s.png");
  R.en.forEach(e=>{ if(!ei.complete) return; const eh=u*0.58, ew=eh*ei.naturalWidth/ei.naturalHeight, hop=e.hp>0?Math.abs(Math.sin(e.ph))*u*0.12:0, lunge=e.at>0?-u*0.12*Math.sin(e.at/0.3*Math.PI):0;
    const cx=X(e.x)+ew/2+lunge, al=e.hp>0?1:Math.max(0,1-e.dead/0.6), sq=e.hp>0?1+Math.sin(e.ph*2)*0.05:1+e.dead;
    g.save(); g.globalAlpha=al; g.translate(cx,GY-hop+u*0.02); g.scale(-1,1); g.scale(sq,1/sq);
    if(e.hit>0) g.filter="brightness(2.2)"; else if(R.prov>0) g.filter=`hue-rotate(${Math.min(160,R.prov*45)}deg) saturate(${1+R.prov*0.3})`;
    g.drawImage(ei,-ew/2,-eh,ew,eh); g.restore(); g.filter="none";
    if(e.hp>0&&!opt.shot){ const bw=ew*0.8, by=GY-hop-eh-u*0.12; g.fillStyle="#000a"; g.fillRect(cx-bw/2,by,bw,u*0.06); g.fillStyle="#3cff4a"; g.fillRect(cx-bw/2,by,bw*Math.max(0,e.hp/e.max),u*0.06);
      if(u>34){ g.font=`900 ${Math.round(u*0.16)}px sans-serif`; g.textAlign="center"; g.fillStyle="#fff"; g.strokeStyle="#000"; g.lineWidth=3; const s="Lv."+(1+R.prov)+" "+defT("スライム"); g.strokeText(s,cx,by-u*0.04); g.fillText(s,cx,by-u*0.04); } } });
  // 魔法の弾
  R.bolts.forEach(b=>{ const ch=DEF.CH[b.c], r=u*(b.sup?0.22:0.09), x=X(b.x), y=Y(b.y);
    const gr=g.createRadialGradient(x,y,0,x,y,r*1.8); gr.addColorStop(0,"#fff"); gr.addColorStop(0.35,b.sup?"#ffe14a":ch.bolt); gr.addColorStop(1,"#0000"); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r*1.8,0,7); g.fill(); });
  // コインのポップ
  if(!opt.shot) DV.pops.forEach(p=>{ g.globalAlpha=1-p.t; g.font=`900 ${Math.round(u*0.22)}px sans-serif`; g.textAlign="center"; g.lineWidth=4; g.strokeStyle="#5a3a00"; g.fillStyle="#ffe14a";
    const y=Y(p.y+p.t*0.6); g.strokeText(p.s,X(p.x),y); g.fillText(p.s,X(p.x),y); g.globalAlpha=1; });
  if(DV.flash>0&&!opt.shot){ g.fillStyle=`rgba(255,240,150,${DV.flash})`; g.fillRect(0,0,W,H); }
  g.restore();
}

function advBindInput(el){

  let pid=null;
  const move=e=>{ const r=st.getBoundingClientRect(), cx=r.left+r.width/2, R=r.width/2;
    let dx=(e.clientX-cx)/R; dx=Math.max(-1,Math.min(1,dx)); A.moveIn=Math.abs(dx)<0.15?0:dx; kn.style.transform=`translate(calc(-50% + ${dx*R*0.55}px),-50%)`; };
  st.addEventListener("pointerdown",e=>{ pid=e.pointerId; st.setPointerCapture(pid); move(e); e.preventDefault(); });
  st.addEventListener("pointermove",e=>{ if(e.pointerId===pid) move(e); });
  const up=e=>{ if(e.pointerId!==pid) return; pid=null; A&&(A.moveIn=0); kn.style.transform="translate(-50%,-50%)"; };
  st.addEventListener("pointerup",up); st.addEventListener("pointercancel",up);
  el.querySelector("#apJump").addEventListener("pointerdown",e=>{ e.preventDefault(); advJump(); });

/* ---------- ループ ---------- */
function advLoop(now){
  if(!A) return;
  const dt=Math.min(0.05,(now-A.last)/1000); A.last=now;
  if(!document.hidden) advStep(dt);
  advDraw(); advHud();
  advRaf=requestAnimationFrame(advLoop);
}
function advStep(dt){
  if(A.dead){ A.deadT+=dt; return; }
  if(A.over) return;
  const pz=advPaused(); document.getElementById("advPause")?.classList.toggle("on",pz);
  if(pz) return;   // リュックを開いている間は、タイマーも魔物も止まる
  A.t+=dt*1000;
  if(!A.counted && A.t>=ADV.COUNT_SEC*1000){ A.counted=true; S.advCount=(S.advCount||0)+1; save(); }   // 30秒をこえたら冒険回数+1
  // 移動
  let mv=A.moveIn; if(A.keys["arrowleft"]||A.keys["a"]) mv=-1; if(A.keys["arrowright"]||A.keys["d"]) mv=1;
  let autoW=false; if(!mv && advAuto){ mv=A.dir; autoW=true; }   // オート移動：向いている方へ歩きつづける（スティックで向きを変えられる）
  const spd=autoW?0.19:0.55; A.vx=mv*spd;   // オート移動は少しゆっくり if(mv) A.dir=mv>0?1:-1;
  A.x+=A.vx*dt; if(mv) A.walkT+=dt*8;
  A.vy-=3.4*dt; A.y+=A.vy*dt; if(A.y<=0){ A.y=0; A.vy=0; if(!A.onGround){ A.onGround=true; A.jumps=0; } }
  A.flapT=Math.max(0,A.flapT-dt); A.hurtT=Math.max(0,A.hurtT-dt); A.inv0=Math.max(0,A.inv0-dt);
  // 放置チェック：30秒動かないとLv100の魔物
  if(Math.abs(A.x-A.lastX)>0.02 || !A.onGround){ A.lastX=A.x; A.idleT=0; A.idleSpawned=false; } else A.idleT+=dt;
  if(A.idleT>=ADV.IDLE_SEC && !A.idleSpawned){ A.idleSpawned=true; advSpawn(10,"idle"); advMsg(advT2("⚠️ 動かずにいたら、ボスなみに強い魔物がやってきた…！")); }
  // カメラ
  const viewW=A.W/A.P; A.cam+=(A.x-viewW*0.38-A.cam)*Math.min(1,dt*6);
  // 宝箱：新しい場所へ進むたび
  const ch=Math.floor(A.x/ADV.CHUNK);
  if(ch>A.chunksR){ A.chunksR=ch; advMaybeChest(1); } if(ch<A.chunksL){ A.chunksL=ch; advMaybeChest(-1); }
  // 敵の出現：1分ごとに敵のLvが上がる（Lv1〜9は4体ずつ、Lv10は1体ずつ）。たおしても、そのLvの1分間はずっと補充される
  const lvNow=Math.min(10, Math.floor(A.t/ADV.LV_MS)+1);
  if(lvNow!==A.stageLv){ A.stageLv=lvNow; A.nextSpawn=0.6; advMsg(lvNow>=10?advT2("👑 Lv10のボスが現れはじめた！"):advT2("Lv{n}の魔物が現れはじめた！").replace("{n}",lvNow)); }
  const lv=A.stageLv, keep=lv>=10?ADV.ON_FIELD_BOSS:ADV.ON_FIELD;
  A.nextSpawn-=dt;
  if(A.nextSpawn<=0){ const alive=A.enemies.filter(e=>!e.dead&&!e.extra&&!e.lure&&e.lv===lv).length;
    if(alive<keep){ advSpawn(lv); A.spawned++; }
    A.nextSpawn=0.35+Math.random()*0.5; }
  // 5分たったら終わり（生き延びたらステージクリア）
  if(A.t>=ADV.LIMIT_MS){ A.t=ADV.LIMIT_MS; advFinish("time"); return; }
  // 攻撃
  if(A.atk){ const a=A.atk; a.t+=dt;
    if(a.dr){ if(!a.fired && a.t>=0.34){ a.fired=true; advDrFire(a); } }
    else if(a.kind==="tm" && !a.hit && a.t>=0.16){ a.hit=true; advMelee(); }
    else if(a.kind!=="tm" && !a.fired && a.t>=(a.kind==="tf"||a.kind==="tr"?0.5:0.3)){ a.fired=true; advFire(a.it); }
    if(a.t>=a.dur) A.atk=null; }
  // 弾
  // 魔法：ねらった的（敵か宝箱）に向かって飛んでいく
  A.bolts.forEach(b=>{ b.life-=dt;
    if(b.pierce){ b.x+=b.dir*2.4*dt; if(Math.abs(b.x-b.x0)>ADV.MAGIC_RANGE*1.4) b.life=0;   // 貫通する氷の魔法弾
      A.enemies.forEach(e=>{ if(e.dead||b.hits.includes(e)) return; const ey=(e.y||0); if(Math.abs(e.x-b.x)<e.w*0.5+0.05 && b.y>ey-0.04 && b.y<ey+advEH(e)+0.06){ b.hits.push(e);

      A.chests.forEach(c=>{ if(c.open||b.hits.includes(c)) return; if(Math.abs(c.x-b.x)<0.07 && b.y<0.2){ b.hits.push(c); advHitChest(c); } });
      return; }
    const tg=b.tg;
    if(tg && !(tg.dead||tg.open)){ const tx=tg.x, ty=tg.chest?0.05:(tg.y||0)+advEH(tg)*0.5, dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy), st=2.4*dt;
      if(d<=st+0.02){ b.life=0; if(b.boom) A.drBooms.push({x:tg.x,y:tg.chest?0.05:(tg.y||0)+advEH(tg)*0.5,t:0,img:b.boom}); if(tg.chest) advHitChest(tg); else { advDamageEnemy(tg,b.dmg); if(b.fire){ (A.booms=A.booms||[]).push({x:tg.x,y:(tg.y||0)+advEH(tg)*0.5,t:0,big:!!tg.boss}); if(!tg.dead) advIgnite(tg,b.fire,b.dmg); } if(b.freeze&&!tg.dead){ tg.frozen=ADV.FREEZE0/Math.pow(2,tg.fz||0); tg.fz=(tg.fz||0)+1; } } }   // 氷：最初は2秒、同じ魔物は氷の耐性がついて半分ずつ短くなる
      else { b.x+=dx/d*st; b.y+=dy/d*st; } }
    else { b.tg=null; b.x+=b.dir*2.4*dt; if(Math.abs(b.x-b.x0)>ADV.MAGIC_RANGE) b.life=0; } });
  A.bolts=A.bolts.filter(b=>b.life>0);
  if(A.drBooms){ A.drBooms.forEach(o=>o.t+=dt); A.drBooms=A.drBooms.filter(o=>o.t<0.4); }
  advWinds(dt); advBurns(dt);
  // 敵
  A.enemies.forEach(e=>advEnemy(e,dt));
  A.enemies=A.enemies.filter(e=>!(e.dead&&e.deadT>0.6) && Math.abs(e.x-A.x)<14);
  A.chests.forEach(c=>{ if(c.open) c.openT+=dt; });
  if(A.graves){ A.graves.forEach(gv=>gv.t+=dt); A.graves=A.graves.filter(gv=>Math.abs(gv.x-A.x)<20).slice(-40); }
  A.chests=A.chests.filter(c=>!(c.open&&c.openT>4) && Math.abs(c.x-A.x)<20);

}
